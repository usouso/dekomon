<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>でこもん つくりなおし</title>
<style>
:root { --bg:#141824; --panel:#1f2535; --panel2:#2a3146; --ink:#f4f1ea; --dim:#aab0c0; --atk:#e5534b; --def:#4a8fe7; --mov:#46b85a; --luck:#e8b923; --st:#a66bd6; --heart:#ff6b8a; }
* { box-sizing: border-box; }
html { font-size: 16px; }
@media (min-width: 1700px) and (min-height: 850px) { html { font-size: 20px; } }
@media (max-width: 700px) { html { font-size: 15px; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family: "Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
.screen { display:none; min-height:100vh; padding: .6rem .8rem 4.2rem; max-width: 1400px; margin: 0 auto; }
.screen.on { display:block; }
h1 { margin:.4rem 0; font-size:2.2rem; letter-spacing:.1em; }
h2 { margin:.2rem 0 .5rem; font-size:1.3rem; }
.big { font-size:1.15rem; padding:.6rem 1.6rem; border-radius:.8rem; border:3px solid #ffcc4d; background:#3a2f10; font-weight:900; }
.btn { padding:.45rem 1rem; border-radius:.6rem; border:2px solid #556; background:var(--panel2); font-weight:800; }
.btn:hover, .big:hover { filter: brightness(1.2); }
.row { display:flex; gap:.8rem; align-items:flex-start; flex-wrap:wrap; }
.center { text-align:center; }
.top { display:flex; align-items:center; gap:1rem; margin-bottom:.4rem; min-height:2.2rem; }
.hearts { font-size:1.5rem; color:var(--heart); letter-spacing:.1em; }
.hearts .off { color:#444b5c; }
.stage { color:var(--dim); font-weight:800; }
.dots { display:flex; gap:.25rem; } .dots i { width:.7rem; height:.7rem; border-radius:50%; background:#3a4256; display:block; } .dots i.w { background:#7ee787; } .dots i.now { background:#ffcc4d; } .dots i.boss { border-radius:2px; }
/* カード：自分も 相手も 同じ 形 */
.card { background:var(--panel); border:3px solid #3a4256; border-radius:1rem; padding:.5rem .6rem; width: 15.5rem; position:relative; }
.card.me { border-color:#7fd1ae; }
.card.hard { border-color:#ff7a59; }
.card .nm span:first-child { white-space:nowrap; }
.card .nm { font-weight:900; font-size:1.15rem; display:flex; justify-content:space-between; align-items:center; gap:.3rem; }
.card .sub { color:var(--dim); font-size:.85rem; font-weight:700; }
.card .pic { height:6.2rem; display:flex; justify-content:center; }
.card .pic svg { height:100%; }
.stats { display:grid; grid-template-columns: repeat(5, 1fr); gap:.15rem; margin:.3rem 0; }
.stat { background:#151a27; border-radius:.45rem; text-align:center; padding:.15rem 0; }
.stat .ic { font-size:.85rem; color:var(--dim); font-weight:800; display:block; }
.stat b { font-size:1.25rem; }
.stat .d { font-size:.8rem; font-weight:900; display:block; min-height:.9rem; line-height:.9rem; }
.stat .d.up { color:#7ee787; } .stat .d.dn { color:#ff8a8a; }
.kws { display:flex; flex-wrap:wrap; gap:.25rem; min-height:1.7rem; }
.kw { border-radius:999px; padding:.1rem .55rem; font-size:.85rem; font-weight:900; border:2px solid; background:#151a27; cursor:help; }
.kw.atk { border-color:var(--atk); color:#ffb0aa; } .kw.def { border-color:var(--def); color:#b4d3ff; } .kw.mov { border-color:var(--mov); color:#b5f0bf; } .kw.luck { border-color:var(--luck); color:#ffe9a0; } .kw.st { border-color:var(--st); color:#e3c4ff; }
.kw.born { box-shadow: 0 0 0 2px #fff3 inset; }
.kw.fx-glow, .ptile.fx-glow, .wz.fx-glow { animation: fxglow .6s ease-out; }
@keyframes fxglow { 0% { transform:scale(1.25); box-shadow:0 0 18px 6px #ffe066; } 100% { transform:scale(1); box-shadow:none; } }
.ptiles { display:flex; gap:.3rem; margin-top:.35rem; flex-wrap:wrap; }
.ptile { width:3.1rem; height:3.1rem; border-radius:.55rem; border:3px solid; background:#151a27; display:flex; align-items:center; justify-content:center; position:relative; }
.ptile svg { width:2.5rem; height:2.5rem; }
.ptile.atk { border-color:var(--atk); } .ptile.def { border-color:var(--def); } .ptile.mov { border-color:var(--mov); }
.ptile.empty { border-style:dashed; border-color:#555d70; color:#555d70; font-size:.75rem; font-weight:800; }
.wzs { display:flex; gap:.25rem; flex-wrap:wrap; margin-top:.3rem; }
.wz { font-size:.8rem; font-weight:900; padding:.1rem .45rem; border-radius:.35rem; background:#3b2f55; border:2px solid #9b7fe0; cursor:help; }
.tag { white-space:nowrap; font-size:.8rem; font-weight:900; padding:.05rem .45rem; border-radius:.35rem; }
.tag.hard { background:#ff7a59; color:#2a0f05; }
/* 下の 説明の 帯（合わせる／タップで 出る） */
#tip { position:fixed; left:0; right:0; bottom:0; min-height:3.4rem; background:#0d1018ee; border-top:2px solid #3a4256; padding:.45rem 1rem; font-size:1rem; font-weight:700; z-index:20; }
#tip b { color:#ffe066; }
/* 種類を 選ぶ */
.spgrid { display:grid; grid-template-columns: repeat(auto-fit, 15.5rem); gap:.8rem; justify-content:center; }
.spgrid .card { cursor:pointer; }
.spgrid .card:hover { border-color:#ffcc4d; }
.theme { font-weight:900; color:#ffe066; }
/* わかれみち */
.forkw { display:flex; gap:1rem; justify-content:center; align-items:stretch; flex-wrap:wrap; }
.road { display:flex; flex-direction:column; align-items:center; gap:.4rem; background:#1a2030; border-radius:1rem; padding:.6rem; border:3px solid transparent; cursor:pointer; }
.road:hover { border-color:#ffcc4d; }
.road .gift { font-weight:900; font-size:.95rem; }
.vs { align-self:center; font-weight:900; color:var(--dim); font-size:1.3rem; }
/* じゅんび */
.prepw { display:flex; gap:1rem; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
.slots { background:#1a2030; border-radius:1rem; padding:.6rem; width: 27rem; }
.slot { display:flex; gap:.5rem; align-items:center; padding:.35rem; border-radius:.7rem; margin-bottom:.35rem; background:#151a27; }
.slot .rn { width:3.6rem; font-weight:900; text-align:center; border-radius:.5rem; padding:.2rem 0; }
.slot.atk .rn { background:var(--atk); } .slot.def .rn { background:var(--def); } .slot.mov .rn { background:var(--mov); }
.owned { display:flex; gap:.3rem; flex-wrap:wrap; flex:1; }
.owned .ptile { cursor:pointer; opacity:.55; }
.owned .ptile.eq { opacity:1; box-shadow:0 0 0 3px #fff inset; }
.owned .ptile.fx-hint { animation: fxhint 1s infinite alternate; opacity:1; }
@keyframes fxhint { from { box-shadow:0 0 0 0 #ffe066; } to { box-shadow:0 0 14px 5px #ffe066; } }
.pname { font-size:.7rem; white-space:nowrap; overflow:hidden; position:absolute; bottom:-.05rem; left:0; right:0; text-align:center; font-weight:800; color:#fff; text-shadow:0 0 3px #000, 0 0 3px #000; line-height:1; }
.actions { display:flex; gap:.6rem; justify-content:center; margin-top:.6rem; flex-wrap:wrap; }
/* 戦い */
.bw { display:grid; grid-template-columns: 15.5rem 1fr 15.5rem; gap:.8rem; align-items:start; }
.hpbar { height:1.1rem; background:#3a2530; border-radius:.5rem; overflow:hidden; border:2px solid #000; margin-top:.2rem; }
.hpbar i { display:block; height:100%; background:linear-gradient(#7ee787,#3fa94b); transition: width .25s; }
.hpnum { font-weight:900; font-size:1.2rem; text-align:right; }
.stage2 { position:relative; height: 14rem; background:#1a2030; border-radius:1rem; overflow:hidden; }
.stage2 .mp, .stage2 .ep { position:absolute; bottom:.6rem; height:9.5rem; transition: transform .15s; }
.stage2 .mp { left:8%; } .stage2 .ep { right:8%; }
.stage2 svg { height:100%; }
.fx-hitme { transform: translateX(-10px); } .fx-hitthem { transform: translateX(10px); }
.pop { position:absolute; left:0; right:0; top:.2rem; z-index:2; text-align:center; font-size:2.2rem; font-weight:900; pointer-events:none; text-shadow:0 0 8px #000; }
.pop.crit { color:#ffe066; } .pop.dodge { color:#9fd8ff; }
.dmg { position:absolute; font-weight:900; font-size:1.8rem; text-shadow:0 0 6px #000; pointer-events:none; animation: fxfloat .9s ease-out forwards; }
@keyframes fxfloat { from { transform: translateY(0); opacity:1; } to { transform: translateY(-2.5rem); opacity:0; } }
.logw { background:#10131d; border-radius:.8rem; height: 12.5rem; overflow-y:auto; padding:.3rem .5rem; margin-top:.5rem; font-size:.9rem; }
.logw div { padding:.08rem 0; border-bottom:1px solid #1d2232; }
.logw .p { color:#a9f0c6; } .logw .e { color:#ffb7a8; } .logw .s { color:#ffe066; }
.logw .kwline { cursor:help; text-decoration: underline dotted; }
.speed { position:absolute; left:50%; transform:translateX(-50%); bottom:.4rem; font-size:.85rem; padding:.25rem .6rem; }
/* 結果 */
.resw { max-width: 40rem; margin: 0 auto; text-align:center; }
.reason { background:#2a1f2a; border:3px solid #ff8fab; border-radius:1rem; padding:1rem; margin:.6rem auto; }
.reason .rt { font-size:1.45rem; font-weight:900; }
.reason .rh { margin-top:.5rem; font-size:1.1rem; color:#ffe066; font-weight:800; }
.cmp { display:flex; justify-content:center; gap:1.4rem; margin-top:.5rem; font-weight:900; }
.lvl { display:inline-grid; grid-template-columns: auto auto; gap:.2rem 1rem; text-align:left; font-size:1.2rem; font-weight:900; margin:.5rem auto; }
.lvl .fx-up { color:#7ee787; opacity:0; animation: fxin .3s forwards; }
@keyframes fxin { to { opacity:1; } }
#titlePic svg { height:100%; }
#log2 { height: 6.5rem; }
.hall { max-width: 40rem; margin:.6rem auto; text-align:left; font-size:.9rem; color:var(--dim); }
@media (max-width: 700px) {
  .spgrid { grid-template-columns: repeat(2, 1fr); }
  .card { width: 100%; }
  .forkw { flex-direction:column; align-items:stretch; }
  .road .card { width:100%; }
  .vs { display:none; }
  .slots { width:100%; }
  .bw { grid-template-columns: 1fr 1fr; }
  .bw .mid { grid-column: 1 / 3; grid-row: 1; }
  .stage2 { height: 10rem; } .stage2 .mp, .stage2 .ep { height:7rem; }
  .card .pic { height:4.5rem; }
  .logw { height: 9rem; }
  .bw .card .ptiles .ptile { width:2.5rem; height:2.5rem; } .bw .card .ptiles .ptile svg { width:2rem; height:2rem; }
  .bw .card .stat b { font-size:1rem; }
}
</style>
</head>
<body>
<div id="title" class="screen on center">
  <h1>でこもん</h1>
  <div class="sub" style="color:var(--dim);font-weight:800">つくりなおしの 版（ためしに あそぶ ところ）</div>
  <div id="titlePic" style="height:9rem;margin:.6rem 0;display:flex;justify-content:center"></div>
  <div class="actions"><button class="big" id="bStart">▶ はじめる</button><button class="big" id="bCont" style="display:none">つづきから</button></div>
  <div class="hall" id="hall"></div>
</div>
<div id="species" class="screen">
  <h2 class="center">どの 子と いっしょに のぼる？</h2>
  <div class="spgrid" id="spgrid"></div>
</div>
<div id="fork" class="screen">
  <div class="top"><span class="hearts" id="fHearts"></span><span class="stage" id="fStage"></span><span class="dots" id="fDots"></span></div>
  <h2 class="center" id="fTitle">どっちの 道に いく？</h2>
  <div class="forkw" id="forkw"></div>
</div>
<div id="prep" class="screen">
  <div class="top"><span class="hearts" id="pHearts"></span><span class="stage" id="pStage"></span><span class="dots" id="pDots"></span></div>
  <div class="prepw">
    <div class="card me" id="pMe"></div>
    <div class="slots" id="slots"></div>
    <div id="pFoe"></div>
  </div>
  <div class="actions"><button class="btn" id="bBack">◀ 道を えらびなおす</button><button class="btn" id="bHint" style="display:none">💡 ヒント</button><button class="big" id="bFight">たたかう！</button></div>
</div>
<div id="battle" class="screen">
  <div class="top"><span class="hearts" id="bHearts"></span><span class="stage" id="bStage"></span></div>
  <div class="bw">
    <div id="bMe"></div>
    <div class="mid">
      <div class="stage2" id="arena"><div class="mp" id="aMe"></div><div class="ep" id="aFoe"></div><div class="pop" id="pop"></div><button class="btn speed" id="bSkip">はやく ▶▶</button></div>
      <div class="logw" id="log"></div>
    </div>
    <div id="bFoe"></div>
  </div>
</div>
<div id="result" class="screen"><div class="resw" id="resw"></div></div>
<div id="tip">カードの <b>ことば</b>（キーワード）や パーツに 合わせる・タップすると、ここに せつめいが でるよ。</div>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var S = window.DekoRe, C = S.CFG;
  var Q = new URLSearchParams(location.search);
  var AUTO = Q.get('auto') === '1', SPEED = parseFloat(Q.get('speed') || '1') || 1;
  var KEY = 'remake.';
  function lsGet(k, d) { try { var v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
  if (Q.get('reset') === '1') { try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(KEY) === 0) localStorage.removeItem(k); }); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  var G = { run: lsGet('run', null), road: 0, hint: null, playing: null };
  if (G.run && G.run.over) { recordHall(G.run); G.run = null; lsSet('run', null); }

  function show(id) { Array.prototype.forEach.call(document.querySelectorAll('.screen'), function (s) { s.classList.toggle('on', s.id === id); }); window.scrollTo(0, 0); }
  function save() { lsSet('run', G.run); }

  // 殿堂に のせる（おわった 周回。「おわり」を 押さずに 閉じても 次に 開いた ときに のせる）
  function recordHall(run) {
    var hall = lsGet('hall', []);
    hall.push({ name: run.name, sp: S.SPECIES_BY_ID[run.species].name, wins: run.wins, clear: run.clear, parts: run.owned.slice(), at: Date.now() });
    lsSet('hall', hall.slice(-50));
  }
  // ---------- 絵 ----------
  function bodyShape(shape, color) {
    var st = ' fill="' + color + '" stroke="#111" stroke-width="4"';
    switch (shape) {
      case 'tall': case 'slim': return '<ellipse cx="100" cy="118" rx="42" ry="58"' + st + '/>';
      case 'wide': case 'big': return '<ellipse cx="100" cy="126" rx="64" ry="44"' + st + '/>';
      case 'dome': return '<path d="M44 128 Q44 62 100 62 Q156 62 156 128 Z"' + st + '/>';
      case 'block': return '<rect x="46" y="70" width="108" height="98" rx="24"' + st + '/>';
      case 'blob': return '<path d="M46 130 Q48 70 100 72 Q154 74 154 125 Q152 168 100 166 Q48 165 46 130Z"' + st + '/>';
      default: return '<circle cx="100" cy="120" r="54"' + st + '/>';
    }
  }
  var PART_ART = {
    tail: '<path d="M54 140 Q10 150 18 110 Q22 96 36 104 Q30 126 58 128Z" fill="#a0693d" stroke="#5a2d0c" stroke-width="3"/>',
    longtail: '<path d="M52 142 Q0 160 8 100" fill="none" stroke="#c99a5b" stroke-width="7" stroke-linecap="round"/>',
    wing: '<path d="M96 96 Q62 36 28 66 Q56 72 50 96 Q74 84 96 102Z" fill="#dff0ff" stroke="#5f9fd0" stroke-width="3"/>',
    spring: '<g fill="none" stroke="#c9c9c9" stroke-width="6"><polyline points="72,160 62,170 80,178 62,187 80,196 72,203"/><polyline points="104,162 94,172 112,180 94,189 112,198 104,203"/></g>',
    longleg: '<g stroke="#8d6e63" stroke-width="7" stroke-linecap="round"><path d="M78 160 L66 204"/><path d="M112 160 L124 204"/></g>',
    shell: '<path d="M54 134 Q100 178 150 134 Q152 162 100 176 Q48 162 54 134Z" fill="#b5651d" stroke="#5a2d0c" stroke-width="3"/>',
    scale: '<g fill="#8f9aa6" stroke="#3b434d" stroke-width="2"><rect x="62" y="136" width="20" height="14" rx="4"/><rect x="86" y="142" width="20" height="14" rx="4"/><rect x="110" y="142" width="20" height="14" rx="4"/><rect x="74" y="154" width="20" height="14" rx="4"/><rect x="98" y="158" width="20" height="14" rx="4"/></g>',
    spike: '<g fill="#e8e8e8" stroke="#444" stroke-width="2.5"><polygon points="52,100 64,58 80,96"/><polygon points="76,86 90,44 104,84"/><polygon points="100,80 114,42 126,80"/></g>',
    weight: '<rect x="62" y="56" width="56" height="34" rx="8" fill="#6d6f78" stroke="#2a2c33" stroke-width="3"/>',
    fur: '<g fill="#f3e9d2" stroke="#b9a37a" stroke-width="2"><circle cx="70" cy="86" r="12"/><circle cx="88" cy="76" r="13"/><circle cx="108" cy="74" r="12"/><circle cx="126" cy="80" r="11"/></g>',
    horn: '<polygon points="124,82 142,34 152,86" fill="#f5d76e" stroke="#7a5c00" stroke-width="3"/>',
    eye: '<g fill="none" stroke="#ffe066" stroke-width="3"><circle cx="128" cy="104" r="17"/></g>',
    claw: '<g fill="#f3f3f3" stroke="#333" stroke-width="2" transform="translate(134,156)"><polygon points="0,0 7,24 14,2"/><polygon points="12,0 19,26 26,2"/><polygon points="24,0 31,24 38,2"/></g>',
    crush: '<g fill="#7a4a2a" stroke="#2a1a0a" stroke-width="3" transform="translate(132,150)"><polygon points="0,0 14,36 30,0"/><polygon points="18,4 34,38 46,2"/></g>',
    fang: '<g fill="#f7f0ff" stroke="#6a3fa0" stroke-width="2"><polygon points="140,132 146,150 152,132"/><polygon points="154,132 160,150 166,132"/></g>',
    leech: '<ellipse cx="156" cy="128" rx="14" ry="10" fill="#ff8fab" stroke="#8a2a48" stroke-width="3"/>'
  };
  var BACK = ['tail', 'longtail', 'wing', 'spring', 'longleg'];
  function monSVG(shape, color, parts, face) {
    var on = {}; (parts || []).forEach(function (p) { on[p] = true; });
    var back = BACK.filter(function (p) { return on[p]; }).map(function (p) { return PART_ART[p]; }).join('');
    var front = Object.keys(PART_ART).filter(function (p) { return on[p] && BACK.indexOf(p) < 0; }).map(function (p) { return PART_ART[p]; }).join('');
    var flip = face === 'l' ? 'translate(200,0) scale(-1,1)' : '';
    return '<svg viewBox="0 0 200 208"><g transform="' + flip + '">' + back + bodyShape(shape, color) + front +
      '<circle cx="128" cy="104" r="10" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="131" cy="105" r="4.5" fill="#111"/><path d="M138 130 q10 7 20 0" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/></g></svg>';
  }
  var GLYPH = {
    horn: '<path d="M11 32 Q15 14 27 6 Q25 20 29 32 Z" fill="#f5d76e"/>',
    eye: '<g stroke="#ffe066" stroke-width="2.5"><path d="M20 5v4M20 31v4M5 20h4M31 20h4"/></g><circle cx="20" cy="20" r="7.5" fill="#fff"/><circle cx="21" cy="20.5" r="3.2" fill="#1b1f2a" stroke="none"/>',
    fang: '<path d="M9 11 H31" stroke-width="2.5"/><polygon points="10,11 14.5,29 19,11" fill="#f7f0ff"/><polygon points="21,11 25.5,29 30,11" fill="#f7f0ff"/>',
    leech: '<ellipse cx="20" cy="20" rx="13" ry="9.5" fill="#ff8fab"/><ellipse cx="20" cy="20" rx="6.5" ry="3.6" fill="#5a1030"/>',
    claw: '<polygon points="7,9 12,31 16.5,10" fill="#f3f3f3"/><polygon points="15.5,8 20.5,32 25,9" fill="#f3f3f3"/><polygon points="24,9 28.5,31 33,10" fill="#f3f3f3"/>',
    crush: '<polygon points="7,8 15,32 21,8" fill="#9a6a44"/><polygon points="19,8 27,32 33,8" fill="#9a6a44"/>',
    spring: '<polyline points="20,5 11,9 29,14 11,19 29,24 11,29 20,34" fill="none" stroke="#e6e6e6" stroke-width="3.5"/>',
    longleg: '<path d="M15 5 L21 28 L32 32" fill="none" stroke="#c49a7a" stroke-width="5"/>',
    spike: '<g fill="#e8e8e8"><polygon points="6,32 11.5,11 17,32"/><polygon points="14.5,32 20,6 25.5,32"/><polygon points="23,32 28.5,11 34,32"/></g>',
    weight: '<circle cx="20" cy="11" r="4.5" fill="none" stroke="#c9ccd6" stroke-width="2.5"/><polygon points="9,33 12.5,15 27.5,15 31,33" fill="#7d808a"/>',
    shell: '<path d="M6 28 Q20 3 34 28 Z" fill="#c07028"/><path d="M14 27 L17 15 M26 27 L23 15 M20 27 V11" fill="none" stroke="#5a2d0c" stroke-width="2"/>',
    scale: '<g fill="#9aa5b1"><rect x="6" y="8" width="13" height="10" rx="3"/><rect x="21" y="8" width="13" height="10" rx="3"/><rect x="6" y="21" width="13" height="10" rx="3"/><rect x="21" y="21" width="13" height="10" rx="3"/></g>',
    tail: '<path d="M33 31 Q7 35 8 15 Q9 6 18 9 Q13 24 33 23 Z" fill="#a0693d"/>',
    longtail: '<path d="M34 32 Q5 35 8 14 Q10 5 18 8" fill="none" stroke="#e0b070" stroke-width="5"/>',
    wing: '<path d="M34 31 Q27 4 6 13 Q17 16 14 28 Q25 23 34 31 Z" fill="#dff0ff"/>',

  function hpHtml(p, max) { return '<div class="hpnum" id="' + p + 'HpN">' + max + ' / ' + max + '</div><div class="hpbar"><i id="' + p + 'Hp" style="width:100%"></i></div>'; }

  var FL = 0;
  function floatDmg(side, n, color) { var a = $('arena'), d = document.createElement('div'); d.className = 'dmg'; d.textContent = n; d.style.color = color; var k = (FL++) % 3; d.style.top = (42 + 14 * k) + '%'; d.style[side === 'p' ? 'left' : 'right'] = (6 + 13 * k) + '%'; d.style.animationDuration = (0.9 / SPEED) + 's'; a.appendChild(d); setTimeout(function () { d.remove(); }, 900 / SPEED); }
  var NAMEP = function (s, eName, me) { return s === 'p' ? me : eName; };
  function play(out, before, equip, d) {
    var ev = out.res.events, i = 0, me = before.name || 'じぶん', fast = false;
    var pMax = out.res.pMax, eMax = out.res.eMax, pHp = pMax, eHp = eMax;
    var STN = { poison: 'どく', stagger: 'よろけ', brittle: 'もろい' };

          if (e.nerai) glowKw(who, 'nerai');

          delay = 420; break;
        case 'dodge': popText(e.by === 'yokeru' ? 'よけた！' : 'ひらり！', 'dodge'); addLog(e.who === 'p' ? 'p' : 'e', nm + 'は ひらりと よけた！', e.by === 'luck' ? null : e.by); if (e.by !== 'luck') glowKw(who, e.by); delay = 520; break;
        case 'kw':

    } else {
      var r = out.reason;
      h += '<div class="hearts" style="font-size:2rem">' + hearts(run.hearts) + '</div><h1>まけた…</h1>';
      h += '<div class="reason"><div class="rt">' + r.text + '</div>';
      if (r.id === 'power') { var ps = out.res.pSt, es = out.res.eSt; h += '<div class="cmp"><span>じぶん ♥' + ps.hp + ' ⚔' + ps.atk + ' 🛡' + ps.def + ' 💨' + ps.spd + '</span><span>' + d.name + ' ♥' + es.hp + ' ⚔' + es.atk + ' 🛡' + es.def + ' 💨' + es.spd + '</span></div>'; }
      if (r.kw) h += '<div style="margin-top:.4rem">' + kwBadge(r.kw) + '</div>';
      h += '<div class="rh">' + r.hope + '</div></div>';
      if (out.over) h += '<div class="actions"><button class="big" id="bNext">おわり</button></div>';
      else {
        h += '<div class="actions"><button class="big" id="bAgain">もう一度（おなじ 道）</button>' + (run.fork.roads.length > 1 ? '<button class="btn" id="bOther">もう片方の 道へ</button>' : '') + '</div>';
        if (run.lossStreak >= 2) h += '<div class="sub" style="color:#ffe066;font-weight:800;margin-top:.4rem">💡 じゅんびの 画面に「ヒント」が でたよ</div>';
      }
    }
    h += '<div class="sub" style="color:var(--dim);margin-top:.6rem">たたかいの きろく（' + out.res.events.filter(function (e) { return e.t === 'hit'; }).length + 'かいの こうげき）は ▼</div><div class="logw" id="log2" style="text-align:left">' + $('log').innerHTML + '</div>';
    $('resw').innerHTML = h;
    show('result');
    if ($('bNext')) $('bNext').onclick = function () { if (run.over) endRun(); else drawFork(); };
    if ($('bAgain')) $('bAgain').onclick = function () { drawPrep(); };
    if ($('bOther')) $('bOther').onclick = function () { G.road = 1 - G.road; G.hint = null; drawPrep(); };
    if (AUTO) autoNext();
  }
  function endRun() {
    var run = G.run;
    recordHall(run);
    if (AUTO) console.log('[でこもん auto] 周回 おわり：' + run.species + ' ' + run.wins + 'しょう' + (run.clear ? ' クリア' : '') + ' ハート ' + run.hearts);
    G.run = null; lsSet('run', null);
    drawTitle();
    if (AUTO) setTimeout(function () { $('bStart').click(); setTimeout(function () { var sps = S.SPECIES; drawSpecies(); startRun(sps[(lsGet('hall', []).length) % sps.length].id); autoNext(); }, 50); }, 200);
  }
  // 自動モード（?auto=1。必ず 無音＝この 版は まだ 音が ない）
  function autoNext() {
    setTimeout(function () {
      var on = document.querySelector('.screen.on').id;
      if (on === 'fork') { G.road = 0; drawPrep(); autoNext(); }
      else if (on === 'prep') { startBattle(); }
      else if (on === 'result') { var b = $('bNext') || $('bAgain'); if (b) { b.click(); autoNext(); } }
    }, 150 / SPEED);
  }

  $('bStart').onclick = function () { drawSpecies(); };
  $('bCont').onclick = function () { if (G.run) drawFork(); };
  window.__re = { G: G, S: S };
  drawTitle();
  if (AUTO) { $('bStart').click(); startRun(S.SPECIES[0].id); autoNext(); }
})();
</script>
</body>
</html>
