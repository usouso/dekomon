<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>でこもん</title>
<style>
:root {
  --bg: #1b1f2a; --panel: #272c3a; --panel2: #313748; --line: #3e4558;
  --text: #f4f1ea; --sub: #c9c4b8; --accent: #ffcc4d;
  --p: #58c7ff; --e: #ff6b6b; --ok: #7ee787; --bad: #ff9c9c; --good: #9fe3a8;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 18px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
.screen { display: none; max-width: 560px; margin: 0 auto; padding: 12px 14px 32px; min-height: 100vh; }
.screen.on { display: block; }
@media (min-width: 700px) { html { font-size: 20px; } .screen { max-width: 640px; } }

h1 { font-size: 2.6rem; margin: 0; letter-spacing: .08em; }
.sub { color: var(--sub); }
.btn { display: block; width: 100%; min-height: 60px; border: 0; border-radius: 16px; background: var(--accent); color: #1b1f2a;
  font-size: 1.5rem; font-weight: 700; letter-spacing: .1em; box-shadow: 0 4px 0 #b58a16; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b58a16; }
.btn.round { width: 140px; height: 140px; min-height: 0; margin: 40px auto 0; border-radius: 50%; font-size: 3.5rem; letter-spacing: 0; display: flex; align-items: center; justify-content: center; }
.center { text-align: center; }

/* タイトル */
#title { display: none; text-align: center; padding-top: 16vh; }
#title.on { display: block; }
#title .mon { width: 180px; height: 180px; margin: 10px auto 0; }

/* カード */
.card { background: var(--panel); border-radius: 16px; padding: 12px 14px; margin: 10px 0; }
.card.e { border: 2px solid rgba(255,107,107,.55); }
.card.f { border: 2px solid rgba(255,204,77,.5); }
.card.me { border: 2px solid rgba(88,199,255,.5); }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ec-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.ec-top .mon { width: 104px; height: 104px; flex: 0 0 104px; }
.ec-head { display: flex; align-items: center; gap: 8px; }
.ec-name { font-size: 1.45rem; font-weight: 800; line-height: 1.2; }
.tdot { display: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff8; flex: 0 0 22px; }
.tdot.grass { display: inline-block; background: #4fc06a; } .tdot.fire { display: inline-block; background: #ff5a3c; } .tdot.water { display: inline-block; background: #3f9cff; }
.stats { display: flex; gap: 14px; margin-top: 6px; }
.stat { display: flex; flex-direction: column; align-items: flex-start; min-width: 4.5em; }
.stat .k { font-size: .95rem; color: var(--sub); line-height: 1.2; }
.stat .v { font-size: 1.45rem; font-weight: 800; line-height: 1.2; }
.stat .v.chg { color: var(--accent); }
.traits { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
.trait { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 3px 0; }
.trait b { white-space: nowrap; font-size: 1.1rem; min-width: 5.5em; }
.trait b.grass { color: #8fe09f; } .trait b.fire { color: #ff9c86; } .trait b.water { color: #8fc3ff; }
.trait span { color: var(--sub); }
.label { color: var(--sub); font-size: 1rem; margin: 8px 0 4px; }
.minis { display: flex; flex-wrap: wrap; gap: 8px; }
.mini { background: var(--panel2); border: 3px solid var(--line); border-radius: 14px; padding: 6px 10px; display: flex; flex-direction: column; min-width: 0; flex: 1 1 45%; }
.mini .pc-name { font-size: 1.1rem; }
.mini span.eff { color: var(--sub); font-size: 1rem; }
.f-name { font-size: 1.3rem; font-weight: 700; }
.f-desc { margin-top: 4px; }

/* バトル前：自分 */
.slots { display: flex; gap: 6px; margin: 8px 0 4px; align-items: center; }
.slots .lbl { color: var(--sub); font-size: 1rem; margin-right: 4px; }
.slot { width: 46px; height: 46px; border-radius: 10px; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: .9rem; color: var(--sub); }
.slot.on { border-style: solid; border-color: var(--accent); color: var(--accent); background: #3a3420; }
.first { font-size: 1.1rem; margin-top: 4px; min-height: 1.5em; }
.first b { color: var(--accent); }
.note { color: var(--bad); min-height: 1.4em; font-size: 1rem; }

/* パーツ札 */
.plist { display: grid; grid-template-columns: 1fr; gap: 8px; }
.pcard { background: var(--panel); border: 3px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; user-select: none; position: relative; }
.pcard.on { border-color: var(--accent); background: #3a3420; }
.pcard:active { transform: scale(.985); }
.pc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pc-name { font-size: 1.25rem; font-weight: 700; }
.mark { font-size: 1.35rem; font-weight: 900; line-height: 1; }
.mark.g { color: var(--good); } .mark.b { color: var(--bad); }
.tag { font-size: .9rem; padding: 2px 8px; border-radius: 8px; background: var(--panel2); color: var(--sub); }
.tag.heavy { background: #4a3b2f; color: #f0c9a0; }
.tag.light { background: #2f4a44; color: #a8f0e0; }
.pc-on { margin-left: auto; font-size: 1rem; color: var(--accent); font-weight: 700; }
.pc-eff { margin-top: 3px; }
.pc-gb { margin-top: 3px; font-size: 1rem; display: flex; flex-direction: column; gap: 1px; }
.pc-gb .g { color: var(--good); } .pc-gb .b { color: var(--bad); }
.pc-gb .it { font-weight: 400; }
.pc-gb .it.on { font-weight: 800; }
.pc-gb .it.off { color: #8a8f9c; }
.pc-gb .sep { color: #8a8f9c; }
.hint { display: inline-block; background: var(--accent); color: #1b1f2a; font-weight: 700; padding: 4px 12px; border-radius: 10px; font-size: 1.1rem; margin: 6px 0; animation: bob 1s infinite; }
@keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-4px);} }

/* バトル前の並び：スマホは1列＋下固定の「たたかう」、パソコン（900px 以上）は2列で1画面 */
#pre { padding-bottom: 120px; }
.fight-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 14px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, rgba(27,31,42,0)); z-index: 5; }
.fight-bar .btn { max-width: 560px; margin: 0 auto; }
@media (min-width: 900px) {
  #pre { max-width: 1240px; height: 100vh; overflow: hidden; padding: 10px 16px 12px; flex-direction: column; }
  #pre.on { display: flex; }
  .pre-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
  .col-l { overflow-y: auto; min-height: 0; padding-right: 4px; }
  .col-r { display: flex; flex-direction: column; min-height: 0; }
  .col-r .plist { overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; align-content: start; }
  .fight-bar { position: static; padding: 10px 0 0; background: none; }
  .fight-bar .btn { max-width: none; }
  #pre .card { margin: 0 0 10px; }
  .ec-top .mon { width: 120px; height: 120px; flex-basis: 120px; }
}

/* モンスター SVG */
.mon { display: block; overflow: visible; }
.mon .part { display: none; transform-box: fill-box; transform-origin: center; }
.mon .part.on { display: inline; }
.mon .part.glow { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 16px #ffd54a); animation: pulse calc(.7s * var(--spd)) ease-out; }
@keyframes pulse { 0% { transform: scale(1);} 35% { transform: scale(1.5);} 100% { transform: scale(1);} }
.mon .part.spike.ext { transform-origin: center bottom; animation: spikeExt calc(.45s * var(--spd)) ease-out; }
@keyframes spikeExt { 0% { transform: scaleY(1);} 30% { transform: scaleY(1.5);} 100% { transform: scaleY(1);} }
.mon .body.lit { filter: brightness(2.4); }

/* バトル：画面いっぱいの舞台 */
#battle { max-width: 1100px; height: 100vh; height: 100dvh; min-height: 0; flex-direction: column; padding: 8px 10px 10px; overflow: hidden; }
#battle.on { display: flex; }
#battle.shake { animation: shake calc(.2s * var(--spd)) linear; }
@keyframes shake { 0%,100% { transform: translate(0,0);} 20% { transform: translate(-8px, 5px);} 40% { transform: translate(7px, -4px);} 60% { transform: translate(-6px, -5px);} 80% { transform: translate(5px, 4px);} }
.b-top { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; color: var(--sub); }
.b-top b { color: var(--text); font-size: 1.3rem; }
.hpRow { display: flex; gap: 12px; margin: 6px 0 4px; }
.hpBox { flex: 1; min-width: 0; }
.hp-name { font-size: 1.3rem; font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hp-name .num { color: var(--sub); font-weight: 600; font-size: 1.15rem; white-space: nowrap; }
.hp { position: relative; height: 38px; background: #141720; border-radius: 10px; overflow: hidden; border: 3px solid var(--line); }
.hp.shake { animation: hpShake calc(.25s * var(--spd)) linear; }
@keyframes hpShake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-4px);} 50% { transform: translateX(4px);} 75% { transform: translateX(-3px);} }
.hp .ghost { position: absolute; left: 0; top: 0; bottom: 0; background: #fff5; transition: width calc(.6s * var(--spd)) ease; }
.hp .fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width calc(.2s * var(--spd)) ease; }
.hp .fill.low { animation: blink .8s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: 1;} 50% { opacity: .4;} }
.hpBox.p .fill { background: var(--p); } .hpBox.e .fill { background: var(--e); }
.hpBox.e .hp-name { flex-direction: row-reverse; }
.hpBox.e .hp .fill, .hpBox.e .hp .ghost { left: auto; right: 0; }
.arena { position: relative; flex: 1; min-height: 260px; margin-top: 4px; border-radius: 16px; background: linear-gradient(#232838, #1b1f2a 70%); overflow: hidden; }
.arena .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 14%; background: #2b3042; }
.arena.mud .ground { background: #4a3a2a; } .arena.rain .ground { background: #2b3d55; } .arena.wind .ground { background: #3a4a3a; }
.rain-fx { position: absolute; inset: 0; pointer-events: none; display: none; background: repeating-linear-gradient(100deg, transparent 0 18px, #9cc8ff22 18px 20px); }
.arena.rain .rain-fx { display: block; }
.wind-fx { position: absolute; inset: 0; pointer-events: none; display: none; background: repeating-linear-gradient(0deg, transparent 0 26px, #cfe9ff14 26px 28px); }
.arena.wind .wind-fx { display: block; }
.mon-wrap { position: absolute; bottom: 8%; width: 60%; height: 66%; }
.mon-wrap.p { left: -8%; } .mon-wrap.e { right: -8%; }
@media (max-width: 899px) { .hp-name, .hpBox.e .hp-name { flex-direction: column; gap: 0; } .hp-name { align-items: flex-start; } .hpBox.e .hp-name { align-items: flex-end; } .hp-name span:first-child { white-space: nowrap; } }
@media (min-width: 900px) { .mon-wrap { width: 42%; height: 80%; } .mon-wrap.p { left: 2%; } .mon-wrap.e { right: 2%; } }
.anim { width: 100%; height: 100%; transform-origin: 50% 100%; --dir: 1; }
.mon-wrap.e .anim { --dir: -1; }
.anim .mon { width: 100%; height: 100%; }
.anim.charge { animation: charge calc(.3s * var(--spd)) ease-in forwards; }
@keyframes charge { 0% { transform: translateX(0) scale(1,1);} 100% { transform: translateX(calc(-8% * var(--dir))) scale(.9,1.1);} }
.anim.lunge { animation: lunge calc(.42s * var(--spd)) ease-out; }
@keyframes lunge { 0% { transform: translateX(0) scale(1,1);} 25% { transform: translateX(calc(-6% * var(--dir))) scale(.94,1.06);} 55% { transform: translateX(calc(18% * var(--dir))) scale(1.14,.9);} 100% { transform: translateX(0) scale(1,1);} }
.anim.squash { animation: squash calc(.36s * var(--spd)) ease-out; }
@keyframes squash { 0% { transform: scale(1,1);} 30% { transform: translateX(calc(-9% * var(--dir))) scale(1.24,.72);} 65% { transform: translateX(calc(-5% * var(--dir))) scale(.94,1.08);} 100% { transform: scale(1,1);} }
.anim.squash-weak { animation: squashWeak calc(.3s * var(--spd)) ease-out; }
@keyframes squashWeak { 0% { transform: scale(1,1);} 40% { transform: translateX(calc(-2% * var(--dir))) scale(1.04,.96);} 100% { transform: scale(1,1);} }
.anim.hop { animation: hop calc(.32s * var(--spd)) ease-out; }
@keyframes hop { 0% { transform: translateY(0) scale(1,1);} 30% { transform: translateY(-10%) scale(.96,1.06);} 70% { transform: translateY(0) scale(1.06,.94);} 100% { transform: translateY(0) scale(1,1);} }
.anim.blow { transform-origin: 50% 62%; animation: blow calc(.7s * var(--spd)) ease-out forwards; }
@keyframes blow { 0% { transform: translate(0,0) rotate(0); opacity: 1;} 60% { transform: translate(calc(-26% * var(--dir)), -16%) rotate(calc(-70deg * var(--dir))); opacity: .9;} 100% { transform: translate(calc(-22% * var(--dir)), 4%) rotate(calc(-95deg * var(--dir))); opacity: .45;} }

/* 大きな文字 */
.big { position: absolute; top: 2%; width: 50%; padding: 0 6px; text-align: center; font-weight: 900; font-size: 1.5rem; line-height: 1.15; min-height: 3.5em; text-shadow: 0 2px 0 #000, 0 0 12px #000; z-index: 3; }
.big.l { left: 0; color: #dff3ff; } .big.r { right: 0; color: #ffe0e0; }
.big .bn { display: inline-block; font-size: 1.5em; margin-left: .2em; color: var(--accent); }
.big .sm { font-size: .8em; font-weight: 700; opacity: .9; }
.big.super { font-size: 1.95rem; }
.big.super.fire, .big.super.fire .bn { color: #ffb088; } .big.super.water, .big.super.water .bn { color: #9fd8ff; }
@media (min-width: 900px) { .big { font-size: 1.9rem; } .big.super { font-size: 2.5rem; } }

/* 効果（火花・玉・輪・盾・数字） */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.fx > * { position: absolute; }
.shot { width: 0; height: 0; }
.shot .core { position: absolute; width: 30px; height: 30px; border-radius: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 18px 6px currentColor; }
.shot .tail { position: absolute; height: 16px; width: 110px; top: -8px; border-radius: 8px; opacity: .75; }
.shot.l2r .tail { right: 0; background: linear-gradient(to right, transparent, currentColor); }
.shot.r2l .tail { left: 0; background: linear-gradient(to left, transparent, currentColor); }
.hitflash { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(#fff, #fff8 40%, transparent 70%); animation: hitflash calc(.3s * var(--spd)) ease-out forwards; }
.hitflash.big { width: 240px; height: 240px; }
@keyframes hitflash { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 1;} 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0;} }
.spark { width: 14px; height: 14px; border-radius: 50%; background: #fff4c2; box-shadow: 0 0 10px 3px rgba(255,236,170,.8); animation: spark calc(.45s * var(--spd)) ease-out forwards; }
.spark.sq { border-radius: 2px; }
@keyframes spark { 0% { transform: translate(-50%,-50%) scale(1); opacity: 1;} 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2); opacity: 0;} }
.ring { width: 40px; height: 40px; border-radius: 50%; border: 4px solid #ffd54a; animation: ring calc(.5s * var(--spd)) ease-out forwards; }
@keyframes ring { 0% { transform: translate(-50%,-50%) scale(.4); opacity: 1;} 100% { transform: translate(-50%,-50%) scale(3.2); opacity: 0;} }
.shield { width: 70px; height: 120px; border-radius: 45% / 50%; background: rgba(160,220,255,.45); border: 3px solid rgba(220,245,255,.95); transform: translate(-50%,-50%); animation: shieldIn calc(.14s * var(--spd)) ease-out; }
.shield.break { animation: shieldBreak calc(.3s * var(--spd)) ease-in forwards; }
@keyframes shieldIn { 0% { transform: translate(-50%,-50%) scale(.6); opacity: 0;} 100% { transform: translate(-50%,-50%) scale(1); opacity: 1;} }
@keyframes shieldBreak { 0% { opacity: 1; transform: translate(-50%,-50%) scale(1);} 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.25);} }
.dmg { font-weight: 900; font-size: 2.1rem; color: #fff; text-shadow: 0 2px 0 #000, 0 0 10px #000; white-space: nowrap; animation: dmgPop calc(.5s * var(--spd)) ease-out forwards; }
@keyframes dmgPop { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 0;} 35% { transform: translate(-50%,-60%) scale(1.5); opacity: 1;} 100% { transform: translate(-50%,-110%) scale(1); opacity: 1;} }
.dmg.super { font-size: 2.9rem; } .dmg.super.fire { color: #ffb088; } .dmg.super.water { color: #9fd8ff; }
.dmg.weak { font-size: 1.5rem; color: #a9adb8; }
.dmg.counter { color: #ffd54a; }
@media (min-width: 900px) { .dmg { font-size: 2.6rem; } .dmg.super { font-size: 3.6rem; } .dmg.weak { font-size: 1.8rem; } }
.result { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: 2.8rem; font-weight: 900; display: none; text-shadow: 0 3px 0 #000, 0 0 16px #000; z-index: 5; }
.result.on { display: block; animation: pop calc(.4s * var(--spd)) ease-out; }
.result.finish { font-size: 3.4rem; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }
.flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 50; }
.flash.on { animation: flashOut calc(.4s * var(--spd)) ease-out; }
@keyframes flashOut { 0% { opacity: .55;} 100% { opacity: 0;} }

/* ドラフト・終わり */
.list { margin: 8px 0; }
.list .it { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.list .it .mon { width: 56px; height: 56px; flex: 0 0 56px; }
.list .it .t { flex: 1; min-width: 0; }
.list .it .t small { color: var(--sub); font-size: 1rem; display: block; }
.big-title { font-size: 2rem; font-weight: 900; margin: 6px 0; }
.lose-title { color: var(--bad); }
.win-title { color: var(--accent); }
</style>
</head>
<body>

<!-- タイトル -->
<div id="title" class="screen on">
  <h1>でこもん</h1>
  <div id="titleMon"></div>
  <button class="btn round" id="startBtn" aria-label="はじめる">▶</button>
</div>

<!-- バトル前 -->
<div id="pre" class="screen">
  <div class="row" style="margin-bottom:4px"><b id="preNo" style="font-size:1.2rem"></b><span class="sub" id="preWins"></span></div>
  <div class="pre-grid">
    <div class="col-l">
      <div class="card e">
        <div class="ec-top">
          <div style="flex:1;min-width:0">
            <div class="ec-head"><span class="tdot" id="eType"></span><span class="ec-name" id="eName"></span></div>
            <div class="stats">
              <div class="stat"><span class="k">たいりょく</span><span class="v" id="eHpV"></span></div>
              <div class="stat"><span class="k">こうげき</span><span class="v" id="eAtkV"></span></div>
              <div class="stat"><span class="k">はやさ</span><span class="v" id="eSpdV"></span></div>
            </div>
          </div>
          <div id="eMon"></div>
        </div>
        <div class="traits" id="eTraits"></div>
        <div class="label">つけている パーツ</div>
        <div class="minis" id="eParts"></div>
      </div>
      <div class="card f">
        <div class="f-name" id="fName"></div>
        <div class="f-desc" id="fDesc"></div>
      </div>
      <div class="card me">
        <div class="ec-top">
          <div style="flex:1;min-width:0">
            <div class="ec-head"><span class="ec-name">あなた</span></div>
            <div class="stats">
              <div class="stat"><span class="k">たいりょく</span><span class="v" id="pHpV"></span></div>
              <div class="stat"><span class="k">こうげき</span><span class="v" id="pAtkV"></span></div>
              <div class="stat"><span class="k">はやさ</span><span class="v" id="pSpdV"></span></div>
            </div>
          </div>
          <div id="pMon"></div>
        </div>
        <div class="slots" id="slots"></div>
        <div class="first" id="firstTxt"></div>
        <div class="note" id="note"></div>
      </div>
    </div>
    <div class="col-r">
      <div id="hintWrap"></div>
      <div class="plist" id="plist"></div>
      <div class="fight-bar"><button class="btn" id="fightBtn">たたかう</button></div>
    </div>
  </div>
</div>

<!-- バトル -->
<div id="battle" class="screen">
  <div class="b-top"><span id="bField"></span><span><b id="bHand"></b> <span>/ 16 手</span></span></div>
  <div class="hpRow">
    <div class="hpBox p"><div class="hp-name"><span>あなた</span><span class="num" id="hpNumP"></span></div><div class="hp" id="hpP"><div class="ghost" id="ghostP"></div><div class="fill" id="fillP"></div></div></div>
    <div class="hpBox e"><div class="hp-name"><span id="bEName"></span><span class="num" id="hpNumE"></span></div><div class="hp" id="hpE"><div class="ghost" id="ghostE"></div><div class="fill" id="fillE"></div></div></div>
  </div>
  <div class="arena" id="arena">

<script src="sim.js"></script>
<script>
(function () {

    rng0: Q.get('rng') === '0',
    speed: Math.max(0.2, parseFloat(Q.get('speed') || '1') || 1),
    seed: Q.get('seed')

  var $ = function (id) { return document.getElementById(id); };
  document.documentElement.style.setProperty('--spd', String(1 / OPT.speed));
  function el(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html !== undefined) d.innerHTML = html; return d; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------- 見た目のデータ ----------
  var LOOK = {
    player: { shape: 'round', color: '#7fd1ae' },
    turtle: { shape: 'wide',  color: '#8a9a5b' },
    bird:   { shape: 'tall',  color: '#d9b36c' },
    monkey: { shape: 'round', color: '#e0623d' },
    jelly:  { shape: 'dome',  color: '#6f9ceb' },
    wolf:   { shape: 'blob',  color: '#5fa86a' },
    boar:   { shape: 'wide',  color: '#b5413a' },
    frog:   { shape: 'blob',  color: '#7b6a4e' },
    owl:    { shape: 'tall',  color: '#9c8f5a' }
  };
  var SHORT = { horn: 'いちげき ×1.5', claw: '2〜3かい こうげき', shell: 'ダメージ −35%', spike: 'はんげき', wing: 'はやさ +6', spring: '3手に1かい 2かい', fire: 'ほのお こうげき', water: 'みず こうげき' };
  var PLABEL = { horn: 'ツノ', claw: 'ツメ', shell: 'コウラ', spike: 'トゲ', wing: 'はね', spring: 'ばねあし', fire: 'ほのお', water: 'みず' };
  var WEIGHT = { heavy: 'おもい', light: 'かるい' };

      P('wing', '<path d="M96 96 Q62 36 28 66 Q56 72 50 96 Q74 84 96 102Z" fill="#dff0ff" stroke="#5f9fd0" stroke-width="3"/><path d="M60 80 Q70 70 84 82" fill="none" stroke="#5f9fd0" stroke-width="2"/>') +

      bodyShape(look.shape, look.color) +

      P('spike', '<g fill="#e8e8e8" stroke="#444" stroke-width="2.5"><polygon points="52,100 64,58 80,96"/><polygon points="76,86 90,44 104,84"/><polygon points="100,80 114,42 126,80"/></g>') +
      P('horn', '<polygon points="124,82 142,34 152,86" fill="#f5d76e" stroke="#7a5c00" stroke-width="3"/>') +
      P('claw', '<g fill="#f3f3f3" stroke="#333" stroke-width="2" transform="translate(134,156)"><polygon points="0,0 7,24 14,2"/><polygon points="12,0 19,26 26,2"/><polygon points="24,0 31,24 38,2"/></g>') +
      P('fire', '<path d="M158 122 q16 -16 34 -2 q-8 2 -2 12 q-16 10 -32 -2z" fill="#ff8c42" stroke="#c74d10" stroke-width="2"/><path d="M162 122 q10 -8 20 0 q-10 8 -20 0z" fill="#ffd166"/>') +
      P('water', '<g fill="#4fc3f7" stroke="#1a7fb0" stroke-width="2"><circle cx="166" cy="118" r="7"/><circle cx="182" cy="128" r="6"/><circle cx="194" cy="116" r="5"/></g>') +
      '<circle cx="128" cy="104" r="10" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="131" cy="105" r="4.5" fill="#111"/>' +
      '<path d="M138 130 q10 7 20 0" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>' +
      '</g></svg>';
  }

  // ---------- 音（Web Audio、外部ファイルなし） ----------
  // パーツごとに音色を変える。ふつうの攻撃は小さく低い「ドン」。とどめは長く響く。
  var AC = null, NOISE = null;
  function initAudio() {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      if (!NOISE) {
        NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = NOISE.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
    } catch (e) { AC = null; }
  }
  function envGain(t, vol, dur, attack) {
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(AC.destination);
    return g;
  }
  function tone(freq, dur, type, vol, when, freqEnd) {
    if (!AC) return;
    try {
      var t = AC.currentTime + (when || 0);
      var o = AC.createOscillator();
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, t);
      if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
      o.connect(envGain(t, vol || 0.2, dur));
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function noise(dur, vol, when, filterType, f0, f1, q) {
    if (!AC || !NOISE) return;
    try {
      var t = AC.currentTime + (when || 0);
      var src = AC.createBufferSource(); src.buffer = NOISE;
      var flt = AC.createBiquadFilter(); flt.type = filterType || 'lowpass';
      flt.frequency.setValueAtTime(f0 || 1000, t);
      if (f1) flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
      flt.Q.value = q || 1;
      src.connect(flt); flt.connect(envGain(t, vol || 0.2, dur));
      src.start(t); src.stop(t + dur + 0.05);
    } catch (e) {}
  }
  var SFX = {
    horn:   function () { tone(150, 0.26, 'sine', 0.38, 0, 50); noise(0.09, 0.2, 0, 'lowpass', 700, 150); },
    claw:   function () { tone(1100, 0.05, 'square', 0.13); tone(1450, 0.05, 'square', 0.13, 0.06); },
    shell:  function () { tone(420, 0.13, 'square', 0.22); tone(635, 0.11, 'triangle', 0.18); noise(0.05, 0.14, 0, 'highpass', 2500); },
    spike:  function () { tone(1700, 0.13, 'sawtooth', 0.18, 0, 650); },
    wing:   function () { noise(0.38, 0.24, 0, 'bandpass', 450, 2400, 1.3); },
    spring: function () { tone(220, 0.3, 'sine', 0.26, 0, 580); tone(580, 0.2, 'sine', 0.16, 0.12, 320); },
    fire:   function () { noise(0.36, 0.3, 0, 'lowpass', 1000, 250); tone(90, 0.3, 'sawtooth', 0.12, 0, 55); },
    water:  function () { noise(0.2, 0.26, 0, 'highpass', 1600, 4500); tone(650, 0.1, 'sine', 0.12, 0, 1300); },
    plain:  function () { tone(95, 0.09, 'sine', 0.15, 0, 55); },
    super:  function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.42, 'triangle', 0.13, i * 0.015); }); },
    weak:   function () { tone(130, 0.26, 'sine', 0.15, 0, 85); },
    finish: function () { tone(70, 1.4, 'sawtooth', 0.22, 0, 38); tone(140, 1.2, 'sine', 0.18, 0, 70); tone(1046, 0.7, 'triangle', 0.12, 0.05, 523); noise(0.6, 0.26, 0, 'lowpass', 1400, 90); },
    win:    function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.28, 'triangle', 0.22, i * 0.13); }); },
    lose:   function () { [392, 311, 233].forEach(function (f, i) { tone(f, 0.4, 'sawtooth', 0.12, i * 0.22); }); }
  };
  function sfxPart(id) { if (SFX[id]) SFX[id](); }
  function sfxWin() { SFX.win(); }
  function sfxLose() { SFX.lose(); }

  // ---------- 画面切り替え ----------
  var SCREENS = ['title', 'pre', 'battle', 'draft', 'clear', 'over'];
  function show(id) {
    SCREENS.forEach(function (s) { $(s).classList.toggle('on', s === id); });
    window.scrollTo(0, 0);
    G.screen = id;
  }

  // ---------- ゲームの状態 ----------
  var G = { screen: 'title', firstRun: true, rng: null, run: null, owned: [], attached: [], battle: 0, wins: 0, history: [], auto: { runs: 0, clears: 0, battles: 0, mismatches: 0, wins: 0 } };
  var seed = OPT.seed ? parseInt(OPT.seed, 10) : (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
  G.rng = S.makeRng(seed);

  function startRun() {
    G.run = S.newRun(G.rng);
    G.owned = G.run.owned.slice();
    G.attached = [];
    G.battle = 0; G.wins = 0; G.history = [];
    showPre();
  }
  function curEnemyDef() { return S.ENEMIES[G.run.enemies[G.battle]]; }
  function curField() { return S.FIELD_BY_ID[G.run.fields[G.battle]]; }
  function curStage() { return G.battle + 1; }

  // ---------- バトル前 ----------
  // パーツ札。hints があれば、今の相手・フィールドに当てはまる とくい・にがて を太く、当てはまらないものを薄くする。
  function gbLine(label, cls, items, hints) {
    var html = '<span class="' + cls + '">' + label + '：';
    items.forEach(function (it, i) {
      if (i) html += '<span class="sep">・</span>';
      var state = hints ? (it.on ? ' on' : ' off') : '';
      html += '<span class="it' + state + '">' + esc(it.text) + '</span>';
    });
    return html + '</span>';
  }
  function partCard(id, on, hints) {
    var p = S.PART_BY_ID[id];
    var c = el('div', 'pcard' + (on ? ' on' : ''));
    c.dataset.id = id;
    var w = p.weight !== 'none' ? '<span class="tag ' + p.weight + '">' + WEIGHT[p.weight] + '</span>' : '';
    var marks = hints ? ((hints.anyGood ? '<span class="mark g" title="とくい">◎</span>' : '') + (hints.anyBad ? '<span class="mark b" title="にがて">✕</span>' : '')) : '';
    var goods = hints ? hints.good : p.goods, bads = hints ? hints.bad : p.bads;
    c.innerHTML = '<div class="pc-head"><span class="pc-name">' + esc(p.name) + '</span>' + marks + w + '<span class="tag">' + esc(p.loc) + '</span>' + (on ? '<span class="pc-on">つけている</span>' : '') + '</div>' +
      '<div class="pc-eff">' + esc(p.effect) + '</div>' +
      '<div class="pc-gb">' + gbLine('とくい', 'g', goods, hints) + gbLine('にがて', 'b', bads, hints) + '</div>';
    return c;
  }
  function miniCard(id) {
    var p = S.PART_BY_ID[id];
    var w = p.weight !== 'none' ? '<span class="tag ' + p.weight + '">' + WEIGHT[p.weight] + '</span>' : '';
    return el('div', 'mini', '<div class="pc-head"><span class="pc-name">' + esc(p.name) + '</span>' + w + '</div><span class="eff">' + esc(SHORT[id]) + '</span>');
  }
  function showPre() {
    var e = curEnemyDef(), f = curField(), stage = curStage();
    var ef = S.makeFighter('e', e, e.parts, stage);
    $('preNo').textContent = (G.battle + 1) + 'せんめ ／ 5';
    $('preWins').textContent = G.wins ? G.wins + 'れんしょうちゅう' : '';
    $('eName').textContent = e.name;
    $('eType').className = 'tdot' + (e.type ? ' ' + e.type : '');
    $('eHpV').textContent = ef.maxHp;
    $('eAtkV').textContent = Math.round(ef.atk);
    $('eSpdV').textContent = S.effSpd(ef, f.id);
    $('eMon').innerHTML = monsterSVG(e.id, e.parts, 'l');
    var tr = $('eTraits'); tr.innerHTML = '';
    e.traits.forEach(function (t) {
      var T = S.TRAITS[t];
      var cls = (t === 'fire' || t === 'water' || t === 'grass') ? ' class="' + t + '"' : '';
      tr.appendChild(el('div', 'trait', '<b' + cls + '>' + esc(T.name) + '</b><span>' + esc(T.desc) + '</span>'));
    });
    var ep = $('eParts'); ep.innerHTML = '';
    e.parts.forEach(function (p) { ep.appendChild(miniCard(p)); });
    $('fName').textContent = 'フィールド：' + f.name;
    $('fDesc').textContent = f.desc;
    $('pHpV').textContent = S.CFG.playerHp;
    $('pAtkV').textContent = S.CFG.playerAtk;
    $('note').textContent = '';
    renderMe();
    renderPlist();
    show('pre');
    if ($('plist').scrollTo) $('plist').scrollTo(0, 0);
    if (OPT.auto) {
      setTimeout(function () {
        var best = S.bestLoadout(G.owned, e.index, stage, f.id);
        G.attached = best.parts.slice();
        renderMe(); renderPlist();
        setTimeout(function () { $('fightBtn').click(); }, 600 / OPT.speed);
      }, 400 / OPT.speed);
    }
  }
  function renderMe() {
    $('pMon').innerHTML = monsterSVG('player', G.attached, 'r');
    var sl = $('slots'); sl.innerHTML = '';
    sl.appendChild(el('span', 'lbl', 'わく'));
    for (var i = 0; i < 3; i++) {
      var id = G.attached[i];
      sl.appendChild(el('div', 'slot' + (id ? ' on' : ''), id ? esc(PLABEL[id]) : (i + 1)));
    }
    // はやさと先手の見こみ（付け外しのたびに更新）
    var e = curEnemyDef(), f = curField();
    var p = S.makeFighter('p', S.PLAYER_DEF, G.attached, 1);
    var ef = S.makeFighter('e', e, e.parts, curStage());
    var ps = S.effSpd(p, f.id), es = S.effSpd(ef, f.id);
    var sv = $('pSpdV'); sv.textContent = ps; sv.className = 'v' + (ps !== S.CFG.playerSpd ? ' chg' : '');
    var first = ps >= es ? 'あなた' : 'あいて';
    var gap = Math.abs(ps - es) >= S.CFG.speedGap;
    $('firstTxt').innerHTML = 'さきに うごく：<b>' + first + (gap ? '（さいしょに 2かい）' : '') + '</b>';
  }
  function renderPlist() {
    var list = $('plist'); list.innerHTML = '';
    var e = curEnemyDef(), f = curField();
    G.owned.forEach(function (id) {
      var hints = S.partHints(id, e, f.id, G.attached);
      var c = partCard(id, G.attached.indexOf(id) >= 0, hints);
      c.addEventListener('click', function () { togglePart(id); });
      list.appendChild(c);
    });

    if (G.firstRun && G.battle === 0 && G.attached.length === 0) hw.appendChild(el('span', 'hint', 'つける ↓'));
  }
  function togglePart(id) {

      if (G.attached.length >= 3) { note = 'わくは 3つまで。どれかを はずす'; }

  }
  $('fightBtn').addEventListener('click', function () { initAudio(); startBattle(); });

  // ---------- 時間どおりに進める仕組み（?bg=1 ならタイマー、ふつうは requestAnimationFrame） ----------
  function makeTimeline() {
    var items = [], cur = 0;
    return {
      at: function (dt, fn) { items.push({ t: cur + dt, fn: fn }); },
      add: function (ms) { cur += ms; },
      now: function () { return cur; },
      items: items
    };
  }
  var running = null;
  function runTimeline(tl, onDone) {
    var items = tl.items.slice().sort(function (a, b) { return a.t - b.t; });
    var i = 0, t0 = Date.now();
    var state = { stop: false };
    running = state;
    // ふつうは、画面が隠れている間は時計を止める（戻ったときに一気に進まないように）。?bg=1 では止めない。
    var hiddenAt = document.hidden ? Date.now() : null;
    function onVis() {
      if (document.hidden) { if (hiddenAt === null) hiddenAt = Date.now(); }
      else if (hiddenAt !== null) { t0 += Date.now() - hiddenAt; hiddenAt = null; }
    }
    if (!OPT.bg) document.addEventListener('visibilitychange', onVis);
    function finish() {
      running = null;
      if (timer) clearInterval(timer);
      if (!OPT.bg) document.removeEventListener('visibilitychange', onVis);
      onDone && onDone();
    }
    var lastNow = 0;
    function tick() {
      if (state.stop) return;
      if (!OPT.bg && hiddenAt !== null) { requestAnimationFrame(tick); return; }
      var now = (Date.now() - t0) * OPT.speed;
      // 画面が一瞬止まった（0.25秒以上 進まなかった）ときは、その分を止まっていた時間として扱い、一気に進まないようにする（?bg=1 では追いつかせる）
      if (!OPT.bg && now - lastNow > 250) { t0 += (now - lastNow - 50) / OPT.speed; now = lastNow + 50; }
      lastNow = now;
      while (i < items.length && items[i].t <= now) { items[i].fn(); i++; }
      if (i >= items.length) { finish(); return; }
      if (!OPT.bg) requestAnimationFrame(tick);
    }
    var timer = null;
    if (OPT.bg) timer = setInterval(tick, 40); else requestAnimationFrame(tick);
  }

  // ---------- バトル ----------
  // sim の出来事ログを時間どおりに再生するだけ。計算はしない。
  var HP = { p: 0, e: 0 }, MAX = { p: 1, e: 1 };
  var ghostTimer = {}, dmgCount = { p: 0, e: 0 };
  var ELEM_COLOR = { fire: '#ff5a3c', water: '#3f9cff' };
  function up(side) { return side.toUpperCase(); }
  function setHp(side, hp) {
    HP[side] = hp;
    var pct = Math.max(0, Math.min(100, hp / MAX[side] * 100));
    var fill = $('fill' + up(side));
    fill.style.width = pct + '%';
    fill.classList.toggle('low', hp > 0 && hp / MAX[side] <= 0.25);
    $('hpNum' + up(side)).textContent = hp + ' / ' + MAX[side];
    var bar = $('hp' + up(side));
    bar.classList.remove('shake'); void bar.offsetWidth; bar.classList.add('shake');
    clearTimeout(ghostTimer[side]);
    ghostTimer[side] = setTimeout(function () { $('ghost' + up(side)).style.width = pct + '%'; }, 420 / OPT.speed);
  }
  function resetHp(side, max) {
    MAX[side] = max; HP[side] = max;
    var fill = $('fill' + up(side));
    fill.style.width = '100%'; fill.classList.remove('low');
    $('ghost' + up(side)).style.width = '100%';
    $('hpNum' + up(side)).textContent = max + ' / ' + max;
    $('hp' + up(side)).classList.remove('shake');
  }
  function other(side) { return side === 'p' ? 'e' : 'p'; }
  function animEl(side) { return $(side === 'p' ? 'animP' : 'animE'); }
  function bigEl(side) { return $(side === 'p' ? 'bigL' : 'bigR'); }
  function setBig(side, text, num, small, cls) {
    var b = bigEl(side);
    b.className = 'big ' + (side === 'p' ? 'l' : 'r') + (cls ? ' ' + cls : '');
    b.innerHTML = esc(text) + (num !== undefined && num !== null ? '<span class="bn">' + esc(num) + '</span>' : '') + (small ? '<br><span class="sm">' + esc(small) + '</span>' : '');
  }
  // 体の動き（CSS アニメ。クラスを付け直して再生）
  function playAnim(side, cls, keep) {
    var a = animEl(side);
    if (a.classList.contains('blow')) return; // 倒れた体は動かさない
    a.classList.remove('charge');
    a.classList.remove(cls); void a.offsetWidth; a.classList.add(cls);
    if (!keep) setTimeout(function () { a.classList.remove(cls); }, 800 / OPT.speed);
  }
  function arenaPt(elm, fx, fy) {
    var r = elm.getBoundingClientRect(), a = $('arena').getBoundingClientRect();
    return { x: r.left - a.left + r.width * (fx === undefined ? 0.5 : fx), y: r.top - a.top + r.height * (fy === undefined ? 0.5 : fy) };
  }
  function bodyPt(side, front) {
    var b = animEl(side).querySelector('.body');
    var c = arenaPt(b);
    if (front) c.x += (side === 'p' ? 1 : -1) * 0.3 * b.getBoundingClientRect().width;
    return c;
  }
  function spawn(cls, x, y) {
    var d = el('div', cls); d.style.left = x + 'px'; d.style.top = y + 'px';
    $('fx').appendChild(d); return d;
  }
  function removeLater(d, ms) { setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, ms / OPT.speed); }
  function sparks(x, y, n, dist, color, square) {
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2, r = dist * (0.5 + Math.random() * 0.9);
      var s = spawn('spark' + (square ? ' sq' : ''), x, y);
      s.style.setProperty('--dx', Math.cos(ang) * r + 'px'); s.style.setProperty('--dy', Math.sin(ang) * r + 'px');
      if (color) s.style.background = color;
      removeLater(s, 500);
    }
  }
  // 当たった場所の閃光と火花
  function hitFx(side, big, color, color2) {
    var c = bodyPt(side, true);
    var f = spawn('hitflash' + (big ? ' big' : ''), c.x, c.y);
    if (color) f.style.background = 'radial-gradient(#fff, ' + color + ' 45%, transparent 70%)';
    removeLater(f, 400);
    sparks(c.x, c.y, big ? 16 : 9, big ? 130 : 85, color || null);
    if (color2) sparks(c.x, c.y, big ? 10 : 5, big ? 80 : 40, color2, true);
  }
  function ringFx(side, partId) {
    var g = animEl(side).querySelector('.part.' + partId);
    if (!g) return;
    var c = arenaPt(g);
    var r = spawn('ring', c.x, c.y); removeLater(r, 600);
  }
  // パーツが効いた瞬間：ふくらんで光り、光の輪が広がる
  function glowPart(side, id) {
    var g = animEl(side).querySelector('.part.' + id);
    if (!g) return;
    g.classList.remove('glow'); void g.getBoundingClientRect(); g.classList.add('glow');
    setTimeout(function () { g.classList.remove('glow'); }, 750 / OPT.speed);
    ringFx(side, id);
  }
  function spikeExt(side) {
    var g = animEl(side).querySelector('.part.spike');
    if (!g) return;
    g.classList.remove('ext'); void g.getBoundingClientRect(); g.classList.add('ext');
    setTimeout(function () { g.classList.remove('ext'); }, 500 / OPT.speed);
  }
  function flashBody(side) {
    var b = animEl(side).querySelector('.body');
    if (!b) return;
    b.classList.add('lit'); setTimeout(function () { b.classList.remove('lit'); }, 160 / OPT.speed);
  }
  // コウラ：半透明の盾が出て砕ける
  function shieldFx(side) {
    var c = bodyPt(side, true); c.x += (side === 'p' ? 1 : -1) * 26;
    var s = spawn('shield', c.x, c.y);
    setTimeout(function () { s.classList.add('break'); sparks(c.x, c.y, 7, 70, 'rgba(200,235,255,.9)', true); }, 130 / OPT.speed);
    removeLater(s, 520);
  }
  // 玉（とおくからの攻撃）：尾を引いて飛ぶ
  function shoot(from, elem, flight) {
    var a = bodyPt(from, true), t = bodyPt(other(from), true);
    var color = elem === 'fire' ? '#ff8c42' : (elem === 'water' ? '#4fc3f7' : '#ddd');
    var s = spawn('shot ' + (from === 'p' ? 'l2r' : 'r2l'), a.x, a.y);
    s.style.color = color;
    s.innerHTML = '<div class="tail"></div><div class="core"></div>';
    s.querySelector('.core').style.background = color;
    s.style.transition = 'none'; void s.offsetWidth;
    s.style.transition = 'left ' + (flight / OPT.speed) + 'ms linear, top ' + (flight / OPT.speed) + 'ms linear';
    s.style.left = t.x + 'px'; s.style.top = t.y + 'px';
    removeLater(s, flight + 40);
  }
  // ダメージの数字：ポンと出て少し浮き、次の手まで残す
  function dmgFx(side, amount, cls) {
    var b = animEl(side).querySelector('.body');
    var c = arenaPt(b, 0.5, 0.0);
    var k = dmgCount[side]++;
    var d = spawn('dmg' + (cls ? ' ' + cls : ''), c.x, c.y - k * 34);
    d.textContent = amount;
  }
  function clearFx() { $('fx').innerHTML = ''; dmgCount = { p: 0, e: 0 }; }
  function shakeScreen() {
    var b = $('battle'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    setTimeout(function () { b.classList.remove('shake'); }, 260 / OPT.speed);
  }
  function fullFlash(color) {
    var f = $('flash'); f.style.background = color;
    f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    setTimeout(function () { f.classList.remove('on'); }, 450 / OPT.speed);
  }
  function showResult(text, color, finish) {
    var r = $('bResult');
    r.textContent = text; r.style.color = color;
    r.className = 'result on' + (finish ? ' finish' : '');
  }

  function hitText(ev) {
    var labels = ev.parts.filter(function (p) { return p !== ev.elem; }).map(function (p) { return PLABEL[p]; });
    var main = labels.join('＋');
    var suffix = '！';
    if (ev.elem) {
      var en = PLABEL[ev.elem];
      if (ev.typeEff === 'super') main = (main ? main + '＋' : '') + en + ' ばつぐん';
      else if (ev.typeEff === 'weak') { main = (main ? main + '＋' : '') + en + ' いまひとつ'; suffix = '…'; }
      else if (ev.fieldEff < 1) { main = (main ? main + '＋' : '') + en + ' よわまる'; suffix = '…'; }
      else if (ev.fieldEff > 1) main = (main ? main + '＋' : '') + en + ' つよまる';
      else main = (main ? main + '＋' : '') + en;
    }
    if (!main) return { text: 'こうげき', num: ev.dmg };
    var cnt = (ev.parts.indexOf('claw') >= 0 && ev.hits > 1) ? ' ' + ev.hit + 'かいめ' : '';
    return { text: main + suffix + cnt, num: ev.dmg };
  }

  function startBattle() {
    var e = curEnemyDef(), f = curField(), stage = curStage();
    var p = S.makeFighter('p', S.PLAYER_DEF, G.attached, 1);
    var ef = S.makeFighter('e', e, e.parts, stage);
    var brng = S.makeRng(Math.floor(G.rng() * 4294967296));
    var res = S.simulateBattle(p, ef, f.id, { rng: brng, variance: OPT.rng0 ? 0 : undefined });
    var used = G.attached.slice();

    // 画面の用意
    $('bField').textContent = 'フィールド：' + f.name;
    $('bEName').textContent = e.name;
    $('bHand').textContent = '0';
    $('arena').className = 'arena ' + f.id;
    $('animP').className = 'anim'; $('animE').className = 'anim';
    $('animP').innerHTML = monsterSVG('player', G.attached, 'r');
    $('animE').innerHTML = monsterSVG(e.id, e.parts, 'l');
    $('bResult').className = 'result'; $('bResult').textContent = '';
    $('battle').classList.remove('shake');
    clearFx();
    setBig('p', ''); setBig('e', '');
    resetHp('p', res.p.maxHp); resetHp('e', res.e.maxHp);
    show('battle');

    // 時間割をつくる（1手 ≈ 1.5秒：1撃 0.56秒 ＋ 間 0.9秒。とどめの一撃だけ約1秒長い）
    var tl = makeTimeline();
    var st = res.start;
    var names = { p: 'あなた', e: 'あいて' };
    tl.at(0, function () {
      if (st.fireOut.p) setBig('p', 'ほのお… みずで きえた');
      if (st.fireOut.e) setBig('e', 'ほのお… みずで きえた');
    });
    if (st.fireOut.p || st.fireOut.e) tl.add(900);
    tl.at(0, function () {
      if (st.wingHelped) { glowPart(st.first, 'wing'); playAnim(st.first, 'hop'); sfxPart('wing'); setBig(st.first, 'はね！ せんこう', null, st.double ? 'さいしょに 2かい うごく' : null); }
      else setBig(st.first, names[st.first] + 'が せんこう', null, st.double ? 'さいしょに 2かい うごく' : null);
    });
    tl.add(1000);

    var handsPlayed = 0;
    res.hands.forEach(function (hand) {
      var a = hand.actor, d = other(a);
      tl.at(0, function () { handsPlayed = hand.n; $('bHand').textContent = hand.n; clearFx(); setBig('p', ''); setBig('e', ''); });
      hand.events.forEach(function (ev) {
        if (ev.t === 'double') {
          tl.at(0, function () { glowPart(a, 'spring'); playAnim(a, 'hop'); sfxPart('spring'); setBig(a, 'ばねあし！ 2かい うごく'); });
          tl.add(650);
        } else if (ev.t === 'hit') {
          var finisher = ev.hp === 0;            // この一撃で相手が倒れる
          var superE = ev.typeEff === 'super', weakE = ev.typeEff === 'weak';
          var pre = finisher ? 300 : 0;          // とどめは 0.3 秒ためる
          if (finisher) tl.at(0, function () { playAnim(a, 'charge', true); });
          tl.at(pre, function () {
            if (ev.ranged) shoot(a, ev.elem, 230); else playAnim(a, 'lunge');
          });
          tl.at(pre + 230, function () {
            setHp(d, ev.hp); flashBody(d);
            var c1 = ev.elem ? (ev.elem === 'fire' ? '#ff7a2a' : '#7fd4ff') : null;
            var c2 = ev.elem ? (ev.elem === 'fire' ? '#ffd166' : '#dff6ff') : null;
            if (finisher) {
              playAnim(d, 'blow', true); shakeScreen(); fullFlash('#ffffff');
              hitFx(d, true, c1, c2);
              SFX.finish();
              showResult(d === 'e' ? 'たおした！' : 'やられた…', d === 'e' ? '#ffcc4d' : '#ff9c9c', true);
            } else {
              playAnim(d, weakE ? 'squash-weak' : 'squash');
              hitFx(d, superE, c1, c2);
            }
            ev.parts.forEach(function (pid) { glowPart(a, pid); });
            if (ev.parts.length) sfxPart(ev.parts[ev.parts.length - 1]); else SFX.plain();
            var ht = hitText(ev);
            var cls = superE ? 'super ' + ev.elem : '';
            setBig(a, ht.text, ht.num, null, cls);
            if (superE) { SFX.super(); fullFlash(ELEM_COLOR[ev.elem] || '#fff'); }
            if (weakE) SFX.weak();
            dmgFx(d, ev.dmg, superE ? 'super ' + ev.elem : (weakE ? 'weak' : ''));
            var dtext = [];
            if (ev.shell) { glowPart(d, 'shell'); shieldFx(d); SFX.shell(); dtext.push('コウラ！ −' + ev.shell); }
            if (ev.hard) dtext.push('かたい −' + S.CFG.hardFlat);
            if (dtext.length) setBig(d, dtext.join(' '));
          });
          tl.add(pre + 560 + (finisher ? 500 : 0));
        } else if (ev.t === 'counter') {
          var cs = ev.side, tgt = other(cs);
          var cFin = ev.hp === 0;
          var cPre = cFin ? 300 : 0;
          if (cFin) tl.at(0, function () { spikeExt(cs); });
          tl.at(cPre, function () {
            spikeExt(cs); glowPart(cs, 'spike'); SFX.spike();
            setHp(tgt, ev.hp); flashBody(tgt);
            if (cFin) {
              playAnim(tgt, 'blow', true); shakeScreen(); fullFlash('#ffffff'); hitFx(tgt, true, '#ffd54a', null); SFX.finish();
              showResult(tgt === 'e' ? 'たおした！' : 'やられた…', tgt === 'e' ? '#ffcc4d' : '#ff9c9c', true);
            } else { playAnim(tgt, 'squash'); hitFx(tgt, false, null, null); }
            dmgFx(tgt, ev.dmg, 'counter');
            setBig(cs, 'トゲ！ はんげき', ev.dmg);
          });
          tl.add(cPre + 560 + (cFin ? 500 : 0));
        } else if (ev.t === 'ko') {
          tl.add(300);
        } else if (ev.t === 'timeout') {
          tl.at(0, function () {
            setBig('p', ''); setBig('e', '');
            showResult('16手 おわり', '#f4f1ea', false);
          });
          tl.add(1100);
          tl.at(0, function () {
            var pr = Math.round(HP.p / MAX.p * 100), er = Math.round(HP.e / MAX.e * 100);
            setBig('p', 'のこり ' + pr + '%'); setBig('e', 'のこり ' + er + '%');
            $('bResult').className = 'result';
          });
          tl.add(1200);
        }
      });
      tl.add(900); // 1手ごとに止めて見せる
    });

    // 結果
    var won = res.winner === 'p';
    tl.at(0, function () {
      showResult(won ? 'かち！' : 'まけ…', won ? '#ffcc4d' : '#ff9c9c', false);
      if (won) sfxWin(); else sfxLose();
    });
    tl.add(1700);

    runTimeline(tl, function () {
      // 演出と状態のずれを確かめる
      var mismatch = (HP.p !== res.p.hp) || (HP.e !== res.e.hp) || (handsPlayed !== res.nHands);
      if (mismatch) console.error('[でこもん] 画面と計算がずれた', { shownHp: { p: HP.p, e: HP.e }, simHp: { p: res.p.hp, e: res.e.hp }, shownHands: handsPlayed, simHands: res.nHands });
      if (OPT.auto) { G.auto.battles++; if (mismatch) G.auto.mismatches++; if (won) G.auto.wins++; }
      G.history.push({ enemy: e, field: f, parts: used, win: won, hands: res.nHands, timeout: res.timeout });
      if (won) {
        G.wins++;
        if (G.battle >= 4) showClear();
        else showDraft();
      } else showOver();
    });
  }

  // ---------- ドラフト ----------
  function showDraft() {
    var offer = S.draftOffer(G.owned, G.rng);
    if (!offer.length) { G.battle++; showPre(); return; }
    var list = $('dlist'); list.innerHTML = '';
    offer.forEach(function (id) {
      var c = partCard(id, false);
      c.addEventListener('click', function () { pickDraft(id); });
      list.appendChild(c);
    });
    show('draft');
    if (OPT.auto) setTimeout(function () { pickDraft(S.matchedDraft(G.owned, offer, curStage() + 1)); }, 500 / OPT.speed);
  }
  function pickDraft(id) {
    if (G.screen !== 'draft') return;
    G.owned.push(id);
    G.battle++;
    showPre();
  }

  // ---------- クリア・負け ----------
  function historyList(container) {
    container.innerHTML = '';
    G.history.forEach(function (h, i) {
      var it = el('div', 'it');
      it.innerHTML = '<div>' + monsterSVG(h.enemy.id, h.enemy.parts, 'l') + '</div><div class="t"><b>' + (i + 1) + 'せんめ ' + esc(h.enemy.name) + '</b>（' + esc(h.field.name) + '）' + (h.win ? '' : ' <span style="color:var(--bad)">まけ</span>') +
        '<small>つかった：' + (h.parts.length ? h.parts.map(function (p) { return esc(S.PART_BY_ID[p].name); }).join('、') : 'なし') + '</small></div>';
      container.appendChild(it);
    });
  }
  function showClear() {
    historyList($('clearList'));
    show('clear');
    if (OPT.auto) { G.auto.runs++; G.auto.clears++; logAuto(); setTimeout(restart, 900 / OPT.speed); }
  }
  function showOver() {
    var h = G.history[G.history.length - 1];
    $('overTitle').textContent = G.wins + 'れんしょう で おわり';
    $('overMon').innerHTML = monsterSVG(h.enemy.id, h.enemy.parts, 'l');
    $('overEName').textContent = h.enemy.name;
    var tr = $('overTraits'); tr.innerHTML = '';
    h.enemy.traits.forEach(function (t) { tr.appendChild(el('div', 'trait', '<b>' + esc(S.TRAITS[t].name) + '</b>')); });
    $('overField').textContent = 'フィールド：' + h.field.name;
    $('overParts').textContent = 'あなたの パーツ：' + (h.parts.length ? h.parts.map(function (p) { return S.PART_BY_ID[p].name; }).join('、') : 'なし');
    historyList($('overList'));
    show('over');
    if (OPT.auto) { G.auto.runs++; logAuto(); setTimeout(restart, 900 / OPT.speed); }
  }
  function restart() { G.firstRun = false; startRun(); }
  function logAuto() {
    var a = G.auto;
    console.log('[でこもん auto] 周回 ' + a.runs + '、5連勝 ' + a.clears + '、戦い ' + a.battles + '、勝ち ' + a.wins + '、ずれ ' + a.mismatches);
    window.__dekomonAuto = a;
  }

  // ---------- ボタン ----------
  $('titleMon').innerHTML = monsterSVG('player', ['horn', 'wing'], 'r');
  $('startBtn').addEventListener('click', function () { initAudio(); startRun(); });
  $('againBtn1').addEventListener('click', function () { initAudio(); restart(); });
  $('againBtn2').addEventListener('click', function () { initAudio(); restart(); });
  window.__dekomon = { G: G, OPT: OPT, seed: seed, dbg: { showClear: showClear, showOver: showOver, showPre: showPre } };
  if (OPT.auto) setTimeout(function () { $('startBtn').click(); }, 300);
})();
</script>
</body>
</html>
