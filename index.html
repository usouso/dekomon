<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たたみやま</title>
<style>
  :root {
    --bg: #f6efe3; --panel: #fffaf1; --ink: #3b3024; --sub: #7a6a58; --line: #d9c9b2;
    --safe: #4caf6e; --luck: #e2a33a; --bad: #d9534f; --accent: #4a7fd6; --glow: #ffd54a;
    --c-tshirt: #7fb3ff; --c-socks: #ffb27f; --c-towel: #8fd68f; --c-jeans: #4a6fb5; --c-slick: #d9c2ff; --c-sheet: #fff0b3;
    --fs: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif; font-size: var(--fs); line-height: 1.35; }
  button { font: inherit; color: inherit; cursor: pointer; border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 6px 12px; }
  button:disabled { opacity: .45; cursor: default; }
  svg { display: block; }
  .hidden { display: none !important; }

  /* ---------- 全体の枠（PC：横3列） ---------- */
  #app { height: 100%; display: grid; grid-template-rows: 52px 1fr; grid-template-columns: minmax(0, 1fr); width: 100%; }
  #head { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 2px solid var(--line); background: var(--panel); }
  #head > * { white-space: nowrap; }
  #head .title { font-weight: 700; font-size: 20px; letter-spacing: .04em; }
  #head .dayLbl { font-size: 20px; font-weight: 700; }
  #head .tripLbl { font-size: 17px; color: var(--sub); }
  #head .sp { flex: 1; }
  .seg { display: flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 15px; font-weight: 400; margin-left: auto; }
  .seg button { border: 0; border-radius: 0; padding: 3px 10px; }
  .seg button.on { background: var(--accent); color: #fff; }
  #volBox { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--sub); }
  #vol { width: 90px; }
  #main { display: grid; grid-template-columns: 250px minmax(0, 1fr) 340px; gap: 10px; padding: 10px; min-height: 0; min-width: 0; }
  .col { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .box { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px; position: relative; }
  .box h2 { margin: 0 0 6px; font-size: 17px; font-weight: 700; color: var(--sub); display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
  .box h2 > * { white-space: nowrap; }
  .guide { display: inline-block; background: var(--accent); color: #fff; font-size: 15px; padding: 1px 10px; border-radius: 10px; }

  /* ---------- かご ---------- */
  #basketBox { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #basket { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; align-content: start; overflow-y: auto; min-height: 0; }
  .bitem { border: 2px solid var(--line); border-radius: 10px; background: #fff; padding: 4px 2px 2px; text-align: center; cursor: pointer; position: relative; }
  .bitem svg { width: 100%; height: 30px; }
  .bitem .nm { font-size: 14px; line-height: 1.2; }
  .bitem.sel { border-color: var(--accent); box-shadow: 0 0 0 3px #4a7fd655; }
  .bitem.folded { background: #f0f6ff; }
  .bitem .fdg { position: absolute; left: 4px; top: 2px; font-size: 14px; font-weight: 700; color: var(--sub); }
  #foldBox { min-height: 150px; }
  #foldBox .who { color: var(--ink); }
  #folds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #folds.one { grid-template-columns: 1fr; }
  .fbtn { display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 6px 8px; text-align: left; min-height: 104px; background: #fff; }
  .fbtn svg { width: 100%; height: 34px; }
  .fbtn .fn { font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; align-items: center; white-space: nowrap; gap: 4px; }
  .fbtn .fn .g { color: var(--sub); font-size: 15px; font-weight: 400; }
  .fbtn .ft { font-size: 15px; color: var(--sub); min-height: 2.6em; }
  .fbtn.sel { border-color: var(--accent); box-shadow: 0 0 0 3px #4a7fd655; }
  #foldHint { font-size: 15px; color: var(--sub); margin-top: 4px; }

  /* ---------- 山 ---------- */
  #stacksBox { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #stackUI { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  #stacks { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .slot { display: flex; flex-direction: column; align-items: center; border: 2px dashed var(--line); border-radius: 14px; padding: 6px 6px 4px; cursor: pointer; min-height: 0; position: relative; }
  .slot.can { border-color: var(--accent); background: #f3f8ff; }
  .slot.away { opacity: .35; }
  .slot .sname { font-size: 15px; color: var(--sub); white-space: nowrap; }
  .stackbox { position: relative; width: 100%; flex: 1; min-height: 0; }
  .stackbox svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .gnum { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); min-width: 1.5em; height: 1.35em; line-height: 1.2em; text-align: center; font-weight: 700; font-size: clamp(14px, 1.3vw, 20px); border-radius: 1em; background: #fff; border: 2px solid var(--line); padding: 0 .25em; white-space: nowrap; }
  .gnum.z { color: var(--safe); border-color: var(--safe); }
  .gnum.gdot { min-width: 0; width: 12px; height: 12px; padding: 0; border-color: var(--safe); background: var(--safe); font-size: 0; }
  .gnum.chg { background: var(--glow); border-color: #c9a000; }
  .gnum.chg.up { background: #ffd0cc; border-color: var(--bad); }
  .layer.fx-give rect, .layer.fx-give ellipse, .layer.fx-give circle, .layer.fx-give path { filter: drop-shadow(0 0 4px #ffb300); }
  .layer.fx-take { animation: fx-pulse calc(.9s / var(--spd, 1)) ease-in-out 2; }
  .layer.fx-top:hover { opacity: .85; }
  .layer.fx-hot rect, .layer.fx-hot ellipse, .layer.fx-hot circle, .layer.fx-hot path { filter: drop-shadow(0 0 5px #ff3b30) drop-shadow(0 0 2px #ff3b30); }
  @keyframes fx-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  .layer.fx-drop { animation: fx-dropdown calc(.8s / var(--spd, 1)) ease-in forwards; }
  @keyframes fx-dropdown { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(30px, 260px) rotate(40deg); opacity: 0; } }
  .layer.fx-pat { animation: fx-pat .35s ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes fx-pat { 0% { transform: scaleY(1.8) translateY(0); } 60% { transform: scaleY(.85); } 100% { transform: scaleY(1); } }
  .bar { width: 100%; margin-top: 4px; }
  .bar .cells { position: relative; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 14px; }
  .bar .cell { background: #e9e0d1; border-radius: 3px; }
  .bar .cell.g { background: var(--safe); }
  .bar .cell.g.luck { background: var(--luck); }
  .bar .cell.s { background: #8a7a68; }
  .bar .cell.over { background: var(--bad); }
  .bar .line4 { position: absolute; left: calc(40% + 0px); top: -4px; bottom: -4px; width: 3px; background: var(--ink); border-radius: 2px; }
  .bar .txt { display: flex; flex-wrap: wrap; justify-content: center; font-size: 15px; margin-top: 3px; gap: 1px 6px; line-height: 1.25; }
  .bar .txt span { white-space: nowrap; }
  .bar .txt .tot { font-weight: 700; }
  .bar .txt .judge { color: var(--safe); }
  .bar .txt .judge.luck { color: #a86b00; }
  .bar .txt .judge.bad { color: var(--bad); }
  #carryBtnRow { display: flex; justify-content: center; align-items: center; gap: 12px; }
  #carryBtn { font-size: 20px; font-weight: 700; padding: 10px 36px; background: var(--accent); color: #fff; border-color: #2f5fb0; }
  #carryBtn:disabled { background: #b7c4da; border-color: #b7c4da; }
  #carryNote { font-size: 15px; color: var(--sub); }

  /* ---------- 道（運ぶ） ---------- */
  #roadBox { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #road { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .stations { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .st { text-align: center; font-size: 15px; color: var(--sub); border-bottom: 3px solid var(--line); padding-bottom: 3px; }
  .st svg { width: 100%; height: 40px; }
  .st .sn { font-weight: 700; color: var(--ink); }
  .st.now { border-bottom-color: var(--accent); background: #f3f8ff; border-radius: 8px 8px 0 0; }
  #walk { position: relative; height: 300px; margin-top: 6px; }
  #carrier { position: absolute; left: 0; bottom: 0; width: 40%; transition: left calc(1.2s / var(--spd, 1)) linear; }
  #carrier .cst { position: relative; width: 100%; height: 236px; transform-origin: 50% 100%; transition: transform calc(.5s / var(--spd, 1)) ease; }
  #carrier .cst svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #carrier .person { width: 100%; height: 54px; }
  #carrier .gnum { font-size: clamp(14px, 1vw, 18px); }
  #carryMsg { font-size: 17px; min-height: 2.8em; margin-top: 6px; padding: 6px 8px; border-radius: 10px; background: #f3efe6; }
  #carryMsg b { color: var(--bad); }
  #carryMsg .calm { color: var(--safe); font-weight: 700; }
  #carryBar { margin-top: 4px; }
  #delivered { font-size: 16px; color: var(--sub); margin-top: 6px; }
  #roadHint { font-size: 15px; color: var(--sub); margin-top: 6px; line-height: 1.3; }
  #endDays { flex: 1; min-height: 0; overflow: auto; }

  /* ---------- 夕方・おわり（山の置き場の上に出る） ---------- */
  .overlay { position: absolute; inset: 0; background: var(--panel); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .overlay h3 { margin: 0; font-size: 24px; }
  .bigline { font-size: 20px; }
  .bigline b { font-size: 26px; }
  #falls { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .fallrec { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; font-size: 16px; background: #fff; }
  .fallrec > svg { height: 36px; width: 46px; flex: none; }
  .fallrec .txt { flex: 1; min-width: 0; }
  .fallrec .picks { display: flex; flex-wrap: wrap; gap: 2px; max-width: 40%; justify-content: flex-end; align-items: center; font-size: 15px; color: var(--sub); }
  .fallrec .picks svg { width: 28px; height: 24px; }
  .overlay .btnrow { display: flex; gap: 10px; align-items: center; }
  .overlay .btnrow button { font-size: 19px; font-weight: 700; padding: 8px 26px; background: var(--accent); color: #fff; border-color: #2f5fb0; white-space: nowrap; }
  #endBig { font-size: 40px; font-weight: 700; margin: 6px 0; }
  #endBig.ok { color: var(--safe); }
  .stars { font-size: 22px; color: #c9a000; }

  /* ---------- タイトル（最初の▶） ---------- */
  #title { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 20; }
  #title h1 { margin: 0; font-size: 44px; letter-spacing: .1em; }
  #title p { margin: 0; font-size: 18px; color: var(--sub); }
  #startBtn { font-size: 34px; padding: 10px 44px; background: var(--accent); color: #fff; border-color: #2f5fb0; }
  #titleArt { width: 220px; height: 160px; }

  /* ---------- 「3→0」の吹き出し ---------- */
  .fx-chg { position: absolute; transform: translate(-50%, -50%); font-size: clamp(16px, 1.6vw, 24px); font-weight: 700; color: #6b4e00; background: var(--glow); border: 2px solid #c9a000; border-radius: 12px; padding: 2px 10px; white-space: nowrap; z-index: 5; animation: fx-pop calc(1.6s / var(--spd, 1)) ease-out forwards; pointer-events: none; }
  .fx-chg.up { background: #ffd0cc; border-color: var(--bad); color: #7a1d19; }
  @keyframes fx-pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }

  /* ---------- スマホ（縦） ---------- */
  @media (max-width: 900px) {
    :root { --fs: 15px; }
    #app { grid-template-rows: 44px 1fr; }
    #head { gap: 8px; padding: 0 8px; }
    #head .title { font-size: 17px; }
    #head .dayLbl { font-size: 17px; }
    #head .tripLbl { font-size: 15px; }
    #vol { width: 60px; }
    #volBox span { display: none; }
    body.sc-stack #walk, body.sc-stack #carryMsg, body.sc-stack #delivered { display: none; }
    #roadHint { margin-top: 3px; font-size: 14px; }
    body.sc-carry #colL, body.sc-evening #colL, body.sc-end #colL { display: none; }
    body.sc-stack #roadHint { display: block; }
    #main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; padding: 6px; }
    #colL { order: 3; max-height: 36vh; }
    #basketBox { flex: 1; min-height: 0; }
    #colM { order: 2; }
    #colR { order: 1; }
    .box { padding: 6px 8px; border-radius: 10px; }
    .box h2 { font-size: 15px; margin-bottom: 3px; }
    #roadBox { flex: none; }
    .st svg { height: 24px; }
    .st { font-size: 14px; }
    #walk { height: 124px; }
    #carrier { width: 30%; }
    #carrier .cst { height: 92px; }
    #carrier .person { height: 30px; }
    #carryMsg { font-size: 15px; min-height: 2.6em; padding: 3px 6px; }
    #basket { grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .bitem { padding: 2px 1px 1px; border-radius: 8px; }
    .bitem svg { height: 22px; }
    .bitem .nm { font-size: 14px; }
    #foldBox { min-height: 0; }
    .fbtn { min-height: 0; padding: 4px 6px; }
    .fbtn svg { height: 22px; }
    .fbtn .fn { font-size: 15px; }
    .fbtn .ft { font-size: 14px; min-height: 0; }
    #stacks { gap: 5px; }
    .bar .txt .lbl { display: none; }
    .bar .txt .judge, .slot .sname { white-space: normal; text-align: center; }
    .slot { padding: 3px 3px 2px; }
    .slot .sname { font-size: 14px; }
    .gnum { font-size: 14px; min-width: 1.4em; height: 1.4em; line-height: 1.3em; }
    .bar .cells { height: 10px; }
    .bar .txt { font-size: 14px; }
    #carryBtn { font-size: 17px; padding: 6px 24px; }
    .overlay { padding: 8px; }
    .overlay h3 { font-size: 19px; }
    .bigline { font-size: 16px; } .bigline b { font-size: 20px; }
    .fallrec { font-size: 14px; gap: 6px; }
    .fallrec > svg { width: 34px; height: 28px; }
    .fallrec .picks { max-width: 34%; }
    .fallrec .picks svg { width: 22px; height: 20px; }
    #endBig { font-size: 30px; }
    #title h1 { font-size: 34px; }
  }
</style>
</head>
<body>
<div id="title">
  <svg id="titleArt" viewBox="0 0 220 160" aria-hidden="true"></svg>
  <h1>たたみやま</h1>
  <p>たたんで、つんで、はこぶ。</p>
  <button id="startBtn" aria-label="はじめる">▶</button>
</div>

<div id="app">
  <div id="head">
    <span class="title">たたみやま</span>
    <span class="dayLbl" id="dayLbl">1日目／3</span>
    <span class="tripLbl" id="tripLbl">おうふく 2かい</span>
    <span class="sp"></span>
    <span id="volBox"><span>おんりょう</span><input id="vol" type="range" min="0" max="100" value="30" aria-label="おんりょう"></span>
  </div>
  <div id="main">
    <div class="col" id="colL">
      <div class="box" id="basketBox">
        <h2>かご <span id="basketCnt"></span> <span class="guide hidden" id="gSelect">えらぶ</span></h2>
        <div id="basket"></div>
      </div>
      <div class="box" id="foldBox">
        <h2>たたみかた <span id="foldWho" class="who"></span> <span class="guide hidden" id="gFold">たたむ</span></h2>
        <div id="folds"></div>
        <div id="foldHint">かごの 1まいを えらぶ</div>
      </div>
    </div>
    <div class="col" id="colM">
      <div class="box" id="stacksBox">
        <div id="stackUI">
        <h2>やま <span id="stacksNote"></span> <span class="guide hidden" id="gStack">つむ</span></h2>
        <div id="stacks"></div>
        <div id="carryBtnRow"><button id="carryBtn" disabled>はこぶ</button><span id="carryNote"></span><span class="guide hidden" id="gCarry">はこぶ</span></div>
        </div>
        <div class="overlay hidden" id="evening">
          <h3 id="evTitle">1日目の ゆうがた</h3>
          <div class="bigline" id="evLine"></div>
          <div class="bigline stars" id="evStars"></div>
          <div id="falls"></div>
          <div class="btnrow"><button id="nextBtn">つぎの 日へ</button><span id="evNote"></span></div>
        </div>
        <div class="overlay hidden" id="end">
          <h3>3日目の ゆうがた</h3>
          <div id="endBig"></div>
          <div class="bigline" id="endLine"></div>
          <div class="bigline stars" id="endStars"></div>
          <div id="endDays" class="bigline"></div>
          <div class="btnrow"><button id="againBtn" aria-label="もう一回">↻</button></div>
        </div>
      </div>
    </div>
    <div class="col" id="colR">
      <div class="box" id="roadBox">
        <h2>みち <span class="seg" id="speedSeg"><button data-speed="1" class="on">ふつう</button><button data-speed="2.5">はやい</button></span></h2>
        <div id="road">
          <div class="stations" id="stations"></div>
          <div id="walk"><div id="carrier" class="hidden"><div class="cst" id="carrierStack"></div><svg class="person" viewBox="0 0 120 54" aria-hidden="true"></svg></div></div>
          <div id="carryBar" class="bar hidden"></div>
          <div id="carryMsg">つんだら「はこぶ」。はこぶのは みまもるだけ。</div>
          <div id="delivered"></div>
          <div id="roadHint">ゆれは たまる（ぜんぶで さいだい 6）。やまの ぐらが 4いかなら、かならず とどく。</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="rules.js"></script>
<script src="ui.js"></script>
</body>
</html>
