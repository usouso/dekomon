<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>でこもん つくりなおし</title>
<style>
:root { --bg:#141824; --panel:#1f2535; --panel2:#2a3146; --ink:#f4f1ea; --dim:#aab0c0; --atk:#e5534b; --def:#4a8fe7; --mov:#46b85a; --luck:#e8b923; --st:#a66bd6; --heart:#ff6b8a; }
* { box-sizing: border-box; }
html { font-size: 16px; }
@media (min-width: 1700px) and (min-height: 850px) { html { font-size: 20px; } }
@media (max-width: 700px) { html { font-size: 15px; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family: "Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
.screen { display:none; min-height:100vh; padding: .6rem .8rem 4.2rem; max-width: 1400px; margin: 0 auto; }
.screen.on { display:block; }
h1 { margin:.4rem 0; font-size:2.2rem; letter-spacing:.1em; }
h2 { margin:.2rem 0 .5rem; font-size:1.3rem; }
.big { font-size:1.15rem; padding:.6rem 1.6rem; border-radius:.8rem; border:3px solid #ffcc4d; background:#3a2f10; font-weight:900; }
.btn { padding:.45rem 1rem; border-radius:.6rem; border:2px solid #556; background:var(--panel2); font-weight:800; }
.btn:hover, .big:hover { filter: brightness(1.2); }
.row { display:flex; gap:.8rem; align-items:flex-start; flex-wrap:wrap; }
.center { text-align:center; }
.top { display:flex; align-items:center; gap:1rem; margin-bottom:.4rem; min-height:2.2rem; }
.hearts { font-size:1.5rem; color:var(--heart); letter-spacing:.1em; }
.hearts .off { color:#444b5c; }
.stage { color:var(--dim); font-weight:800; }
.dots { display:flex; gap:.25rem; } .dots i { width:.7rem; height:.7rem; border-radius:50%; background:#3a4256; display:block; } .dots i.w { background:#7ee787; } .dots i.now { background:#ffcc4d; } .dots i.boss { border-radius:2px; }
/* カード：自分も 相手も 同じ 形 */
.card { background:var(--panel); border:3px solid #3a4256; border-radius:1rem; padding:.5rem .6rem; width: 15.5rem; position:relative; }
.card.me { border-color:#7fd1ae; }
.card.hard { border-color:#ff7a59; }
.card .nm span:first-child { white-space:nowrap; }
.card .nm { font-weight:900; font-size:1.15rem; display:flex; justify-content:space-between; align-items:center; gap:.3rem; }
.card .sub { color:var(--dim); font-size:.85rem; font-weight:700; }
.card .pic { height:6.2rem; display:flex; justify-content:center; }
.card .pic svg { height:100%; }
.stats { display:grid; grid-template-columns: repeat(5, 1fr); gap:.15rem; margin:.3rem 0; }
.stat { background:#151a27; border-radius:.45rem; text-align:center; padding:.15rem 0; }
.stat .ic { font-size:.85rem; color:var(--dim); font-weight:800; display:block; }
.stat b { font-size:1.25rem; }
.stat .d { font-size:.8rem; font-weight:900; display:block; min-height:.9rem; line-height:.9rem; }
.stat .d.up { color:#7ee787; } .stat .d.dn { color:#ff8a8a; }
.kws { display:flex; flex-wrap:wrap; gap:.25rem; min-height:1.7rem; }
.kw { border-radius:999px; padding:.1rem .55rem; font-size:.85rem; font-weight:900; border:2px solid; background:#151a27; cursor:help; }
.kw.atk { border-color:var(--atk); color:#ffb0aa; } .kw.def { border-color:var(--def); color:#b4d3ff; } .kw.mov { border-color:var(--mov); color:#b5f0bf; } .kw.luck { border-color:var(--luck); color:#ffe9a0; } .kw.st { border-color:var(--st); color:#e3c4ff; }
.kw.born { box-shadow: 0 0 0 2px #fff3 inset; }
/* はじめての ことば：ひとこと（MTG の 注釈文。3戦 会ったら 消える） */
.kw.knew { white-space:nowrap; }
.kw .kwn { font-weight:800; font-size:.8rem; color:var(--ink); margin-left:.3rem; }
@media (min-width: 701px) and (max-height: 700px) { .card .pic { height:5rem; } }
/* ことばの ページ（いつでも 引ける） */
.kbtn { margin-left:auto; padding:.2rem .7rem; font-size:.95rem; }
#kotoba { position:fixed; inset:0; background:#0b0e16f2; z-index:30; display:none; padding:.8rem 1rem; overflow-y:auto; }
#kotoba.on { display:block; }
.kotw { max-width: 72rem; margin:0 auto; }
.kothead { display:flex; align-items:center; gap:1rem; margin-bottom:.4rem; position:sticky; top:-.8rem; background:#0b0e16; padding:.3rem 0; z-index:1; }
.kothead h2, .kothead .btn { white-space:nowrap; flex:none; }
.kothead .sub { color:var(--dim); font-weight:700; font-size:.95rem; }
.kotgrid { display:grid; grid-template-columns: repeat(3, 1fr); gap:.35rem .6rem; }
.kote { background:var(--panel); border-radius:.6rem; padding:.3rem .5rem; border-left:6px solid #555d70; }
.kote.atk { border-left-color:var(--atk); } .kote.def { border-left-color:var(--def); } .kote.mov { border-left-color:var(--mov); } .kote.luck { border-left-color:var(--luck); } .kote.st { border-left-color:var(--st); }
.kote .k1 { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
.kote .ks { font-weight:900; color:#ffe066; }
.kote .kl { font-size:.85rem; color:var(--dim); font-weight:700; margin-top:.1rem; }
.kote.unmet .ks { color:var(--dim); }
.kotleg { display:flex; gap:.5rem; flex-wrap:wrap; margin:.2rem 0 .5rem; }
.kw.fx-glow, .ptile.fx-glow, .wz.fx-glow { animation: fxglow .6s ease-out; }
@keyframes fxglow { 0% { transform:scale(1.25); box-shadow:0 0 18px 6px #ffe066; } 100% { transform:scale(1); box-shadow:none; } }
.ptiles { display:flex; gap:.3rem; margin-top:.35rem; flex-wrap:wrap; }
.ptile { width:3.1rem; height:3.1rem; border-radius:.55rem; border:3px solid; background:#151a27; display:flex; align-items:center; justify-content:center; position:relative; }
.ptile svg { width:2.5rem; height:2.5rem; }
.ptile.atk { border-color:var(--atk); } .ptile.def { border-color:var(--def); } .ptile.mov { border-color:var(--mov); }
.ptile.empty { border-style:dashed; border-color:#555d70; color:#555d70; font-size:.8rem; font-weight:800; }
.wzs { display:flex; gap:.25rem; flex-wrap:wrap; margin-top:.3rem; }
.wz { font-size:.8rem; font-weight:900; padding:.1rem .45rem; border-radius:.35rem; background:#3b2f55; border:2px solid #9b7fe0; cursor:help; }
.wz.learn { background:#4a3a12; border-color:#ffd166; }
.wz.learn.off { opacity:.45; border-style:dashed; }
.wz.oya { background:#1f3a3a; border-color:#7fe0c8; }
.eggnote { margin:.5rem auto 0; font-weight:800; }
.eggnote:empty { display:none; }
.eggbar { max-width:52rem; margin:.2rem auto .6rem; padding:.45rem .8rem; border:3px solid #7fe0c8; border-radius:.9rem; background:#17302e; text-align:center; font-weight:800; }
.eggbar.off { opacity:.55; border-style:dashed; }
.eggbar .btn { margin-left:.5rem; }
.eggw { max-width:40rem; margin:0 auto; text-align:center; }
@media (max-width: 700px) { .eggw h1 { font-size:1.6rem; } }
.eggpick { display:grid; grid-template-columns:repeat(auto-fit, minmax(15rem, 1fr)); gap:.6rem; margin:.8rem 0; }
.eggpick button { text-align:left; padding:.6rem .8rem; border-radius:.8rem; border:3px solid #ffd166; background:#4a3a12; color:inherit; font:inherit; cursor:pointer; }
.eggpick button:hover { border-color:#fff; }
.eggpick b { font-size:1.15rem; } .eggpick .sub { display:block; margin-top:.2rem; color:var(--dim); }
.hira { font-size:1.15rem; font-weight:900; color:#ffe066; }
.nare { display:flex; flex-wrap:wrap; gap:.3rem .9rem; justify-content:center; font-size:1.05rem; font-weight:800; }
.nare .dots { color:#ffd166; letter-spacing:.1rem; }
.tag { white-space:nowrap; font-size:.8rem; font-weight:900; padding:.05rem .45rem; border-radius:.35rem; }
.tag.hard { background:#ff7a59; color:#2a0f05; }
/* 下の 説明の 帯（合わせる／タップで 出る） */
#tip { position:fixed; left:0; right:0; bottom:0; min-height:3.4rem; background:#0d1018ee; border-top:2px solid #3a4256; padding:.45rem 1rem; font-size:1rem; font-weight:700; z-index:20; }
#tip b { color:#ffe066; }
body[data-scr="title"] #tip { display:none; } /* タイトルには カードも パーツも ない（帯の 文が 合わない）。ことばの ページは 中に 説明が ある */
/* 種類を 選ぶ */
.spgrid { display:grid; grid-template-columns: repeat(auto-fit, 15.5rem); gap:.8rem; justify-content:center; }
.spgrid .card { cursor:pointer; }
.spgrid .card:hover { border-color:#ffcc4d; }
.theme { font-weight:900; color:#ffe066; }
/* わかれみち */
.forkw { display:flex; gap:1rem; justify-content:center; align-items:stretch; flex-wrap:wrap; }
.road { display:flex; flex-direction:column; align-items:center; gap:.4rem; background:#1a2030; border-radius:1rem; padding:.6rem; border:3px solid transparent; cursor:pointer; }
.road:hover { border-color:#ffcc4d; }
.road .gift { font-weight:900; font-size:.95rem; }
.vs { align-self:center; font-weight:900; color:var(--dim); font-size:1.3rem; }
/* じゅんび */
.prepw { display:flex; gap:1rem; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
.slots { background:#1a2030; border-radius:1rem; padding:.6rem; width: 27rem; }
.slot { display:flex; gap:.5rem; align-items:center; padding:.35rem; border-radius:.7rem; margin-bottom:.35rem; background:#151a27; }
.slot .rn { width:3.6rem; font-weight:900; text-align:center; border-radius:.5rem; padding:.2rem 0; }
.slot.atk .rn { background:var(--atk); } .slot.def .rn { background:var(--def); } .slot.mov .rn { background:var(--mov); }
.slot.free .rn { background:var(--luck); color:#1b1f2a; } .slot.free.locked { opacity:.75; } .slot.free.locked .ptile.empty { width:auto; padding:0 .6rem; font-size:.85rem; }
.slot.free.fx-new { box-shadow:0 0 0 3px var(--luck); }
.nw { white-space:nowrap; } /* かっこの 中で 行を わけない */
.slot .fh { font-size:.85rem; font-weight:800; color:#ffe9a0; }
.fx-open { display:inline-block; margin:.2rem 0; padding:.15rem .7rem; border-radius:.6rem; background:var(--luck); color:#1b1f2a; font-weight:900; }
.owned { display:flex; gap:.3rem; flex-wrap:wrap; flex:1; }
.owned .ptile { cursor:pointer; opacity:.55; }
.owned .ptile.eq { opacity:1; box-shadow:0 0 0 3px #fff inset; }
.owned .ptile.eq.fx-free { border-color:var(--luck); box-shadow:0 0 0 3px var(--luck) inset, 0 0 0 3px var(--luck); } /* じゆうの 枠に ついて いる パーツ（白で なく 黄色） */
.owned .ptile.fx-hint { animation: fxhint 1s infinite alternate; opacity:1; }
@keyframes fxhint { from { box-shadow:0 0 0 0 #ffe066; } to { box-shadow:0 0 14px 5px #ffe066; } }
.pname { font-size:.8rem; white-space:nowrap; letter-spacing:-.06em; position:absolute; bottom:-.05rem; left:0; right:0; text-align:center; font-weight:800; color:#fff; text-shadow:0 0 3px #000, 0 0 3px #000; line-height:1; }
.actions { display:flex; gap:.6rem; justify-content:center; margin-top:.6rem; flex-wrap:wrap; }
/* 戦い */
.bw { display:grid; grid-template-columns: 15.5rem 1fr 15.5rem; gap:.8rem; align-items:start; }
.hpbar { height:1.1rem; background:#3a2530; border-radius:.5rem; overflow:hidden; border:2px solid #000; margin-top:.2rem; }
.hpbar i { display:block; height:100%; background:linear-gradient(#7ee787,#3fa94b); transition: width .25s; }
.hpnum { font-weight:900; font-size:1.2rem; text-align:right; white-space:nowrap; }
.hpnum .chgmark { display:inline-block; margin-right:.5rem; padding:0 .4rem; border-radius:.4rem; font-size:1rem; color:#1b1b1b; background:#e5534b; }
.hpnum .chgmark:empty { display:none; }
.hpnum .chgmark.fx-chgnow { background:#ffe066; animation: fxchg .5s 2 alternate; }
@keyframes fxchg { from { transform:scale(1); } to { transform:scale(1.15); } }
.stage2 { position:relative; height: 14rem; background:#1a2030; border-radius:1rem; overflow:hidden; }
.stage2 .mp, .stage2 .ep { position:absolute; bottom:.6rem; height:9.5rem; transition: transform .15s; }
.stage2 .mp { left:8%; } .stage2 .ep { right:8%; }
.stage2 svg { height:100%; }
.fx-hitme { transform: translateX(-10px); } .fx-hitthem { transform: translateX(10px); }
.pop { position:absolute; left:0; right:0; top:.2rem; z-index:2; text-align:center; font-size:2.2rem; font-weight:900; pointer-events:none; text-shadow:0 0 8px #000; }
.pop.crit { color:#ffe066; } .pop.dodge { color:#9fd8ff; }
.dmg { position:absolute; font-weight:900; font-size:1.8rem; text-shadow:0 0 6px #000; pointer-events:none; animation: fxfloat 1.3s ease-out forwards; }
@keyframes fxfloat { from { transform: translateY(0); opacity:1; } to { transform: translateY(-2.5rem); opacity:0; } }
.logw { background:#10131d; border-radius:.8rem; height: 12.5rem; overflow-y:auto; padding:.3rem .5rem; margin-top:.5rem; font-size:.9rem; }
.logw.fx-short { height: 4.5rem; } /* ひらめいた 結果は 上が 長い（1366×650 で ページの スクロール 0） */
.logw div { padding:.08rem 0; border-bottom:1px solid #1d2232; }
.logw .p { color:#a9f0c6; } .logw .e { color:#ffb7a8; } .logw .s { color:#ffe066; }
.logw .kwline { cursor:help; text-decoration: underline dotted; }
.handn { position:absolute; right:.5rem; bottom:.4rem; font-weight:900; color:var(--dim); font-size:.95rem; }
.logw .hl { color:var(--dim); font-size:.9rem; border-bottom:none; }
.slot .hx { font-size:.8rem; font-weight:900; color:#ffe066; }
.speed { position:absolute; left:50%; transform:translateX(-50%); bottom:.4rem; font-size:.85rem; padding:.25rem .6rem; }
/* 結果 */
.resw { max-width: 40rem; margin: 0 auto; text-align:center; }
.reason { background:#2a1f2a; border:3px solid #ff8fab; border-radius:1rem; padding:1rem; margin:.6rem auto; }
.reason .rt { font-size:1.45rem; font-weight:900; }
.reason .rh { margin-top:.5rem; font-size:1.1rem; color:#ffe066; font-weight:800; }
.cmp { display:flex; justify-content:center; gap:1.4rem; margin-top:.5rem; font-weight:900; }
.lvl { display:inline-grid; grid-template-columns: auto auto; gap:.2rem 1rem; text-align:left; font-size:1.2rem; font-weight:900; margin:.5rem auto; }
@media (min-width: 701px) { .lvl { grid-template-columns: auto auto auto auto; } } /* PC は 2つずつ 横に（ひらめきの 行が ふえた ぶん。1366×650 で ページの スクロール 0） */
.lvl .fx-up { color:#7ee787; opacity:0; animation: fxin .3s forwards; }
@keyframes fxin { to { opacity:1; } }
#titlePic svg { height:100%; }
#log2 { height: 6.5rem; }
.howto { display:grid; grid-template-columns:repeat(2, auto); justify-content:center; gap:.25rem 1.4rem; margin:0 auto .7rem; }
.howto span { font-weight:800; font-size:1rem; text-align:left; } /* わくを つけない（ボタンに 見えない ように） */
@media (max-width: 520px) { .howto { grid-template-columns:auto; gap:.15rem; } }
.hall { max-width: 40rem; margin:.6rem auto; text-align:left; font-size:.9rem; color:var(--dim); }
@media (max-width: 700px) {
  .spgrid { grid-template-columns: repeat(2, 1fr); }
  .card { width: 100%; }
  .forkw { flex-direction:column; align-items:stretch; }
  .road .card { width:100%; }
  .vs { display:none; }
  .slots { width:100%; }
  .bw { grid-template-columns: 1fr 1fr; }
  .bw .mid { grid-column: 1 / 3; grid-row: 1; }
  .stage2 { height: 10rem; } .stage2 .mp, .stage2 .ep { height:7rem; }
  .card .pic { height:4.5rem; }
  .logw { height: 9rem; }
  .bw .card .ptiles .ptile { width:2.8rem; height:2.8rem; flex:none; } .bw .card .ptiles .ptile svg { width:2.2rem; height:2.2rem; }
  .bw > * { min-width:0; } .bw .card .nm { flex-wrap:wrap; } /* ながい 名前＋「てごわい」で カードが ひろがって 横に はみ出さない（「てごわい」は つぎの 行へ） */
  .bw .card .stat b { font-size:1rem; }
  .kotgrid { grid-template-columns: 1fr; }
  body[data-scr="battle"] #tip:not(.tipon) { display:none; } /* スマホの 戦いは 下の 帯が 自分の 体力に かぶる → タップした ときだけ 出す */
  body[data-scr="battle"] #tip.tipon { top:0; bottom:auto; border-top:0; border-bottom:2px solid #3a4256; } /* 出す ときは 上に（体力を かくさない） */
  body.tipup[data-scr="battle"] .pop { top:2.2rem; } /* 上の 帯が 出て いる あいだは「かいしん！」を 少し 下へ */
  .kw.knew { white-space:normal; border-radius:.7rem; } .kw .kwn { display:block; margin-left:0; }
}
</style>
</head>
<body data-scr="title">
<div id="title" class="screen on center">
  <h1>でこもん</h1>
  <div class="sub" style="color:var(--dim);font-weight:800">つくりなおしの 版（ためしに あそぶ ところ）</div>
  <div id="titlePic" style="height:9rem;margin:.6rem 0;display:flex;justify-content:center"></div>
  <div class="howto" id="howto"></div>
  <div class="actions"><button class="big" id="bStart">▶ はじめる</button><button class="big" id="bCont" style="display:none">つづきから</button><button class="btn" data-kotoba="1">📖 ことば</button></div>
  <div class="eggnote" id="eggNote"></div>
  <div class="hall" id="hall"></div>
</div>
<div id="species" class="screen">
  <h2 class="center">どの 子と いっしょに のぼる？</h2>
  <div id="eggbar"></div>
  <div class="spgrid" id="spgrid"></div>
</div>
<div id="fork" class="screen">
  <div class="top"><span class="hearts" id="fHearts"></span><span class="stage" id="fStage"></span><span class="dots" id="fDots"></span><button class="btn kbtn" data-kotoba="1">📖 ことば</button></div>
  <h2 class="center" id="fTitle">どっちの 道に いく？</h2>
  <div class="forkw" id="forkw"></div>
</div>
<div id="prep" class="screen">
  <div class="top"><span class="hearts" id="pHearts"></span><span class="stage" id="pStage"></span><span class="dots" id="pDots"></span><button class="btn kbtn" data-kotoba="1">📖 ことば</button></div>
  <div class="prepw">
    <div class="card me" id="pMe"></div>
    <div class="slots" id="slots"></div>
    <div id="pFoe"></div>
  </div>
  <div class="actions"><button class="btn" id="bBack">◀ 道を えらびなおす</button><button class="btn" id="bHint" style="display:none">💡 ヒント</button><button class="big" id="bFight">たたかう！</button></div>
</div>
<div id="battle" class="screen">
  <div class="top"><span class="hearts" id="bHearts"></span><span class="stage" id="bStage"></span><button class="btn kbtn" data-kotoba="1">📖 ことば</button></div>
  <div class="bw">
    <div id="bMe"></div>
    <div class="mid">
      <div class="stage2" id="arena"><div class="mp" id="aMe"></div><div class="ep" id="aFoe"></div><div class="pop" id="pop"></div><div class="handn" id="handN"></div><button class="btn speed" id="bSkip">はやく ▶▶</button></div>
      <div class="logw" id="log"></div>
    </div>
    <div id="bFoe"></div>
  </div>
</div>
<div id="result" class="screen"><div class="resw" id="resw"></div></div>
<div id="egg" class="screen"><div class="eggw" id="eggw"></div></div>
<div id="kotoba"><div class="kotw">
  <div class="kothead"><h2 style="margin:0">📖 ことば</h2><span class="sub">カードの まるい ことばの いみ。はじめての ことばは、カードにも ひとことが でるよ（その ことばに 3かい たたかいで あうと きえる）。</span><button class="btn" id="bKotobaX" style="margin-left:auto">✕ とじる</button></div>
  <div class="kotleg" id="kotLeg"></div>
  <div class="kotgrid" id="kotGrid"></div>
</div></div>
<div id="tip">カードの <b>ことば</b>（キーワード）や パーツに 合わせる・タップすると、ここに せつめいが でるよ。</div>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var S = window.DekoRe, C = S.CFG;
  var Q = new URLSearchParams(location.search);
  var AUTO = Q.get('auto') === '1', SPEED = parseFloat(Q.get('speed') || '1') || 1;
  var KEY = 'remake.';
  function lsGet(k, d) { try { var v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
  if (Q.get('reset') === '1') { try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(KEY) === 0) localStorage.removeItem(k); }); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  function setTipOn(on) { $('tip').classList.toggle('tipon', on); document.body.classList.toggle('tipup', on); }

          delay = 300; break;
        case 'waza': addLog(cls, nm + 'の わざ「' + WZ[e.w].name + '」！'); glow(who, '[data-waza="' + e.w + '"]'); popText(WZ[e.w].name + '！', 'crit'); delay = 450; break;
        case 'hand': chgMark(e.who === 'p' ? 'e' : 'p', 'off'); chgMark(e.who, e.n); if (e.who === 'p') { $('handN').textContent = e.n + '手め'; addLog('hl', '― ' + me + 'の ' + e.n + '手め ―'); } delay = 60; break;
        case 'end': chgMark('p', -1); chgMark('e', -1); addLog('s', e.win ? 'かった！' : (e.timeout ? '時間ぎれ… ' : '') + 'まけた…'); popText(e.win ? 'かった！' : 'まけた…', e.win ? 'crit' : 'dodge'); delay = 400; break;
      }
      setTimeout(step, fast ? 0 : delay / SPEED);
    }
    step();
  }

  // ---------- 結果 ----------
  // なれの ●○（勝って ひらめかなかった とき・まだ 続く 負けの とき）。いっぱいの ときは「つぎに かつと ひらめく」
  function nareHtml(run, equip) {
    if (!S.CFG.hira.on) return '';
    var nk = []; S.equipList(equip || {}).forEach(function (pid) { S.PART_BY_ID[pid].kw.forEach(function (k) { var lw = S.LEARN_BY_KW[k]; if (lw && nk.indexOf(k) < 0 && (run.learned || []).indexOf(lw.id) < 0) nk.push(k); }); });
    if (!nk.length) return '';
    var full = nk.some(function (k) { return ((run.nare || {})[k] || 0) >= S.CFG.hira.nareMax; });
    return '<div class="nare" style="margin-top:.4rem"><span>✨ なれ</span>' + nk.map(function (k) { var n = (run.nare || {})[k] || 0; return '<span>' + S.KW_BY_ID[k].name + ' <span class="dots">' + '●'.repeat(n) + '○'.repeat(Math.max(0, S.CFG.hira.nareMax - n)) + '</span></span>'; }).join('') + '</div><div class="sub" style="color:var(--dim)">' + (full ? '●が いっぱい！ つぎに かつと かならず ひらめく' : '●が いっぱいに なると、かったとき かならず ひらめく') + '</div>';
  }
  function drawResult(out, before) {
    var run = G.run, h = '', d = S.enemyDef(out.road.idx);
    if (out.win) {
      h += '<h1>' + (out.clear ? 'ぬしを たおした！ クリア！' : 'かった！') + '</h1>';
      if (out.freeOpened) h += '<div class="fx-open">🔓 じゆうの わくが ひらいた！ つぎから パーツを 4つ</div>';
      if (out.reward && out.reward.length) h += '<h2>あたらしい パーツ</h2><div class="ptiles" style="justify-content:center">' + out.reward.map(function (p) { return ptile(p); }).join('') + '</div><div class="sub" style="color:var(--dim)">' + out.reward.map(function (p) { var pp = S.PART_BY_ID[p]; return pp.name + '（' + pp.kw.map(function (k) { return S.KW_BY_ID[k].name; }).join('・') + '）'; }).join('、') + '</div>';
      if (out.hira) { var hw = S.WAZA_BY_ID[out.hira]; h += '<h2 class="hira">✨ ひらめいた！「' + hw.name + '」を おぼえた</h2><div class="sub">' + hw.text + '（' + hw.kw.map(function (x) { return S.KW_BY_ID[x].name; }).join('か ') + 'の パーツを つけると つかえる）</div>'; }
      else if (!out.oya) h += nareHtml(run, before.equip); // なじんだ ときは ひらめきと 同じく なれの 行は 出さない（せまい 画面で 入りきらない）
      if (out.oya) { var ow = S.WAZA_BY_ID[out.oya]; h += '<h2 class="hira">🥚 うけついだ「' + ow.name + '」で そだった！</h2>'; } // 継いだ 技を つかって はじめて 勝った（1回だけ）
      if (out.level) h += (out.hira || out.oya ? '' : '<h2>レベルアップ！</h2>') + '<div class="lvl">' + S.STATS.map(function (s, i) { var u = out.level[s.id]; return '<span>' + STAT_LABEL[s.id] + ' ' + (before.stats[s.id]) + (u ? ' → ' + run.stats[s.id] : '') + '</span><span class="fx-up" style="animation-delay:' + (0.25 * i / SPEED) + 's">' + (u ? '↑ +' + u : '') + '</span>'; }).join('') + '</div>';
      h += '<div class="actions"><button class="big" id="bNext">' + (out.clear ? 'おわり' : 'つぎの 道へ ▶') + '</button></div>';
    } else {
      var r = out.reason;
      h += '<div class="hearts" style="font-size:2rem">' + hearts(run.hearts) + '</div><h1>まけた…</h1>';
      if (out.over) h += '<div class="sub" id="overNote" style="font-weight:800">ハートが なくなった。この ぼうけんは ここまで' + (run.wins ? '（' + run.wins + 'しょう）' : '。つぎは 1しょう めざそう！') + '</div>'; // 最後の 負けは「もう一度」を すすめない。0しょうは 数を 出さず 次の めあてを（確認役の 好み：子どもに つらい）（つぎの ぼうけんへ）
      h += '<div class="reason"><div class="rt">' + r.text + '</div>';
      if (r.id === 'power') { var ps = out.res.pSt, es = out.res.eSt; h += '<div class="cmp"><span>じぶん ♥' + ps.hp + ' ⚔' + ps.atk + ' 🛡' + ps.def + ' 💨' + ps.spd + '</span><span>' + d.name + ' ♥' + es.hp + ' ⚔' + es.atk + ' 🛡' + es.def + ' 💨' + es.spd + '</span></div>'; }
      if (r.kw) h += '<div style="margin-top:.4rem">' + kwBadge(r.kw) + '</div>';
      h += '<div class="rh">' + (out.over ? 'つぎの ぼうけんで ' + r.hope.replace('もう片方の 道や、', '').replace('もう一度', 'また') : r.hope) + '</div></div>';
      if (!out.over) h += nareHtml(run, before.equip); // 負けても なれは たまる（原則 2）
      if (out.over) h += '<div class="actions"><button class="big" id="bNext">おわり</button></div>';
      else {
        h += '<div class="actions"><button class="big" id="bAgain">もう一度（おなじ 道）</button>' + (run.fork.roads.length > 1 ? '<button class="btn" id="bOther">もう片方の 道へ</button>' : '') + '</div>';
        if (run.lossStreak >= 2) h += '<div class="sub" style="color:#ffe066;font-weight:800;margin-top:.4rem">💡 じゅんびの 画面に「ヒント」が でたよ</div>';
      }
    }
    h += '<div class="sub" style="color:var(--dim);margin-top:.6rem">たたかいの きろく（' + out.res.events.filter(function (e) { return e.t === 'hit'; }).length + 'かいの こうげき）は ▼</div><div class="logw' + (out.hira || out.oya || !out.win || out.freeOpened ? ' fx-short' : '') + '" id="log2" style="text-align:left">' + $('log').innerHTML + '</div>';
    $('resw').innerHTML = h;
    show('result');
    if ($('bNext')) $('bNext').onclick = function () { setLast(null); if (out.freeOpened) G.freeNew = true; if (run.over) endRun(); else drawFork(); };
    if ($('bAgain')) $('bAgain').onclick = function () { setLast(null); drawPrep(); };
    if ($('bOther')) $('bOther').onclick = function () { setLast(null); G.road = 1 - G.road; G.hint = null; drawPrep(); };
    if (AUTO) autoNext();
  }
  // たまご：周回の おわりに 覚えた 技を 1つ えらんで 次の 子へ（設計書「子に継げる技は1つ」）
  function drawEgg() {
    var run = G.run, ch = S.eggChoices(run), old = eggNow();
    var h = '<h1>🥚 たまごを のこそう</h1><div class="sub" style="font-weight:800">' + (run.name || '') + 'が おぼえた わざを 1つ、つぎの 子に つたえられる。<br>どの 子を えらんでも、その わざを おぼえて うまれるよ。<br>つよさは つたわらないけど、その わざの パーツを つけて はじめて かつと そだつ</div>';
    h += '<div class="eggpick">' + ch.map(function (id) { var w = S.WAZA_BY_ID[id]; return '<button data-egg="' + id + '" data-waza="' + id + '"><b>' + ((run.inherit && run.inherit.waza === id) ? '🥚' : '✨') + w.name + '</b><span class="sub">' + w.text + '</span><span class="sub">' + w.kw.map(function (x) { return S.KW_BY_ID[x].name; }).join('・') + 'の パーツで</span></button>'; }).join('') + '</div>';
    if (old) h += '<div class="sub" style="color:var(--dim)">いまの たまご（' + old.parent + 'の「' + S.WAZA_BY_ID[old.waza].name + '」）は、あたらしい たまごと いれかわる</div>';
    h += '<div class="actions"><button class="btn" id="bNoEgg">のこさない</button></div>';
    $('eggw').innerHTML = h;
    show('egg');
    Array.prototype.forEach.call($('eggw').querySelectorAll('[data-egg]'), function (el) { el.onclick = function () { pickEgg(el.getAttribute('data-egg')); }; });
    $('bNoEgg').onclick = function () { pickEgg(null); };
    if (AUTO) setTimeout(function () { var b = $('eggw').querySelector('[data-egg]'); if (b) b.click(); }, 150 / SPEED);
  }
  function pickEgg(id) {
    var run = G.run; if (!eggPending(run)) return; // おわって いない 周回では 何も しない（自動モードの 二重の クリック など）
    var egg = id ? S.makeEgg(run, id) : null;
    if (egg) {
      lsSet('egg', egg);
      var hall = lsGet('hall', []); hall.forEach(function (x) { if (x.at === run.hallAt) x.egg = id; }); lsSet('hall', hall);
    }
    run.eggDone = true; save();
    endRun();
  }
  function endRun() {
    var run = G.run;
    if (!run.hallDone) { recordHall(run); run.hallDone = true; save(); }
    if (eggPending(run)) { drawEgg(); return; }
    if (AUTO) console.log('[でこもん auto] 周回 おわり：' + run.species + ' ' + run.wins + 'しょう' + (run.clear ? ' クリア' : '') + ' ハート ' + run.hearts);
    G.run = null; lsSet('run', null); setLast(null);
    drawTitle();
    if (AUTO) setTimeout(function () { $('bStart').click(); setTimeout(function () { var sps = S.SPECIES; drawSpecies(); startRun(sps[(lsGet('hall', []).length) % sps.length].id); autoNext(); }, 50); }, 200);
  }
  // 自動モード（?auto=1。必ず 無音＝この 版は まだ 音が ない）
  function autoNext() {
    setTimeout(function () {
      var on = document.querySelector('.screen.on').id;
      if (on === 'fork') { G.road = 0; drawPrep(); autoNext(); }
      else if (on === 'prep') { startBattle(); }
      else if (on === 'result') { var b = $('bNext') || $('bAgain'); if (b) { b.click(); autoNext(); } }
    }, 150 / SPEED);
  }

  $('bStart').onclick = function () { if (eggPending(G.run)) { drawEgg(); return; } drawSpecies(); }; // たまごを まだ えらんで いない 周回は 先に えらぶ（だまって 消さない）
  $('bCont').onclick = function () { if (!G.run) return; var L = G.last; if (!L && eggPending(G.run)) { drawEgg(); return; } if (L) { G.road = L.road; G.hint = null; showBattle(L.out, L.before, L.equip, L.road, false); } else drawFork(); }; // 見て いる とちゅうで とじた 戦いは はじめから もう一度 見せる
  window.__re = { G: G, S: S, KW_SHORT: KW_SHORT };
  drawTitle();
  if (AUTO) { if (eggPending(G.run)) drawEgg(); else { $('bStart').click(); startRun(S.SPECIES[0].id); autoNext(); } } // たまごが まだなら 先に えらぶ（drawEgg が 次の 周回へ すすめる）
})();
</script>
</body>
