<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たたみやま</title>
<style>
  :root {
    --ink: #3a2e22; --sub: #705e4c; --paper: #fff8ec; --line: #d8c7ad;
    --safe: #3f9d5f; --luck: #d9962e; --bad: #d44a3f; --accent: #3f6fb5; --glow: #ffd54a;
    --wood: #b98a57; --wood-d: #8a6238; --wall: #efe4cf; --tatami: #c9c58f;
    --fs: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2118; color: var(--ink); font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif; font-size: var(--fs); line-height: 1.35; }
  button { font: inherit; color: inherit; cursor: pointer; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 6px 12px; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, .bitem:focus-visible, .slot:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }
  .hidden { display: none !important; }
  #defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ---------- 場面（全画面。1つだけ表示） ---------- */
  .scr { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
  .scr.on { display: flex; animation: fx-scrin calc(.35s / var(--spd, 1)) ease-out; }
  @keyframes fx-scrin { from { opacity: 0; } to { opacity: 1; } }
  .bar-top { height: 54px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: rgba(58, 46, 34, .86); color: #fbf3e4; backdrop-filter: blur(2px); }
  .bar-top .ttl { font-weight: 700; font-size: 20px; letter-spacing: .06em; }
  .bar-top .day { font-size: 21px; font-weight: 700; }
  .bar-top .sub { font-size: 16px; opacity: .85; }
  .bar-top .sp { flex: 1; }
  .bar-top > * { white-space: nowrap; }
  .seg { display: flex; border: 2px solid rgba(255,255,255,.35); border-radius: 12px; overflow: hidden; font-size: 15px; }
  .seg button { border: 0; border-radius: 0; padding: 3px 10px; background: transparent; color: #fbf3e4; }
  .seg button.on { background: #fbf3e4; color: var(--ink); }
  #volBox { display: flex; align-items: center; gap: 6px; font-size: 15px; }
  #vol { width: 90px; }
  .guide { display: inline-block; background: var(--accent); color: #fff; font-size: 15px; padding: 1px 10px; border-radius: 10px; animation: fx-guide 1.2s ease-in-out infinite; }
  @keyframes fx-guide { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .panel-title { font-size: 18px; font-weight: 700; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.7); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel-title > * { white-space: nowrap; }

  /* ---------- たたむ・つむ の場面（部屋） ---------- */
  #scr-stack { background: linear-gradient(#f3e9d6 0, #e9dcc4 58%, transparent 58%), url(#none); }
  /* 1日の始まり：朝の光が さっと 差す */
  #scr-stack.fx-dawn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(255,214,140,.6), rgba(255,246,214,0) 65%); animation: fx-dawn calc(1.4s / var(--spd, 1)) ease-out forwards; pointer-events: none; z-index: 5; }
  @keyframes fx-dawn { from { opacity: 1; } to { opacity: 0; } }
  #scr-stack .room { flex: 1; min-height: 0; position: relative; display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; gap: 14px; padding: 12px 16px 14px; }
  #scr-stack .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; z-index: 0; }
  #scr-stack .floor svg { width: 100%; height: 100%; }
  #scr-stack .wall { position: absolute; left: 0; right: 0; top: 0; height: 54%; z-index: 0; pointer-events: none; }
  #scr-stack .wall svg { width: 100%; height: 100%; }
  #scr-stack .room::before { content: ""; position: absolute; left: 36%; top: 0; width: 30%; height: 54%; background: radial-gradient(ellipse at 50% 20%, rgba(255,246,214,.75), rgba(255,246,214,0) 70%); pointer-events: none; z-index: 0; }
  #scr-stack .room > * { position: relative; z-index: 1; min-height: 0; }
  #scr-stack .room > .floor, #scr-stack .room > .win, #scr-stack .room > .wall { position: absolute; z-index: 0; }
  /* かご */
  #basketBox { display: flex; flex-direction: column; min-height: 0; }
  #basketArt { position: relative; flex: 1; min-height: 0; }
  #basketArt > svg.bk { position: absolute; inset: 0; width: 100%; height: 100%; }
  #basket { position: absolute; left: 11%; right: 11%; top: 6%; bottom: 28%; display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; align-content: start; overflow-y: auto; padding: 4px; }
  .bitem { border: 2px solid rgba(90, 60, 30, .35); border-radius: 10px; background: rgba(255, 250, 240, .92); padding: 4px 2px 2px; text-align: center; cursor: pointer; position: relative; box-shadow: 0 2px 3px rgba(0,0,0,.25); }
  .bitem svg { width: 100%; height: 34px; }
  .bitem .nm { font-size: 14px; line-height: 1.2; }
  .bitem.sel { border-color: var(--accent); box-shadow: 0 0 0 3px #3f6fb566, 0 2px 3px rgba(0,0,0,.25); }
  .bitem.folded { background: #eef4ff; }
  .bitem .fdg { position: absolute; left: 4px; top: 2px; font-size: 14px; font-weight: 700; color: var(--sub); }
  /* 山（畳） */
  #stacksBox { display: flex; flex-direction: column; min-height: 0; }
  #stackUI { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  #stacks { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 14px; align-items: end; padding: 4px 2px 0; }
  .slot { max-height: min(100%, 520px); height: 100%; }
  .slot { display: flex; flex-direction: column; align-items: center; border-radius: 12px; padding: 6px 3px 8px; cursor: pointer; min-height: 0; position: relative; }
  /* 置ける山：畳が青く光り、名札が青くなる（床に光だまり） */
  .slot.can .mat { animation: fx-matglow calc(1.2s / var(--spd, 1)) ease-in-out infinite; }
  .slot.can .mat::before { background: rgba(63,111,181,.55); }
  .slot.can:hover .mat { animation: none; filter: drop-shadow(0 0 8px #3f6fb5) drop-shadow(0 0 3px #3f6fb5); }
  .slot.can .sname { border-color: #2b4f86; background: linear-gradient(#5b86c9, #3f6fb5); box-shadow: 0 0 0 3px #3f6fb566, 0 3px 5px rgba(0,0,0,.35); }
  @keyframes fx-matglow { 0%, 100% { filter: drop-shadow(0 0 3px #3f6fb5) drop-shadow(0 0 1px #3f6fb5); } 50% { filter: drop-shadow(0 0 9px #3f6fb5) drop-shadow(0 0 3px #3f6fb5); } }
  .slot.away { opacity: .4; }
  /* 名札（木の札） */
  .slot .sname { font-size: 15px; color: #fbf3e4; font-weight: 700; white-space: nowrap; position: relative; background: linear-gradient(#9a6f42, #7a5431); border: 2px solid #4a2e14; border-radius: 7px; padding: 2px 16px; box-shadow: 0 3px 5px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3); text-shadow: 0 1px 1px rgba(0,0,0,.45); }
  .slot .sname::before, .slot .sname::after { content: ""; position: absolute; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: #2b2118; box-shadow: inset 0 1px 0 rgba(255,255,255,.45); }
  .slot .sname::before { left: 5px; } .slot .sname::after { right: 5px; }
  .slot .sname { margin-top: 15px; }
  .slot .bar { margin-top: 4px; }
  /* 壁の窓 */
  #scr-stack .win { position: absolute; left: 40%; top: 9%; width: 20%; max-width: 280px; z-index: 0; pointer-events: none; }
  #scr-stack .win svg { width: 100%; height: auto; }
  /* 床に敷いた畳（奥行きのある台形。山は この上に立つ） */
  .stackbox .mat { position: absolute; left: 0; right: 0; bottom: -12px; height: 30px; pointer-events: none; }
  .stackbox .mat::before { content: ""; position: absolute; left: 3%; right: 3%; bottom: -3px; height: 12px; border-radius: 50%; background: rgba(0,0,0,.42); filter: blur(5px); }
  .stackbox .mat::after { content: ""; position: absolute; inset: 0; clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); background: linear-gradient(#2f3d2e 0 12%, rgba(255,255,255,.3) 12% 14%, transparent 14% 84%, rgba(0,0,0,.28) 84% 86%, #2f3d2e 86%), repeating-linear-gradient(0deg, rgba(120,116,70,.5) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, rgba(120,116,70,.22) 0 1px, transparent 1px 7px), linear-gradient(#c4c08a, #dedaa6); }
  .stackbox { position: relative; width: 100%; flex: 1; min-height: 0; }
  .stackbox svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .gnum { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); min-width: 1.5em; height: 1.35em; line-height: 1.2em; text-align: center; font-weight: 700; font-size: clamp(14px, 1.3vw, 20px); border-radius: 1em; background: #fff; border: 2px solid var(--line); padding: 0 .25em; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .gnum.z { color: var(--safe); border-color: var(--safe); }
  .gnum.chg { background: var(--glow); border-color: #c9a000; }
  .gnum.chg.up { background: #ffd0cc; border-color: var(--bad); }
  .gnum.gdot { min-width: 0; width: 12px; height: 12px; padding: 0; border-color: var(--safe); background: var(--safe); font-size: 0; }
  .layer.fx-give path, .layer.fx-give rect, .layer.fx-give ellipse, .layer.fx-give circle { filter: drop-shadow(0 0 4px #ffb300); }
  .layer.fx-take { animation: fx-pulse calc(.9s / var(--spd, 1)) ease-in-out 2; }
  .layer.fx-hot path, .layer.fx-hot rect, .layer.fx-hot ellipse, .layer.fx-hot circle { filter: drop-shadow(0 0 5px #ff3b30) drop-shadow(0 0 2px #ff3b30); }
  @keyframes fx-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  .layer.fx-drop { animation: fx-dropdown calc(.8s / var(--spd, 1)) ease-in forwards; }
  .layer.fx-drop.alt { animation-name: fx-dropdown2; }
  @keyframes fx-dropdown2 { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 30% { transform: translate(-10px, 36px) rotate(16deg); opacity: 1; } 60% { transform: translate(-30px, 124px) rotate(-24deg); opacity: .95; } 100% { transform: translate(-52px, 270px) rotate(-58deg); opacity: 0; } }
  @keyframes fx-dropdown { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 30% { transform: translate(14px, 40px) rotate(-18deg); opacity: 1; } 60% { transform: translate(28px, 130px) rotate(28deg); opacity: .95; } 100% { transform: translate(44px, 270px) rotate(62deg); opacity: 0; } }
  /* 歩いている間：人が上下に揺れ、山も少し遅れて揺れる */
  #carrier.walking .person { animation: fx-walk calc(.5s / var(--spd, 1)) ease-in-out infinite; }
  #carrier.walking .cst { animation: fx-sway calc(.5s / var(--spd, 1)) ease-in-out infinite; }
  .cat-tail { transform-box: fill-box; transform-origin: 100% 100%; animation: fx-tail 3s ease-in-out infinite; }
  @keyframes fx-tail { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
  .cat-eye-open { animation: fx-blink 5s steps(1) infinite; }
  @keyframes fx-blink { 0%, 93% { opacity: 0; } 94%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
  @keyframes fx-walk { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
  @keyframes fx-sway { 0%, 100% { margin-left: 0; } 50% { margin-left: 3px; } }
  .layer.fx-pat { animation: fx-pat calc(.35s / var(--spd, 1)) ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
  .bitem svg.fx-pat { animation: fx-pat calc(.35s / var(--spd, 1)) ease-out; transform-origin: 50% 100%; }
  @keyframes fx-pat { 0% { transform: scaleY(1.8) translateY(0); } 60% { transform: scaleY(.85); } 100% { transform: scaleY(1); } }
  .bar { width: 100%; margin-top: 4px; }
  .bar .cells { position: relative; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 14px; }
  .bar .cell { background: rgba(255,255,255,.55); border-radius: 3px; }
  .bar .cell.g { background: var(--safe); }
  .bar .cell.g.luck { background: var(--luck); }
  .bar .cell.s { background: #6d5a46; }
  .bar .cell.over { background: var(--bad); }
  .bar .line4 { position: absolute; left: 40%; top: -4px; bottom: -4px; width: 3px; background: #2b2118; border-radius: 2px; }
  .bar .txt { display: flex; flex-wrap: wrap; justify-content: center; font-size: 15px; margin-top: 3px; gap: 1px 6px; line-height: 1.25; color: #3a3417; }
  .bar .txt span { white-space: nowrap; }
  .bar .txt .tot { font-weight: 700; }
  .bar .txt .judge { color: #246b3d; font-weight: 700; }
  .bar .txt .judge.luck { color: #8a5a00; }
  .bar .txt .judge.bad { color: var(--bad); }
  /* たたみ方の台 */
  #foldBox { display: flex; flex-direction: column; min-height: 0; gap: 8px; }
  #foldTray { background: linear-gradient(#d9b57f, #c39a63); border: 3px solid #8a6238; border-radius: 14px; padding: 10px; box-shadow: 0 4px 8px rgba(0,0,0,.3); }
  #folds { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .fbtn { display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 6px 8px; text-align: left; min-height: 0; background: var(--paper); box-shadow: 0 2px 3px rgba(0,0,0,.25); }
  .fbtn svg { width: 100%; height: 48px; }
  .fbtn .fn { font-weight: 700; font-size: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 6px; }
  .fbtn .fn > span { white-space: nowrap; }
  .fbtn .fn .g { color: var(--sub); font-size: 15px; font-weight: 400; }
  .fbtn .ft { font-size: 15px; color: var(--sub); min-height: 2.6em; }
  .fbtn.sel { border-color: var(--accent); box-shadow: 0 0 0 3px #3f6fb566, 0 2px 3px rgba(0,0,0,.25); }
  #foldHint { font-size: 15px; color: #4a3a28; margin-top: 6px; }
  #foldBox .who { color: var(--accent); }
  /* はこぶ の戸 */
  #carryBtnRow { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #carryBtn { width: 100%; font-size: 22px; font-weight: 700; padding: 12px 10px; background: linear-gradient(#5b86c9, #3f6fb5); color: #fff; border-color: #2b4f86; border-radius: 14px; box-shadow: 0 4px 8px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; gap: 10px; }
  #carryBtn:disabled { background: #9aa6b8; border-color: #8a94a3; box-shadow: none; }
  #carryBtn svg { width: 36px; height: 36px; }
  #carryNote { font-size: 15px; color: #4a3a28; text-align: center; }

  /* ---------- はこぶ の場面（廊下） ---------- */
  #scr-carry { background: #2b2118; }
  #hall { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #hall .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stations { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; }
  .st { position: absolute; bottom: 14%; width: 16%; transform: translateX(-50%); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .st .art { width: 100%; height: 150px; display: flex; align-items: flex-end; justify-content: center; }
  .st .art svg { width: 100%; height: 100%; overflow: visible; }
  .st .lbl { white-space: nowrap; background: rgba(58,46,34,.8); color: #fbf3e4; font-size: 16px; padding: 2px 10px; border-radius: 10px; }
  .st.now .lbl { background: #fbf3e4; color: var(--ink); font-weight: 700; }
  #carrier { position: absolute; left: 2%; bottom: 23%; width: 22%; transition: left calc(1.4s / var(--spd, 1)) linear; display: flex; flex-direction: column; align-items: center; }
  #carrier .cst { position: relative; width: 100%; height: 240px; transform-origin: 50% 100%; transition: transform calc(.5s / var(--spd, 1)) ease; }
  #carrier .cst svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* とどいた：引き出しが手前に出て、山が しまわれる */
  .drawer-top { transform-box: fill-box; transform-origin: 50% 50%; transition: transform calc(.3s / var(--spd, 1)) ease-out; }
  .drawer-top.open { transform: translateY(6%) scale(1.08); }
  #carrier .cst.fx-into { animation: fx-into calc(.7s / var(--spd, 1)) ease-in forwards; }
  @keyframes fx-into { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(55%) scale(.2); opacity: 0; } }
  #carrier .person { width: 70%; height: 112px; margin-top: -6px; }
  #carrier .person .leg { transform-box: fill-box; transform-origin: 50% 0; }
  /* 顔：ふだん／はらはら（ゆれが大きい）／びっくり（おちる）／にっこり（とどいた） */
  #carrier .person .face-w, #carrier .person .face-s, #carrier .person .face-h { display: none; }
  #carrier.worry .person .face-n, #carrier.shock .person .face-n, #carrier.happy .person .face-n { display: none; }
  #carrier.worry .person .face-w, #carrier.shock .person .face-s, #carrier.happy .person .face-h { display: block; }
  .fx-star { animation: fx-twinkle 2.4s ease-in-out infinite; } .fx-star.s2 { animation-delay: .8s; } .fx-star.s3 { animation-delay: 1.6s; }
  @keyframes fx-twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  #carrier.walking .person .leg.l { animation: fx-legl calc(.5s / var(--spd, 1)) ease-in-out infinite; }
  #carrier.walking .person .leg.r { animation: fx-legr calc(.5s / var(--spd, 1)) ease-in-out infinite; }
  @keyframes fx-legl { 0%, 100% { transform: rotate(13deg); } 50% { transform: rotate(-13deg); } }
  @keyframes fx-legr { 0%, 100% { transform: rotate(-13deg); } 50% { transform: rotate(13deg); } }
  #carrier .gnum { font-size: clamp(14px, 1vw, 18px); }
  #fallenFloor { position: absolute; left: 0; right: 0; bottom: 15%; height: 70px; pointer-events: none; }
  .fallen { position: absolute; width: 60px; height: 34px; transform: translateX(-50%); }
  .fallen svg { width: 100%; height: 100%; }
  #hud { flex: none; background: rgba(58,46,34,.92); color: #fbf3e4; padding: 10px 18px 12px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr); gap: 10px 20px; align-items: center; }
  #hud .bar .cells { height: 20px; }
  #hud .bar .cell { background: rgba(255,255,255,.25); }
  #hud .bar .line4 { background: #fbf3e4; }
  #hud .bar .txt { color: #fbf3e4; font-size: 17px; }
  #hud .bar .txt .judge { color: #9fe3b4; } #hud .bar .txt .judge.luck { color: #ffd37a; } #hud .bar .txt .judge.bad { color: #ff8a80; }
  #carryMsg { font-size: 19px; min-height: 2.6em; line-height: 1.3; }
  #carryMsg b { color: #ff8a80; }
  #carryMsg .calm { color: #9fe3b4; font-weight: 700; }
  #delivered { font-size: 16px; opacity: .9; }
  #carryTitle { font-size: 18px; }

  /* ---------- ゆうがた・おわり の場面 ---------- */
  #scr-evening { background: linear-gradient(#f7b267 0, #f4845f 35%, #5a3a3a 36%, #3b2a24 100%); }
  #scr-end { background: linear-gradient(#1f2a44 0, #3b4a7a 45%, #2b2118 46%, #1c140e 100%); }
  .evening-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; padding: 14px 20px 18px; }
  .scene-box { position: relative; min-height: 0; }
  .scene-box svg { width: 100%; height: 100%; }
  .card { background: var(--paper); border: 3px solid #a98257; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 0; box-shadow: 0 6px 14px rgba(0,0,0,.35); }
  .card h3 { margin: 0; font-size: 24px; }
  .bigline { font-size: 20px; }
  .bigline b { font-size: 26px; }
  .stars { color: #b8860b; font-weight: 700; }
  #falls, #endDays { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .fallrec { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; font-size: 16px; background: #fff; }
  .fallrec > svg { height: 36px; width: 46px; flex: none; }
  .fallrec .txt { flex: 1; min-width: 0; }
  .fallrec .minibox { flex: none; width: 60px; height: 110px; }
  .fallrec .minibox svg { width: 100%; height: 100%; }
  .fallrec .picks { display: flex; flex-wrap: wrap; gap: 2px; max-width: 40%; justify-content: flex-end; align-items: center; font-size: 15px; color: var(--sub); }
  .fallrec .picks svg { width: 28px; height: 24px; }
  .btnrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btnrow button { font-size: 19px; font-weight: 700; padding: 8px 26px; background: var(--accent); color: #fff; border-color: #2b4f86; white-space: nowrap; }
  #endBig { font-size: 40px; font-weight: 700; margin: 4px 0; }
  #endBig.ok { color: var(--safe); }
  #endSeed { font-size: 14px; color: var(--sub); }

  /* ---------- タイトル（部屋の絵を全画面に。文字は木の札と紙の上） ---------- */
  #title { position: absolute; inset: 0; z-index: 20; background: #2b2118; overflow: hidden; }

  <div class="room">
    <div class="wall"><svg viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true"><rect width="1000" height="300" fill="url(#p-paper)"/><rect width="1000" height="12" fill="#000" opacity=".12"/></svg></div>
    <div class="floor"><svg viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true"><rect width="1000" height="300" fill="url(#p-planks)"/><rect width="1000" height="300" fill="url(#p-grain)"/><rect width="1000" height="300" fill="url(#g-floor)"/><ellipse cx="500" cy="175" rx="270" ry="75" fill="url(#g-light)"/><rect width="1000" height="300" fill="url(#g-glass)" opacity=".15"/><rect x="0" y="0" width="1000" height="14" fill="#7a5431"/><rect x="0" y="0" width="1000" height="4" fill="#b88a55"/><rect x="0" y="13" width="1000" height="3" fill="#3a2a1c"/></svg></div>
    <div class="win" aria-hidden="true"><svg viewBox="0 0 110 104"><rect x="4" y="2" width="102" height="92" rx="2" fill="#5a3a1a"/><rect x="9" y="7" width="92" height="82" fill="url(#g-sky)"/><path d="M9 89 l92 -82 v18 l-72 64z" fill="#fff" opacity=".18"/><rect x="9" y="7" width="92" height="82" fill="url(#g-glass)"/><rect x="52" y="7" width="6" height="82" fill="#8a6238"/><rect x="9" y="45" width="92" height="6" fill="#8a6238"/><rect x="9" y="7" width="92" height="82" fill="none" stroke="#3a2a1c" stroke-width="1"/><rect x="0" y="92" width="110" height="8" rx="1.5" fill="#a8773f"/><rect x="0" y="92" width="110" height="2.5" fill="#fff" opacity=".35"/><rect x="2" y="100" width="106" height="3" fill="#000" opacity=".25"/><path d="M86 92 v-9 h10 v9z" fill="#b5533a"/><path d="M85 83 h12" stroke="#7a3a28" stroke-width="2"/><path d="M91 83 q-9 -8 -4 -16 q6 6 4 16z M91 83 q8 -9 2 -17 q-7 7 -2 17z M91 83 q-1 -11 -10 -11 q3 9 10 11z" fill="#5f9b5a"/></svg></div>
    <div id="basketBox">
      <div class="panel-title">かご <span id="basketCnt"></span> <span class="guide hidden" id="gSelect">えらぶ</span></div>
      <div id="basketArt"><svg class="bk" viewBox="0 0 300 420" preserveAspectRatio="none" aria-hidden="true"></svg><div id="basket"></div></div>
    </div>
    <div id="stacksBox">
      <div id="stackUI">
        <div class="panel-title">やま <span id="stacksNote"></span> <span class="guide hidden" id="gStack">つむ</span></div>
        <div id="stacks"></div>
      </div>
    </div>
    <div id="foldBox">
      <div class="panel-title">たたみかた <span id="foldWho" class="who"></span> <span class="guide hidden" id="gFold">たたむ</span></div>
      <div id="foldTray"><div id="folds"></div><div id="foldHint">かごの 1まいを えらぶ</div></div>
      <div id="carryBtnRow">
        <button id="carryBtn" disabled><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="6" y="4" width="28" height="34" rx="2" fill="#8a6238"/><rect x="9" y="7" width="22" height="28" rx="1" fill="#c49461"/><circle cx="27" cy="22" r="2" fill="#3a2e22"/><path d="M14 20 h8 m-3 -3 l3 3 l-3 3" stroke="#fbf3e4" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><span>はこぶ</span><span class="guide hidden" id="gCarry">はこぶ</span></button>
        <div id="carryNote"></div>
      </div>
    </div>
  </div>
</section>

<!-- はこぶ -->
<section class="scr" id="scr-carry">
  <div class="bar-top">
    <span class="ttl">はこぶ</span>
    <span class="day" id="carryDay">1日目／3</span>
    <span class="sub" id="carryTitle"></span>
    <span class="sp"></span>
    <span class="seg" id="speedSeg"><button data-speed="1" class="on">ふつう</button><button data-speed="2.5">はやい</button></span>
  </div>
  <div id="hall">
    <svg class="bg" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="stations"></div>
    <div id="fallenFloor"></div>
    <div id="carrier" class="hidden"><div class="cst" id="carrierStack"></div><svg class="person" viewBox="0 0 120 96" aria-hidden="true"></svg></div>
  </div>
  <div id="hud">
    <div id="carryBar" class="bar"></div>
    <div><div id="carryMsg"></div><div id="delivered"></div></div>
  </div>
</section>

<!-- ゆうがた -->
<section class="scr" id="scr-evening">
  <div class="bar-top"><span class="ttl">ゆうがた</span><span class="day" id="evDay">1日目／3</span></div>
  <div class="evening-wrap">
    <div class="scene-box"><svg id="evScene" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>
    <div class="card" id="evening">
      <h3 id="evTitle">1日目の ゆうがた</h3>
      <div class="bigline" id="evLine"></div>
      <div class="bigline stars" id="evStars"></div>
      <div id="falls"></div>
      <div class="btnrow"><button id="nextBtn">つぎの 日へ</button><span id="evNote"></span></div>
    </div>
  </div>
</section>

<!-- おわり -->
<section class="scr" id="scr-end">
  <div class="bar-top"><span class="ttl">3日目の よる</span></div>
  <div class="evening-wrap">
    <div class="scene-box"><svg id="endScene" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>
    <div class="card" id="end">
      <div id="endBig"></div>
      <div class="bigline" id="endLine"></div>
      <div class="bigline stars" id="endStars"></div>
      <div id="endDays" class="bigline"></div>
      <div class="btnrow"><button id="againBtn" aria-label="もう一回">↻</button><span id="endSeed"></span></div>
    </div>
  </div>
</section>

<script src="rules.js"></script>
<script src="ui.js"></script>
</body>
</html>
