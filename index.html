<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>でこもん</title>
<style>
:root {
  --bg: #1b1f2a; --panel: #272c3a; --panel2: #313748; --line: #3e4558;
  --text: #f4f1ea; --sub: #c9c4b8; --accent: #ffcc4d; --gold: #ffd54a;
  --p: #58c7ff; --e: #ff6b6b; --ok: #7ee787; --bad: #ff9c9c; --good: #9fe3a8; --poison: #c77dff;
  --spd: 1;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 18px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
.screen { display: none; max-width: 560px; margin: 0 auto; padding: 12px 14px 32px; min-height: 100vh; background: var(--bg); }
.screen.on { display: block; }
.screen:not(.on) { display: none !important; }
@media (min-width: 700px) { html { font-size: 20px; } .screen { max-width: 640px; } }

h1 { font-size: 2.6rem; margin: 0; letter-spacing: .08em; }
.sub { color: var(--sub); }
.btn { display: block; width: 100%; min-height: 60px; border: 0; border-radius: 16px; background: var(--accent); color: #1b1f2a;
  font-size: 1.5rem; font-weight: 700; letter-spacing: .1em; box-shadow: 0 4px 0 #b58a16; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b58a16; }
.btn.round { width: 140px; height: 140px; min-height: 0; margin: 40px auto 0; border-radius: 50%; font-size: 3.5rem; letter-spacing: 0; display: flex; align-items: center; justify-content: center; }
.btn.sub { background: var(--panel2); color: var(--text); box-shadow: 0 4px 0 #1a1d26; font-size: 1.2rem; min-height: 52px; }
.btn.small { display: inline-block; width: auto; min-height: 44px; padding: 6px 16px; font-size: 1.05rem; letter-spacing: .04em; }
.center { text-align: center; }

/* 音量 */
.volbtn { position: fixed; top: 8px; right: 8px; z-index: 90; width: 48px; height: 48px; border-radius: 50%; background: var(--panel2); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.volbtn svg { width: 28px; height: 28px; }
.volbtn.muted { opacity: .6; }
.volpop { position: fixed; top: 62px; right: 8px; z-index: 90; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; display: none; width: 260px; }
.volpop.on { display: block; }
.volpop .row { margin-bottom: 8px; }
.volpop input[type=range] { width: 100%; height: 32px; }
.volpop .mutebtn { min-height: 44px; font-size: 1.05rem; }

/* タイトル */
#title { display: none; text-align: center; padding-top: 10vh; }
#title.on { display: block; }
#title .mon { width: 180px; height: 180px; margin: 10px auto 0; }
#title .btn.sub { max-width: 260px; margin: 14px auto 0; }
.ver { color: var(--sub); font-size: 1rem; margin-top: 18px; }
.topbar { padding-right: 60px; min-height: 48px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* カード */
.card { background: var(--panel); border-radius: 16px; padding: 12px 14px; margin: 10px 0; }
.card.e { border: 2px solid rgba(255,107,107,.55); }
.card.f { border: 2px solid rgba(255,204,77,.5); }
.card.me { border: 2px solid rgba(88,199,255,.5); }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ec-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.ec-top .mon { width: 110px; height: 110px; flex: 0 0 110px; }
.ec-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ec-name { font-size: 1.45rem; font-weight: 800; line-height: 1.2; }
.met { font-size: .95rem; padding: 2px 10px; border-radius: 10px; background: var(--panel2); color: var(--sub); white-space: nowrap; }
.met.first { background: #4a3f1e; color: var(--accent); }
.stats { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; align-items: flex-start; min-width: 4.5em; }
.stat .k { font-size: .95rem; color: var(--sub); line-height: 1.2; }
.stat .v { font-size: 1.45rem; font-weight: 800; line-height: 1.2; white-space: nowrap; }
.stat .v.chg { color: var(--accent); }
.stat .v .grow { font-size: .95rem; color: var(--good); font-weight: 700; margin-left: 4px; }
.traits { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
.trait { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 3px 0; }
.trait .ticon { width: 30px; height: 30px; flex: 0 0 30px; }
.trait b { white-space: nowrap; font-size: 1.1rem; min-width: 5.5em; }
.trait span { color: var(--sub); }
.label { color: var(--sub); font-size: 1rem; margin: 8px 0 4px; }
.minis { display: flex; flex-wrap: wrap; gap: 8px; }
.mini { background: var(--panel2); border: 3px solid var(--line); border-radius: 14px; padding: 6px 10px; display: flex; flex-direction: column; min-width: 0; flex: 1 1 45%; }
.mini .pc-name { font-size: 1.1rem; }
.mini span.eff { color: var(--sub); font-size: 1rem; }
.f-name { font-size: 1.3rem; font-weight: 700; }
.f-desc { margin-top: 4px; }

/* バトル前：自分 */
.slots { display: flex; gap: 6px; margin: 8px 0 4px; align-items: center; flex-wrap: wrap; }
.slots .lbl { color: var(--sub); font-size: 1rem; margin-right: 4px; }
.slot { width: 52px; height: 46px; border-radius: 10px; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: .85rem; color: var(--sub); text-align: center; line-height: 1.1; padding: 0 2px; overflow: hidden; }
.slot.on { border-style: solid; border-color: var(--accent); color: var(--accent); background: #3a3420; }
.slot.lv2 { border-color: var(--gold); color: var(--gold); }
.first { font-size: 1.1rem; margin-top: 4px; min-height: 1.5em; }
.first b { color: var(--accent); }
.note { color: var(--bad); min-height: 1.4em; font-size: 1rem; }

/* パーツ札 */
.plist { display: grid; grid-template-columns: 1fr; gap: 8px; }
.pcard { background: var(--panel); border: 3px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; user-select: none; position: relative; }
.pcard.on { border-color: var(--accent); background: #3a3420; }
.pcard.lv2 { border-color: var(--gold); box-shadow: 0 0 0 1px #7a5c00 inset; }
.pcard.on.lv2 { background: #3f381c; }
.pcard:active { transform: scale(.985); }
.pcard.swapped { animation: swapflash calc(.6s * var(--spd)) ease-out; }
@keyframes swapflash { 0% { box-shadow: 0 0 0 0 #ffcc4d; background: #5a4a1e; } 100% { box-shadow: 0 0 0 10px rgba(255,204,77,0); } }
.pc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pc-name { font-size: 1.25rem; font-weight: 700; }
.mark { font-size: 1.35rem; font-weight: 900; line-height: 1; padding: 0 4px; cursor: pointer; }
.mark.g { color: var(--good); } .mark.b { color: var(--bad); }
.pc-hint { margin-top: 4px; font-size: 1rem; font-weight: 700; }
.pc-hint.g { color: var(--good); } .pc-hint.b { color: var(--bad); }
.tag { font-size: .9rem; padding: 2px 8px; border-radius: 8px; background: var(--panel2); color: var(--sub); white-space: nowrap; }
.tag.heavy { background: #4a3b2f; color: #f0c9a0; }
.tag.light { background: #2f4a44; color: #a8f0e0; }
.tag.loc { background: #2a3550; color: #bcd0ff; }
.tag.lv { background: #5a4a10; color: var(--gold); font-weight: 800; }
.pc-on { margin-left: auto; font-size: 1rem; color: var(--accent); font-weight: 700; white-space: nowrap; }
.pc-eff { margin-top: 3px; }
.pc-lv2 { margin-top: 2px; color: var(--gold); font-weight: 700; }
.hint { display: inline-block; background: var(--accent); color: #1b1f2a; font-weight: 700; padding: 4px 12px; border-radius: 10px; font-size: 1.1rem; margin: 6px 0; animation: bob 1s infinite; }
@keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-4px);} }

/* バトル前の並び */
#pre { padding-bottom: 120px; }
.fight-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 14px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, rgba(27,31,42,0)); z-index: 5; }
.fight-bar .btn { max-width: 560px; margin: 0 auto; }
@media (min-width: 900px) {
  #pre { max-width: 1240px; height: 100vh; overflow: hidden; padding: 10px 16px 12px; flex-direction: column; }
  #pre.on { display: flex; }
  .pre-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
  .col-l { overflow-y: auto; min-height: 0; padding-right: 4px; }
  .col-r { display: flex; flex-direction: column; min-height: 0; }
  .col-r .plist { overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; align-content: start; }
  .fight-bar { position: static; padding: 10px 0 0; background: none; }
  .fight-bar .btn { max-width: none; }
  #pre .card { margin: 0 0 10px; }
  .ec-top .mon { width: 124px; height: 124px; flex-basis: 124px; }
}

/* 周回の始め・勝ち・結果 */
.namebig { font-size: 2.2rem; font-weight: 900; color: var(--accent); }
.recap { background: var(--panel); border-radius: 14px; padding: 10px 14px; text-align: left; margin: 8px 0; }
.recap .t { color: var(--sub); font-size: 1rem; }
.recap .syn { color: var(--accent); font-weight: 700; }
.recap .spk { color: var(--gold); font-weight: 700; }
.picked { background: #3a3420; border: 2px solid var(--accent); border-radius: 14px; padding: 10px 14px; margin: 8px 0; font-size: 1.2rem; font-weight: 800; }
.dendo-note { color: var(--good); font-weight: 700; margin: 6px 0; }
.list { margin: 8px 0; }
.list .it { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.list .it .mon { width: 56px; height: 56px; flex: 0 0 56px; }
.list .it .t { flex: 1; min-width: 0; }
.list .it .t small { color: var(--sub); font-size: 1rem; display: block; }
.big-title { font-size: 2rem; font-weight: 900; margin: 6px 0; }
.lose-title { color: var(--bad); }
.win-title { color: var(--accent); }
.mid-title { font-size: 1.2rem; color: var(--accent); font-weight: 800; }
.zk { background: var(--panel); border-radius: 14px; padding: 10px 14px; margin: 8px 0; border: 3px solid var(--line); }
.zk.found { border-color: var(--accent); }
.zk.lv2.found { border-color: var(--gold); }
.zk .n { font-size: 1.25rem; font-weight: 800; }
.zk .d { color: var(--sub); margin-top: 2px; }
.zk.unknown .n { color: #8a8f9c; }
.hall { background: var(--panel); border-radius: 14px; padding: 10px 14px; margin: 8px 0; border: 2px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.hall .mon { width: 96px; height: 96px; flex: 0 0 96px; }
.hall .t { flex: 1; min-width: 0; }
.hall .t .n { font-size: 1.35rem; font-weight: 900; color: var(--accent); }
.hall .t small { display: block; color: var(--sub); font-size: 1rem; }

/* モンスター SVG */
.mon { display: block; overflow: visible; }
.mon .part { display: none; transform-box: fill-box; transform-origin: center; }
.mon .part.on { display: inline; }
.mon .part.lv2 { filter: drop-shadow(0 0 3px #ffd54a) drop-shadow(0 0 1px #ffd54a); }
.mon .part.glow { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 16px #ffd54a); animation: pulse calc(.7s * var(--spd)) ease-out; }
.mon .part.goldglow { filter: drop-shadow(0 0 8px #ffd54a) drop-shadow(0 0 22px #ffb300); animation: pulse calc(.9s * var(--spd)) ease-out; }
@keyframes pulse { 0% { transform: scale(1);} 35% { transform: scale(1.5);} 100% { transform: scale(1);} }
.mon .part.spike.ext { transform-origin: center bottom; animation: spikeExt calc(.45s * var(--spd)) ease-out; }
@keyframes spikeExt { 0% { transform: scaleY(1);} 30% { transform: scaleY(1.5);} 100% { transform: scaleY(1);} }
.mon .body.lit { filter: brightness(2.2); }
.mon .st { display: none; }
.mon .st.on { display: inline; }
.mon .st-poison circle { animation: bubble 1.4s ease-in-out infinite; }
.mon .st-poison circle:nth-child(2) { animation-delay: .4s; } .mon .st-poison circle:nth-child(3) { animation-delay: .8s; }
@keyframes bubble { 0%,100% { transform: translateY(0); opacity: .9;} 50% { transform: translateY(-8px); opacity: .5;} }
.mon.chargeglow { filter: drop-shadow(0 0 14px #ffe066) drop-shadow(0 0 28px #ffb300); }

/* バトル */
#battle { max-width: 1100px; height: 100vh; height: 100dvh; min-height: 0; flex-direction: column; padding: 8px 10px 10px; overflow: hidden; background: var(--bg); }
#battle.on { display: flex; }
#battle.shake { animation: shake calc(.2s * var(--spd)) linear; }
@keyframes shake { 0%,100% { transform: translate(0,0);} 20% { transform: translate(-8px, 5px);} 40% { transform: translate(7px, -4px);} 60% { transform: translate(-6px, -5px);} 80% { transform: translate(5px, 4px);} }
.b-top { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; color: var(--sub); padding-right: 56px; }
.b-top b { color: var(--text); font-size: 1.3rem; }
.hpRow { display: flex; gap: 12px; margin: 6px 0 4px; }
.hpBox { flex: 1; min-width: 0; }
.hp-name { font-size: 1.3rem; font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hp-name .num { color: var(--sub); font-weight: 600; font-size: 1.15rem; white-space: nowrap; }
.hp-name .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hp { position: relative; height: 38px; background: #141720; border-radius: 10px; overflow: hidden; border: 3px solid var(--line); }
.hp.shake { animation: hpShake calc(.25s * var(--spd)) linear; }
@keyframes hpShake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-4px);} 50% { transform: translateX(4px);} 75% { transform: translateX(-3px);} }
.hp .ghost { position: absolute; left: 0; top: 0; bottom: 0; background: #fff5; transition: width calc(.6s * var(--spd)) ease; }
.hp .fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width calc(.2s * var(--spd)) ease; }
.hp .fill.low { animation: blink .8s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: 1;} 50% { opacity: .4;} }
.hpBox.p .fill { background: var(--p); } .hpBox.e .fill { background: var(--e); }
.hpBox.e .hp-name { flex-direction: row-reverse; }
.hpBox.e .hp .fill, .hpBox.e .hp .ghost { left: auto; right: 0; }
@media (max-width: 899px) { .hp-name, .hpBox.e .hp-name { flex-direction: column; gap: 0; } .hp-name { align-items: flex-start; } .hpBox.e .hp-name { align-items: flex-end; } }
/* 寄りで拡大する層の外側に、不透明の層（後ろの画面が透けないように） */
.arena-wrap { position: relative; flex: 1; min-height: 260px; margin-top: 4px; border-radius: 16px; background: #1b1f2a; overflow: hidden; }
.arena { position: absolute; inset: 0; background: linear-gradient(#232838, #1b1f2a 70%); transition: transform calc(.08s * var(--spd)) ease-out; transform-origin: 50% 60%; }
.arena.zoom { transform: scale(1.04); } .arena.zoom.zbig { transform: scale(1.08); }
.arena .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 14%; background: #2b3042; }
.arena.mud .ground { background: #4a3a2a; } .arena.rain .ground { background: #2b3d55; } .arena.wind .ground { background: #3a4a3a; }
.rain-fx { position: absolute; inset: 0; pointer-events: none; display: none; background: repeating-linear-gradient(100deg, transparent 0 18px, #9cc8ff22 18px 20px); }
.arena.rain .rain-fx { display: block; }
.wind-fx { position: absolute; inset: 0; pointer-events: none; display: none; background: repeating-linear-gradient(0deg, transparent 0 26px, #cfe9ff14 26px 28px); }
.arena.wind .wind-fx { display: block; }
.mon-wrap { position: absolute; bottom: 8%; width: 60%; height: 54%; }
.mon-wrap.p { left: -8%; } .mon-wrap.e { right: -8%; }
@media (min-width: 900px) { .mon-wrap { width: 42%; height: 60%; } .mon-wrap.p { left: 2%; } .mon-wrap.e { right: 2%; } }
.anim { width: 100%; height: 100%; transform-origin: 50% 100%; --dir: 1; }
.mon-wrap.e .anim { --dir: -1; }
.anim .mon { width: 100%; height: 100%; }
.anim.stop, .anim.stop .part, .anim.stop .mon { animation-play-state: paused !important; }
.anim.charge { animation: charge calc(.3s * var(--spd)) ease-in forwards; }
@keyframes charge { 0% { transform: translateX(0) scale(1,1);} 100% { transform: translateX(calc(-8% * var(--dir))) scale(.9,1.1);} }
.anim.lunge { animation: lunge calc(.42s * var(--spd)) ease-out; }
@keyframes lunge { 0% { transform: translateX(0) scale(1,1);} 25% { transform: translateX(calc(-6% * var(--dir))) scale(.94,1.06);} 55% { transform: translateX(calc(20% * var(--dir))) scale(1.14,.9);} 100% { transform: translateX(0) scale(1,1);} }
.anim.squash { animation: squash calc(.4s * var(--spd)) ease-out; }
@keyframes squash { 0% { transform: scale(1,1);} 30% { transform: translateX(calc(-16% * var(--dir))) scale(1.26,.7);} 65% { transform: translateX(calc(-9% * var(--dir))) scale(.94,1.08);} 100% { transform: scale(1,1);} }
.anim.squash-weak { animation: squashWeak calc(.3s * var(--spd)) ease-out; }
@keyframes squashWeak { 0% { transform: scale(1,1);} 40% { transform: translateX(calc(-3% * var(--dir))) scale(1.04,.96);} 100% { transform: scale(1,1);} }
.anim.hop { animation: hop calc(.32s * var(--spd)) ease-out; }
@keyframes hop { 0% { transform: translateY(0) scale(1,1);} 30% { transform: translateY(-10%) scale(.96,1.06);} 70% { transform: translateY(0) scale(1.06,.94);} 100% { transform: translateY(0) scale(1,1);} }
.anim.blow { transform-origin: 50% 62%; animation: blow calc(.7s * var(--spd)) ease-out forwards; }
@keyframes blow { 0% { transform: translate(0,0) rotate(0); opacity: 1;} 60% { transform: translate(calc(-26% * var(--dir)), -16%) rotate(calc(-70deg * var(--dir))); opacity: .9;} 100% { transform: translate(calc(-22% * var(--dir)), 4%) rotate(calc(-95deg * var(--dir))); opacity: .45;} }
.stbar { position: absolute; left: -4%; right: -4%; bottom: -10px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; pointer-events: none; z-index: 3; }
.mon-wrap.p .stbar { right: 4%; } .mon-wrap.e .stbar { left: 4%; }
.stchip { font-size: 1rem; font-weight: 800; padding: 2px 8px; border-radius: 8px; background: #000a; color: #fff; }
.stchip.poison { color: #e2b7ff; } .stchip.brittle { color: #ffd0a0; } .stchip.stagger { color: #bfe3ff; }
.stchip.cd { color: var(--accent); } .stchip.cd.now { color: #fff; background: #7a5c00dd; }
.cdlabel { position: absolute; font-size: 1rem; font-weight: 800; color: var(--accent); background: #000a; padding: 1px 6px; border-radius: 6px; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap; z-index: 3; }
.cdlabel.now { color: #fff; font-size: 1.2rem; }

/* 大きな文字（左右に1つずつ。重ならないよう 幅 46%） */
.big { position: absolute; top: 2%; width: 46%; padding: 0 6px; text-align: center; font-weight: 900; font-size: 1.5rem; line-height: 1.15; min-height: 2.4em; text-shadow: 0 2px 0 #000, 0 0 12px #000; z-index: 3; word-break: keep-all; overflow-wrap: anywhere; }
.big.l { left: 2%; color: #dff3ff; } .big.r { right: 2%; color: #ffe0e0; }
.big .bn { display: inline-block; font-size: 1.5em; margin-left: .2em; color: var(--accent); }
.big .sm { font-size: .8em; font-weight: 700; opacity: .9; }
.big.bighit { font-size: 1.9rem; color: #ffe08a; }
.big.status { color: #e2b7ff; }
@media (min-width: 900px) { .big { font-size: 1.7rem; } .big.bighit { font-size: 2.1rem; } }
.synpop { position: absolute; left: 6%; right: 6%; top: 22%; text-align: center; z-index: 6; display: none; pointer-events: none; }
.synpop.on { display: block; animation: synIn calc(.5s * var(--spd)) ease-out; }
@keyframes synIn { 0% { transform: scale(.5); opacity: 0;} 60% { transform: scale(1.1); opacity: 1;} 100% { transform: scale(1); } }
.synpop .name { font-size: 2.2rem; font-weight: 900; color: #fff; text-shadow: 0 0 14px #ffcc4d, 0 3px 0 #000; }
@media (min-width: 900px) { .synpop .name { font-size: 2.6rem; } }
/* みつけた！（本の印へ吸い込まれる） */
#found { position: absolute; inset: 0; z-index: 7; display: none; pointer-events: none; }
#found.on { display: block; }
.found .fcard { position: absolute; top: 34%; padding: 8px 14px; background: var(--panel); border: 3px solid var(--accent); border-radius: 12px; font-size: 1.3rem; font-weight: 900; color: #fff; white-space: nowrap; transform: translateY(-50%); transition: left calc(.35s * var(--spd)) cubic-bezier(.2,.8,.2,1), right calc(.35s * var(--spd)) cubic-bezier(.2,.8,.2,1), opacity calc(.15s * var(--spd)); }

.found.suck .ftag { opacity: 0; }
.zkicon { position: absolute; left: 8px; top: 8px; width: 44px; height: 44px; z-index: 8; opacity: .55; transition: transform calc(.3s * var(--spd)), opacity calc(.3s * var(--spd)); }
.zkicon.lit { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 12px #ffcc4d); }
/* ひらめき（電球、金色） */

.bulb { position: absolute; width: 44px; height: 54px; transform: translate(-50%, -100%); animation: bulbIn calc(.8s * var(--spd)) ease-out; filter: drop-shadow(0 0 10px #ffd54a); }
@keyframes bulbIn { 0% { transform: translate(-50%, -60%) scale(.3); opacity: 0;} 40% { transform: translate(-50%, -110%) scale(1.3); opacity: 1;} 100% { transform: translate(-50%, -100%) scale(1); opacity: 1;} }
.goldring { width: 60px; height: 60px; border-radius: 50%; border: 5px solid #ffd54a; animation: ring calc(.8s * var(--spd)) ease-out forwards; }

/* 効果 */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }

.shot.r2l .tail { left: 0; background: linear-gradient(to left, transparent, currentColor); }
.hitflash { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(#fff, #fff8 40%, transparent 70%); animation: hitflash calc(.3s * var(--spd)) ease-out forwards; }
.hitflash.big { width: 240px; height: 240px; }
@keyframes hitflash { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 1;} 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0;} }
.spark { width: 14px; height: 14px; border-radius: 50%; background: #fff4c2; box-shadow: 0 0 10px 3px rgba(255,236,170,.8); animation: spark calc(.45s * var(--spd)) ease-out forwards; }
.spark.sq { border-radius: 2px; }
.spark.small { width: 8px; height: 8px; box-shadow: 0 0 6px 2px rgba(255,236,170,.6); }
@keyframes spark { 0% { transform: translate(-50%,-50%) scale(1); opacity: 1;} 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2); opacity: 0;} }
.dust { width: 26px; height: 18px; border-radius: 50%; background: rgba(200,190,170,.55); animation: dust calc(.5s * var(--spd)) ease-out forwards; }
@keyframes dust { 0% { transform: translate(-50%,-50%) scale(.5); opacity: .9;} 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% - 18px)) scale(1.8); opacity: 0;} }
.ring { width: 40px; height: 40px; border-radius: 50%; border: 4px solid #ffd54a; animation: ring calc(.5s * var(--spd)) ease-out forwards; }
.ring.bighit { width: 120px; height: 120px; border-width: 6px; border-color: #ffe08a; animation-duration: calc(.6s * var(--spd)); }
@keyframes ring { 0% { transform: translate(-50%,-50%) scale(.4); opacity: 1;} 100% { transform: translate(-50%,-50%) scale(3.2); opacity: 0;} }
.ghost { opacity: .35; pointer-events: none; animation: ghostOut calc(.35s * var(--spd)) ease-out forwards; }
@keyframes ghostOut { 0% { opacity: .4;} 100% { opacity: 0;} }
.ghost .mon { width: 100%; height: 100%; }
.shield { width: 70px; height: 120px; border-radius: 45% / 50%; background: rgba(160,220,255,.45); border: 3px solid rgba(220,245,255,.95); transform: translate(-50%,-50%); animation: shieldIn calc(.14s * var(--spd)) ease-out; }
.shield.break { animation: shieldBreak calc(.3s * var(--spd)) ease-in forwards; }
@keyframes shieldIn { 0% { transform: translate(-50%,-50%) scale(.6); opacity: 0;} 100% { transform: translate(-50%,-50%) scale(1); opacity: 1;} }
@keyframes shieldBreak { 0% { opacity: 1; transform: translate(-50%,-50%) scale(1);} 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.25);} }
.dmg { font-weight: 900; font-size: 2.1rem; line-height: 1; color: #fff; text-shadow: 0 2px 0 #000, 0 0 10px #000; white-space: nowrap; animation: dmgPop calc(.5s * var(--spd)) ease-out forwards; }
@keyframes dmgPop { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 0;} 35% { transform: translate(-50%,-90%) scale(1.25); opacity: 1;} 100% { transform: translate(-50%,-110%) scale(1); opacity: 1;} }
.dmg.fade { animation: dmgFade calc(.25s * var(--spd)) ease-out forwards; }
@keyframes dmgFade { 0% { transform: translate(-50%,-110%) scale(1); opacity: 1;} 100% { transform: translate(-50%,-125%) scale(1); opacity: 0;} }
.dmg.bighit { font-size: 2.9rem; color: #ffe08a; }
.dmg.weak { font-size: 1.5rem; color: #a9adb8; }
.dmg.counter { color: #ffd54a; }
.dmg.heal { color: #9fe3a8; font-size: 1.7rem; }
.dmg.poison { color: #e2b7ff; font-size: 1.8rem; }
.dmg.stat { font-size: 1.4rem; color: #e2b7ff; }
@media (min-width: 900px) { .dmg { font-size: 2.6rem; } .dmg.bighit { font-size: 3.6rem; } .dmg.weak { font-size: 1.8rem; } }
.result { position: absolute; left: 0; right: 0; top: 40%; text-align: center; line-height: 1.1; font-size: 2.8rem; font-weight: 900; display: none; text-shadow: 0 3px 0 #000, 0 0 16px #000; z-index: 5; }
.result.on { display: block; animation: pop calc(.4s * var(--spd)) ease-out; }
.result.finish { font-size: 3.4rem; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }
.flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 50; background: #fff; }
.flash.on { animation: flashOut calc(.4s * var(--spd)) ease-out; }
@keyframes flashOut { 0% { opacity: .27;} 100% { opacity: 0;} }

/* 版5：≡メニュー、つづきから、確認 */
.menubtn { position: fixed; top: 8px; right: 64px; z-index: 90; width: 48px; height: 48px; border-radius: 50%; background: var(--panel2); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.6rem; font-weight: 900; color: var(--text); }
.menupop { position: fixed; top: 62px; right: 8px; z-index: 90; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px; display: none; width: 260px; }
.menupop.on { display: block; }
.menupop .btn.sub { margin: 6px 0; }
.menupop .mnote { color: var(--sub); font-size: 1rem; margin: 4px 2px 2px; }
.contlbl { color: var(--accent); font-size: 1.15rem; font-weight: 700; margin-top: 8px; min-height: 1.6em; }
.overlay { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 20px; }
.overlay.on { display: flex; }
.overlay .box { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 18px; max-width: 420px; width: 100%; }
.overlay .box .q { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; }
.overlay .box .btn { margin-top: 8px; }
/* 版5：かてば もらえる、そだちのゲージ */
.reward { margin-top: 8px; padding: 8px 12px; border-radius: 12px; background: #2a3550; border: 2px solid #4a6aa0; font-size: 1.1rem; font-weight: 700; }
.reward b { color: #bcd0ff; }
.growrow { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
.growrow .gt { font-size: 1rem; color: var(--sub); }
.gauges { display: flex; gap: 8px; margin-top: 4px; }
.gauge { flex: 1; min-width: 0; }
.gauge .gl { font-size: .95rem; color: var(--sub); display: flex; justify-content: space-between; }
.gauge .gl b { color: var(--text); font-weight: 700; }
.gauge .gb { height: 8px; border-radius: 4px; background: #141720; border: 1px solid var(--line); overflow: hidden; }
.gauge .gb i { display: block; height: 100%; background: var(--sub); }
.gauge.lead .gl b { color: var(--accent); }
.gauge.lead .gb i { background: var(--accent); }
/* 版5：場所ごとの札、Lv2 の金リボン、付けているの青白い枠、なれゲージ */
.pgroup { background: #20242f; border-radius: 14px; padding: 6px 8px 8px; }
.ploc { font-size: 1rem; color: #bcd0ff; font-weight: 700; margin: 0 2px 4px; }
.pcards { display: grid; gap: 8px; }
@media (min-width: 900px) { .col-r .plist { grid-template-columns: 1fr 1fr; align-content: start; } }
.pcard { overflow: visible; }
.pcard.on { border-color: #9fd8ff; background: #233247; box-shadow: 0 0 0 3px rgba(159,216,255,.28), 0 0 16px rgba(159,216,255,.35); }
.pcard.lv2 { border-color: var(--line); box-shadow: none; }
.pcard.on.lv2 { border-color: #9fd8ff; background: #233247; box-shadow: 0 0 0 3px rgba(159,216,255,.28), 0 0 16px rgba(159,216,255,.35); }
.pcard.lv2::after { content: 'Lv2'; position: absolute; top: -4px; right: 10px; padding: 8px 7px 9px; background: linear-gradient(#ffe08a, #d4a017); color: #4a3000; font-weight: 900; font-size: .9rem; line-height: 1; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); box-shadow: 0 2px 0 #7a5c00; }
.pcard.lv2 .pc-head { padding-right: 44px; }
.pc-lv2 { color: var(--gold); }
.pc-on { color: #bfe9ff; }
.nare { margin-top: 6px; height: 7px; border-radius: 4px; background: #141720; border: 1px solid var(--line); overflow: hidden; }
.nare i { display: block; height: 100%; background: #7fb4d8; transition: width calc(.3s * var(--spd)); }
.nare.near i { background: #ffd54a; }
.nare.full i { background: #ffd54a; box-shadow: 0 0 8px #ffd54a; }
.tag.soon { background: #5a4a10; color: var(--gold); animation: soonGlow 1.2s ease-in-out infinite; }
@keyframes soonGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,213,74,0);} 50% { box-shadow: 0 0 10px 2px rgba(255,213,74,.7);} }
/* 版5：バトル中の なれ の小さいゲージ、Lv2 の演出 */
.nbar { position: absolute; width: 34px; height: 6px; border-radius: 3px; background: #141720cc; border: 1px solid #3e4558; transform: translate(-50%, -100%); opacity: .55; }
.nbar i { display: block; height: 100%; background: #7fb4d8; border-radius: 3px; }
.nbar.near { opacity: 1; width: 44px; height: 8px; border-color: #ffd54a; } .nbar.near i { background: #ffd54a; }
.nbar.full { opacity: 1; width: 48px; height: 9px; border-color: #fff; box-shadow: 0 0 10px #ffd54a; } .nbar.full i { background: #ffe08a; }
.anim.blownback { animation: blownback calc(.5s * var(--spd)) ease-out; }
@keyframes blownback { 0% { transform: translateX(0);} 40% { transform: translateX(calc(-22% * var(--dir))) rotate(calc(-12deg * var(--dir)));} 100% { transform: translateX(0);} }
.anim.stunned { animation: stunned calc(.6s * var(--spd)) ease-in-out; }
@keyframes stunned { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-3%) rotate(-3deg);} 75% { transform: translateX(3%) rotate(3deg);} }
.anim.dodge { animation: dodge calc(.5s * var(--spd)) ease-out; }
@keyframes dodge { 0% { transform: translateX(0);} 35% { transform: translateX(calc(-26% * var(--dir))) scale(.96,1.04);} 100% { transform: translateX(0);} }
.anim.bigjump { animation: bigjump calc(.6s * var(--spd)) ease-out; }
@keyframes bigjump { 0% { transform: translateY(0);} 45% { transform: translateY(-38%) scale(.94,1.08);} 80% { transform: translateY(0) scale(1.08,.92);} 100% { transform: translateY(0);} }
.anim.stomp { animation: stomp calc(.45s * var(--spd)) ease-in; }
@keyframes stomp { 0% { transform: translateY(0);} 40% { transform: translateY(-22%) translateX(calc(10% * var(--dir)));} 70% { transform: translateY(2%) translateX(calc(14% * var(--dir))) scale(1.1,.9);} 100% { transform: translateY(0);} }
.scratch { width: 48px; height: 40px; transform: translate(-50%,-50%); background: repeating-linear-gradient(115deg, transparent 0 9px, #ff6b6b 9px 12px); clip-path: polygon(20% 0, 100% 0, 80% 100%, 0 100%); animation: scratch calc(.5s * var(--spd)) ease-out forwards; }
@keyframes scratch { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.6);} 30% { opacity: 1; transform: translate(-50%,-50%) scale(1.1);} 100% { opacity: 0; transform: translate(-50%,-50%) scale(1);} }
.mon .part.broken { filter: grayscale(1) brightness(.6); opacity: .7; }
.shield.big { width: 110px; height: 150px; background: rgba(181,101,29,.45); border-color: #ffd0a0; }
.windline { position: absolute; height: 4px; border-radius: 2px; background: linear-gradient(to right, transparent, #cfe9ff); transform: translate(-50%,-50%); animation: windline calc(.5s * var(--spd)) ease-out forwards; }
@keyframes windline { 0% { opacity: 0; width: 20px;} 40% { opacity: .9; width: 90px;} 100% { opacity: 0; width: 120px; transform: translate(calc(-50% + 60px * var(--dir)), -50%);} }
.stfly { position: absolute; width: 34px; height: 34px; transform: translate(-50%,-50%); transition: left calc(.4s * var(--spd)) ease-in, top calc(.4s * var(--spd)) ease-in; z-index: 5; }
.stchip.spd { color: #ffb0b0; } .stchip.up { animation: chipUp calc(.5s * var(--spd)) ease-out; }
@keyframes chipUp { 0% { background: #ffd54a; color: #1b1f2a; box-shadow: 0 0 10px #ffd54a;} 100% { background: #000a;} }
.hp.grow { animation: hpGrow calc(.6s * var(--spd)) ease-out; }
@keyframes hpGrow { 0% { box-shadow: 0 0 0 0 #9fe3a8;} 100% { box-shadow: 0 0 0 10px rgba(159,227,168,0);} }
/* 版5：拾いの演出（勝ちの画面） */
.winfly { position: relative; height: 120px; margin: 6px 0; }
.winfly .wf-e { position: absolute; left: 8%; top: 0; width: 100px; height: 100px; }
.winfly .wf-bag { position: absolute; right: 8%; top: 20px; width: 70px; height: 70px; transition: transform calc(.3s * var(--spd)); }
.winfly .wf-card { position: absolute; left: 14%; top: 40px; padding: 6px 12px; border-radius: 10px; background: var(--panel2); border: 3px solid #bcd0ff; font-weight: 900; font-size: 1.1rem; white-space: nowrap; transition: left calc(.7s * var(--spd)) cubic-bezier(.3,.9,.4,1.1), top calc(.7s * var(--spd)) ease-in, transform calc(.7s * var(--spd)) ease-in, opacity calc(.2s * var(--spd)); z-index: 2; }
.winfly.go .wf-card { left: 68%; top: 48px; transform: scale(.5); opacity: 0; }
.winfly .wf-bag.lit { filter: drop-shadow(0 0 12px #ffcc4d); transform: scale(1.15); }
/* 版5：そだち */
#grow { text-align: center; padding-top: 6vh; }
#grow .gmon { width: 220px; height: 220px; margin: 10px auto; }
#grow .gmon.pop { animation: growPop calc(1.2s * var(--spd)) ease-out; }
@keyframes growPop { 0% { transform: scale(.91); filter: brightness(1);} 55% { transform: scale(1.06); filter: brightness(1.6);} 100% { transform: scale(1); filter: brightness(1);} }
#grow .gtitle { font-size: 1.9rem; font-weight: 900; color: var(--accent); min-height: 2.4em; }
#grow .gdesc { font-size: 1.2rem; margin-top: 6px; }
#grow .gtap { color: var(--sub); margin-top: 18px; opacity: 0; transition: opacity .3s; }
#grow .gtap.on { opacity: 1; }
.growhist { color: var(--accent); font-weight: 700; }
/* 版5：殿堂のまとめと王冠 */
.hallsum { background: var(--panel2); border-radius: 12px; padding: 8px 12px; margin: 8px 0; font-weight: 700; }
.hall.best { border-color: var(--gold); }
.crown { color: var(--gold); margin-right: 4px; }
.end-btns { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.end-btns .btn.round { margin: 0; width: 110px; height: 110px; font-size: 2.8rem; }
.end-btns .btn.sub { width: auto; min-width: 160px; }
</style>
</head>
<body>

<div class="volbtn" id="volBtn" title="おんりょう"></div>
<div class="menubtn" id="menuBtn" title="メニュー">≡</div>
<div class="menupop" id="menuPop"><div class="mnote" id="menuNote"></div><button class="btn sub" id="mTitle">タイトルへ</button><button class="btn sub" id="mZukan">ずかん</button><button class="btn sub" id="mDendo">でんどう</button></div>
<div class="overlay" id="confirm"><div class="box"><div class="q" id="confirmQ"></div><button class="btn" id="confirmYes">いいよ</button><button class="btn sub" id="confirmNo">やめる</button></div></div>

  <div class="row"><b>おんりょう</b><span id="volVal">40%</span></div>
  <input type="range" id="volRange" min="0" max="100" step="5" value="40">
  <button class="btn sub mutebtn" id="muteBtn" style="margin-top:8px">ミュート</button>
</div>

<!-- タイトル -->
<div id="title" class="screen on">
  <h1>でこもん</h1>
  <div id="titleMon"></div>
  <button class="btn round" id="startBtn" aria-label="はじめる">▶</button>
  <div class="contlbl" id="contLbl"></div>
  <button class="btn sub" id="newBtn" style="display:none">はじめから</button>
  <button class="btn sub" id="zukanBtn">ずかん <span id="zukanCount"></span></button>
  <button class="btn sub" id="dendoBtn">でんどう <span id="dendoCount"></span></button>
  <div class="ver">版5</div>
</div>

<!-- 図鑑 -->

  <div class="topbar"><div class="big-title">ずかん</div></div>
  <div class="mid-title" style="margin-top:6px">かみあい <span class="sub" id="zukanSub"></span></div>

  <div class="mid-title" style="margin-top:18px">ひらめき <span class="sub" id="sparkSub"></span></div>
  <div id="sparkList"></div>

</div>

</div>

    <div class="col-l">
      <div class="card e">
        <div class="ec-top">
          <div style="flex:1;min-width:0">
            <div class="ec-head"><span class="ec-name" id="eName"></span><span class="met" id="eMet"></span></div>
            <div class="stats">
              <div class="stat"><span class="k">たいりょく</span><span class="v" id="eHpV"></span></div>
              <div class="stat"><span class="k">こうげき</span><span class="v" id="eAtkV"></span></div>
              <div class="stat"><span class="k">はやさ</span><span class="v" id="eSpdV"></span></div>
            </div>
          </div>
          <div id="eMon"></div>
        </div>
        <div class="traits" id="eTraits"></div>
        <div class="label">つけている パーツ</div>
        <div class="minis" id="eParts"></div>
        <div class="reward" id="eReward"></div>
      </div>
      <div class="card f">
        <div class="f-name" id="fName"></div>
        <div class="f-desc" id="fDesc"></div>
      </div>
      <div class="card me">

            spikeExt(cs); glowPart(cs, 'spike', ev.thrown); sfx('spike'); sfx('don');
            setHp(tgt, ev.hp);
            if (ev.deflect) { var cq2 = bodyPt(tgt, true); sparks(cq2.x, cq2.y, 10, 90, '#cfe9ff', true); sfx('scale'); dmgFx(tgt, 'はじいた！', 'counter'); setBig(tgt, 'はじいた！', null, null, 'bighit'); }
            else { hitFx(tgt, cFin, false); dmgFx(tgt, ev.dmg, 'counter'); }
            hitstop(cFin ? 250 : 80); zoomArena(cFin);
            setBig(cs, ev.thrown ? 'ばらまき！ はんげき' : 'トゲ！ はんげき', ev.dmg, null, ev.thrown ? 'bighit' : '');
            if (cFin) { finishFlash(); shakeScreen(); sfx('finish'); }
          });
          if (cFin) tl.at(cPre + 520, function () { fadeDmg(); showResult(tgt === 'e' ? 'たおした！' : 'やられた…', tgt === 'e' ? '#ffcc4d' : '#ff9c9c', true); });
          tl.at(cPre + (cFin ? 250 : 80), function () {
            if (cFin) { playAnim(tgt, 'blow', true); dustFx(tgt); }
            else { playAnim(tgt, 'squash'); dustFx(tgt); }
          });
          tl.add(cPre + 560 + (cFin ? 250 + 900 : 80));
        } else if (ev.t === 'poison') {
          tl.at(0, function () {
            setHp(ev.side, ev.hp);
            dmgFx(ev.side, ev.dmg, 'poison');
            setBig(ev.side, 'どく', ev.dmg, null, 'status');
            sfx('poison');
            if (ST[ev.side].poison) setStatus(ev.side, 'poison', Math.max(1, ST[ev.side].poison - 1));
            if (ev.hp === 0) { playAnim(ev.side, 'blow', true); sfx('finish'); }
          });
          if (ev.hp === 0) tl.at(520, function () { fadeDmg(); showResult(ev.side === 'e' ? 'たおした！' : 'やられた…', ev.side === 'e' ? '#ffcc4d' : '#ff9c9c', true); });
          tl.add(ev.hp === 0 ? 1100 : 450);
        } else if (ev.t === 'synergy') {
          var isNew = ev.side === 'p' && STORE.zukan.indexOf(ev.id) < 0;
          tl.at(0, function () {
            if (ev.side === 'p') { recordSynergy(ev.id); if (OPT.auto) G.auto.synergies[ev.id] = (G.auto.synergies[ev.id] || 0) + 1; }
            if (isNew) foundFx(ev.id, ev.side); else synergyPop(ev.id, ev.side);
          });
          tl.add(isNew ? 1000 : 0);
        } else if (ev.t === 'ko') {
          tl.add(200);
        } else if (ev.t === 'timeout') {
          tl.at(0, function () { setBig('p', ''); setBig('e', ''); showResult('16手 おわり', '#f4f1ea', false); });
          tl.add(1100);
          tl.at(0, function () {
            var pr = Math.round(HP.p / MAX.p * 100), er = Math.round(HP.e / MAX.e * 100);
            setBig('p', 'のこり ' + pr + '%'); setBig('e', 'のこり ' + er + '%');
            $('bResult').className = 'result';
          });
          tl.add(1200);
        }
      });
      tl.add(900);
    });

    var won = res.winner === 'p';
    tl.at(0, function () {
      showResult(won ? 'かち！' : 'まけ…', won ? '#ffcc4d' : '#ff9c9c', false);
      sfx(won ? 'win' : 'lose');
    });
    tl.add(1700);

    runTimeline(tl, function () {
      var mismatch = (HP.p !== res.p.hp) || (HP.e !== res.e.hp) || (handsPlayed !== res.nHands);
      if (mismatch) console.error('[でこもん] 画面と計算がずれた', { shownHp: { p: HP.p, e: HP.e }, simHp: { p: res.p.hp, e: res.e.hp }, shownHands: handsPlayed, simHands: res.nHands });
      if (OPT.auto) { G.auto.battles++; if (mismatch) G.auto.mismatches++; if (won) G.auto.wins++; if (res.spark) G.auto.sparks++; if (res.sparkBy === 'nare') G.auto.sparkNare++; Object.keys(res.summary.lv2Used).forEach(function (pid) { G.auto.lv2Used[pid] = (G.auto.lv2Used[pid] || 0) + 1; }); }
      // なれ：発動した回数を足す（Lv2 になったパーツは もう数えない）
      Object.keys(res.summary.activations).forEach(function (pid) { if (lv2Before.indexOf(pid) < 0) G.nare[pid] = (G.nare[pid] || 0) + res.summary.activations[pid]; });
      if (res.spark) { if (G.lv2.indexOf(res.spark) < 0) G.lv2.push(res.spark); G.sparked.push(res.spark); recordSpark(res.spark); G.pity = 0; } else G.pity++;
      // そだちの材料
      G.acc.received += res.summary.received; G.acc.landed += res.summary.landed; G.acc.first += res.summary.firstHands;
      G.lastParts = used.slice();
      G.history.push({ enemy: e, field: f, parts: used, win: won, hands: res.nHands, timeout: res.timeout, summary: res.summary, spark: res.spark });
      G.lastSummary = { sum: res.summary, enemy: e, spark: res.spark };
      if (won) {
        G.wins++;
        G.picked = null;
        if (G.reward && G.owned.indexOf(G.reward) < 0) { G.owned.push(G.reward); G.picked = G.reward; }
        G.reward = null;
        if (S.growAfterWin(G.wins)) { var gd = S.growDirection(G.acc); G.grow[gd.dir]++; G.growHist.push(gd.dir); G.pendingGrow = gd.dir; G.acc = { received: 0, landed: 0, first: 0 }; if (OPT.auto) G.auto.grows[gd.dir]++; }
        if (G.wins >= S.CFG.runBattles) showClear();
        else showWin();
      } else showOver();
    });
  }

  // ---------- 勝ち・結果 ----------
  function recapHTML(sum, enemyName, won, spark) {
    if (!sum) return '';
    var d = sum.dealt.p;
    var top = Object.keys(d).map(function (k) { return [k, d[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 3);
    var line1 = (won ? 'たおした ' : 'まけた ') + esc(enemyName) + '　あたえた ダメージ：' + (top.length ? top.map(function (x) { return esc(x[0]) + ' ' + x[1]; }).join('／') : 'なし');
    var syn = sum.synergies.filter(function (s) { return s.side === 'p'; }).map(function (s) { return S.SYN_BY_ID[s.id].name; });
    var line2 = syn.length ? '<div>かみあい：<span class="syn">' + syn.map(esc).join('、') + '</span></div>' : '';
    var line3 = spark ? '<div>ひらめき：<span class="spk">' + esc(S.PART_BY_ID[spark].name) + ' Lv2</span></div>' : '';
    return '<div class="t">ふりかえり</div><div>' + line1 + '</div>' + line2 + line3;
  }
  function showWin() {
    $('winTitle').textContent = 'かち！';
    $('winMid').textContent = G.wins === 5 ? '5れんしょう！' : (G.wins + 'れんしょうちゅう');
    var pk = $('picked'), fly = $('winFly');
    var en = G.lastSummary.enemy;
    if (G.picked) {
      var pid = G.picked;
      pk.style.display = 'none';
      fly.style.display = 'block'; fly.className = 'winfly';
      // 相手の体から そのパーツが はずれる（相手のパーツなら体から消す）
      var fromEnemy = en.parts.indexOf(pid) >= 0;
      $('wfE').innerHTML = monsterSVG(en.id, en.parts, 'r', en.traits);
      $('wfCard').textContent = S.PART_BY_ID[pid].name;
      $('wfBag').classList.remove('lit');
      setTimeout(function () {
        if (fromEnemy) { var g = $('wfE').querySelector('.part.' + pid); if (g) g.classList.remove('on'); }
        fly.classList.add('go'); sfx('pick');
      }, 350 / OPT.speed);
      setTimeout(function () { $('wfBag').classList.add('lit'); pk.style.display = 'block'; pk.textContent = 'ひろった：' + S.PART_BY_ID[pid].name; sfx('heal'); }, 1050 / OPT.speed);
    } else { fly.style.display = 'none'; pk.style.display = 'none'; }
    $('recap').innerHTML = recapHTML(G.lastSummary.sum, G.lastSummary.enemy.name, true, G.lastSummary.spark);
    show('win');
    if (OPT.auto) setTimeout(function () { $('winNext').click(); }, 300 / OPT.speed);
  }
  // 勝ちの画面の「つぎへ」：そだちがあれば そだちの画面、なければ 次のバトル前
  function afterWinNext() {
    if (G.pendingGrow) { showGrow(G.pendingGrow, false); return; }
    G.battle++; showPre();
  }
  $('winNext').addEventListener('click', function () { if (G.screen !== 'win') return; afterWinNext(); });
  // ---------- そだち ----------
  var growTimer = null;
  function showGrow(dir, resumed) {
    var gdef = S.GROWS[dir];
    var descs = { tough: 'たいりょくの 上限 +' + S.CFG.grow.hp + '（いまの たいりょくも）、りんかくが ふとく', strong: 'こうげき +' + S.CFG.grow.atk + '、まえはんしんが おおきく', quick: 'はやさ +' + S.CFG.grow.spd + '、ほそながく' };
    $('growTitle').textContent = G.run.name + 'は ' + gdef.name + 'に そだった！';
    $('growDesc').textContent = descs[dir] + '　（' + growHistText(G.growHist) + '）';
    var gm = $('growMon'); gm.className = 'gmon'; gm.innerHTML = monsterSVG('player', G.lastParts || [], 'r', [], G.lv2, G.grow);
    void gm.offsetWidth; gm.classList.add('pop');
    $('growTap').classList.remove('on');
    show('grow'); sfx('bigwin');
    clearTimeout(growTimer);
    growTimer = setTimeout(function () { $('growTap').classList.add('on'); if (OPT.auto) growNext(); }, 1500 / OPT.speed);
  }
  function growNext() {
    if (G.screen !== 'grow') return;
    G.pendingGrow = null;
    G.battle++; showPre();
  }
  $('grow').addEventListener('click', function () { if ($('growTap').classList.contains('on')) growNext(); });

  function historyList(container) {
    container.innerHTML = '';
    G.history.forEach(function (h, i) {
      var it = el('div', 'it');
      it.innerHTML = '<div>' + monsterSVG(h.enemy.id, h.enemy.parts, 'l', h.enemy.traits) + '</div><div class="t"><b>' + (i + 1) + 'せんめ ' + esc(h.enemy.name) + '</b>（' + esc(h.field.name) + '）' + (h.win ? '' : ' <span style="color:var(--bad)">まけ</span>') +
        '<small>つかった：' + (h.parts.length ? h.parts.map(function (p) { return esc(S.PART_BY_ID[p].name); }).join('、') : 'なし') + (h.spark ? '　ひらめき：' + esc(S.PART_BY_ID[h.spark].name) + '「' + esc(S.PART_BY_ID[h.spark].lv2name) + '」' : '') + '</small></div>';
      container.appendChild(it);
    });
  }
  function growHTML() {
    var d = myDef();
    var sp = G.sparked.length ? G.sparked.map(function (p) { return esc(S.PART_BY_ID[p].name) + '「' + esc(S.PART_BY_ID[p].lv2name) + '」'; }).join('、') : 'なし';
    return '<div class="t">そだち</div><div><span class="growhist">' + esc(growHistText(G.growHist)) + '</span></div><div>たいりょく ' + fmt(d.hp) + '（+' + fmt(d.hp - S.CFG.playerHp) + '）／ こうげき ' + fmt(d.atk) + '（+' + fmt(d.atk - S.CFG.playerAtk) + '）／ はやさ ' + fmt(d.spd) + '（+' + fmt(d.spd - S.CFG.playerSpd) + '）</div><div>ひらめいた パーツ：<span class="spk">' + sp + '</span></div>';
  }
  function showClear() {
    enterHall(); renderZukan();
    $('clearName').textContent = G.run.name;
    clearSave();
    $('clearMon').innerHTML = '<div style="width:130px;height:130px">' + monsterSVG('player', G.lastParts || [], 'r', [], G.lv2, G.grow) + '</div>';
    $('clearRecap').innerHTML = recapHTML(G.lastSummary.sum, G.lastSummary.enemy.name, true, G.lastSummary.spark);
    $('clearGrow').innerHTML = growHTML();
    historyList($('clearList'));
    show('clear'); sfx('bigwin');
    if (OPT.auto) { G.auto.runs++; G.auto.clears++; logAuto(); setTimeout(restart, 700 / OPT.speed); }
  }
  function showOver() {
    enterHall(); renderZukan();
    var h = G.history[G.history.length - 1];
    $('overTitle').textContent = G.wins + 'れんしょう で おわり';
    $('overName').textContent = G.run.name;
    clearSave();
    $('overMonMe').innerHTML = '<div style="width:110px;height:110px">' + monsterSVG('player', G.lastParts || [], 'r', [], G.lv2, G.grow) + '</div>';
    $('recapOver').innerHTML = recapHTML(h.summary, h.enemy.name, false, h.spark);
    $('overGrow').innerHTML = growHTML();
    $('overMon').innerHTML = monsterSVG(h.enemy.id, h.enemy.parts, 'l', h.enemy.traits);
    $('overEName').textContent = h.enemy.name;
    var tr = $('overTraits'); tr.innerHTML = '';
    h.enemy.traits.forEach(function (t) { tr.appendChild(traitRow(t, false)); });
    $('overField').textContent = 'フィールド：' + h.field.name;
    $('overParts').textContent = 'あなたの パーツ：' + (h.parts.length ? h.parts.map(function (p) { return S.PART_BY_ID[p].name; }).join('、') : 'なし');
    historyList($('overList'));
    show('over');
    if (OPT.auto) { G.auto.runs++; logAuto(); setTimeout(restart, 700 / OPT.speed); }
  }
  function restart() { G.firstRun = false; startRun(); }
  function logAuto() {
    var a = G.auto;
    console.log('[でこもん auto] 周回 ' + a.runs + '、10連勝 ' + a.clears + '、戦い ' + a.battles + '、勝ち ' + a.wins + '、ずれ ' + a.mismatches + '、ひらめき ' + a.sparks + '（なれ ' + a.sparkNare + '）、そだち ' + JSON.stringify(a.grows) + '、明るさの変化 ' + G.brightChanges + '、重なり ' + a.overlaps + '、透け ' + a.seeThrough + '、噛み合い ' + JSON.stringify(a.synergies) + '、Lv2 ' + JSON.stringify(a.lv2Used) + '、図鑑 ' + STORE.zukan.length + '/8・' + STORE.sparks.length + '/16');
    window.__dekomonAuto = a;
  }

  // ---------- ボタン ----------
  $('titleMon').innerHTML = monsterSVG('player', ['horn', 'wing'], 'r', [], [], null);
  $('startBtn').addEventListener('click', function () {
    initAudio();
    var d = loadSave();
    if (d && !OPT.auto) resumeRun(d); else startRun();
  });
  $('newBtn').addEventListener('click', function () {
    initAudio();
    var d = loadSave();
    if (!d) { startRun(); return; }
    confirmBox(d.run.name + 'の しゅうかいが きえるよ。いい？', function () { clearSave(); startRun(); });
  });
  $('againBtn1').addEventListener('click', function () { initAudio(); restart(); });
  $('againBtn2').addEventListener('click', function () { initAudio(); restart(); });
  $('titleBtn1').addEventListener('click', function () { renderZukan(); renderTitle(); show('title'); });
  $('titleBtn2').addEventListener('click', function () { renderZukan(); renderTitle(); show('title'); });
  renderZukan(); renderTitle();
  window.__dekomon = { G: G, OPT: OPT, seed: seed, STORE: STORE, dbg: { showClear: showClear, showOver: showOver, showPre: showPre, showWin: showWin, showStart: showStart, showGrow: showGrow, saveRun: saveRun, loadSave: loadSave, resumeRun: resumeRun } };
  if (OPT.auto) setTimeout(function () { $('startBtn').click(); }, 300);
})();
</script>
</body>
